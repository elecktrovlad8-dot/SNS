<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Триада: Эхо Забытого Дома</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050508;
            --gold-light: #F4D068;
            --gold-dark: #AA771C;
            --stepan-color: #FF5722;
            --natasha-color: #00E5FF;
            --sonya-color: #B200FF;
            --spirit-color: #4CAF50;
            --danger-color: #FF003C;
            --font-title: 'Cinzel', serif;
            --font-ui: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%; background-color: var(--bg-deep);
            color: #fff; font-family: var(--font-ui); overflow: hidden;
        }

        .hidden { display: none !important; }

        /* --- BACKGROUND FX --- */
        #fx-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%);
        }

        /* --- UI COMPONENTS (PREMIUM FEEL) --- */
        .glass-panel {
            background: rgba(15, 15, 20, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 208, 104, 0.15); border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(244, 208, 104, 0.05);
            padding: 24px; position: relative; z-index: 10;
        }

        .btn {
            background: linear-gradient(135deg, rgba(30,30,35,0.9), rgba(15,15,20,0.9));
            color: var(--gold-light); border: 1px solid var(--gold-dark);
            padding: 16px 24px; font-size: 1rem; border-radius: 8px; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); font-family: var(--font-title);
            text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
            width: 100%; max-width: 340px; margin: 10px auto; display: block;
            position: relative; overflow: hidden; z-index: 10;
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(244, 208, 104, 0.4), transparent);
            transition: 0.5s; z-index: -1;
        }
        .btn:hover::before { left: 100%; }
        .btn:hover { box-shadow: 0 0 20px rgba(170, 119, 28, 0.6); transform: translateY(-2px); }
        .btn.selected { background: linear-gradient(135deg, var(--gold-dark), #553300); color: #fff; box-shadow: 0 0 30px var(--gold-dark); }

        input, select {
            width: 100%; max-width: 340px; padding: 16px; margin: 10px auto; display: block;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-family: var(--font-ui); font-size: 1.1rem; text-align: center;
            border-radius: 8px; outline: none; transition: 0.3s; z-index: 10; position: relative;
        }
        input:focus, select:focus { border-color: var(--gold-light); box-shadow: 0 0 15px rgba(244, 208, 104, 0.3); }
        option { background: var(--bg-deep); color: #fff; }

        /* --- SCREENS --- */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5;
        }

        h1, h2, h3 { font-family: var(--font-title); text-align: center; }
        .title-glow {
            font-size: 3.5rem; text-transform: uppercase; letter-spacing: 5px;
            background: linear-gradient(to bottom, #FFF, var(--gold-dark));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(244, 208, 104, 0.5)); margin-bottom: 10px; z-index: 10;
        }

        /* --- HOST: 3D FIELD --- */
        #host-screen { justify-content: flex-start; padding-top: 5vh; }
        .host-header {
            width: 90%; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(244, 208, 104, 0.3); padding-bottom: 15px; margin-bottom: 4vh; z-index: 10;
        }
        
        .arena-container {
            width: 100%; height: 50vh; display: flex; justify-content: center; align-items: center;
            perspective: 1200px; z-index: 10;
        }
        .room-monolith {
            position: absolute; width: 220px; height: 320px;
            transform-style: preserve-3d; transition: 1s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; justify-content: center; align-items: center;
        }
        .monolith-face {
            position: absolute; width: 100%; height: 100%; border-radius: 12px;
            background: rgba(10,10,15,0.8); border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 15px 35px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            backface-visibility: hidden; font-family: var(--font-title); font-size: 1.5rem;
            backdrop-filter: blur(8px);
        }
        .monolith-back {
            transform: rotateY(180deg); background-size: cover; background-position: center;
            border: 2px solid var(--gold-light);
        }

        .host-status {
            position: absolute; bottom: 5vh; width: 80%; max-width: 700px; text-align: center;
        }
        .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); margin: 15px 0; border-radius: 2px; }
        .progress-fill { height: 100%; width: 0%; background: var(--gold-light); transition: 0.5s; box-shadow: 0 0 15px var(--gold-light); }

        /* --- CINEMATIC ENGINE --- */
        #cinematic-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        #cinematic-overlay.active { opacity: 1; pointer-events: all; }
        #cinematic-text {
            font-family: var(--font-title); font-size: 2.5rem; text-align: center;
            text-shadow: 0 5px 30px #000, 0 0 20px rgba(255,255,255,0.2); padding: 40px; line-height: 1.4;
        }
        .flash { animation: flashAnim 0.3s ease-out; }
        @keyframes flashAnim { 0% { background: #fff; } 100% { background: rgba(0,0,0,0.9); } }
        .shake { animation: shakeAnim 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeAnim { 10%, 90% { transform: translate3d(-5px, 0, 0); } 20%, 80% { transform: translate3d(5px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-10px, 0, 0); } 40%, 60% { transform: translate3d(10px, 0, 0); } }

        /* --- PLAYER PHONE UI --- */
        #player-screen { justify-content: flex-start; padding: 5vh 20px; overflow-y: auto; }
        .player-header {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 400px; margin-bottom: 20px; z-index: 10;
        }
        .stat-box { text-align: center; }
        .stat-val { font-size: 2rem; font-family: var(--font-title); color: var(--gold-light); font-weight: bold; text-shadow: 0 0 10px var(--gold-dark); }
        .stat-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        
        .role-desc { font-size: 0.85rem; color: #ccc; margin-top: 5px; text-transform: none; font-family: var(--font-ui); line-height: 1.4;}

        .card-hand { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .action-select-card { padding: 15px; border-left: 4px solid var(--gold-light); }
        
        /* Roles Colors */
        .color-stepan { color: var(--stepan-color); text-shadow: 0 0 10px rgba(255,87,34,0.5); }
        .color-natasha { color: var(--natasha-color); text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .color-sonya { color: var(--sonya-color); text-shadow: 0 0 10px rgba(178,0,255,0.5); }
    </style>
</head>
<body>

    <!-- FX CANVAS -->
    <canvas id="fx-canvas"></canvas>
    <div class="vignette"></div>

    <!-- MAIN MENU -->
    <div id="main-menu" class="screen">
        <h1 class="title-glow">Триада</h1>
        <h2 style="color: #aaa; letter-spacing: 4px; font-weight: 300; margin-bottom: 50px; z-index: 10;">Эхо Забытого Дома</h2>
        
        <button class="btn" onclick="initHost()">👁️ Врата Хроник (Доска)</button>
        <button class="btn" onclick="showLobby()">📜 Зов Духа (Игрок)</button>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen hidden" style="overflow-y: auto; padding: 20px;">
        <h2 style="margin-bottom: 20px; z-index: 10;">РИТУАЛ ПРИЗЫВА</h2>
        <div class="glass-panel" style="width: 100%; max-width: 400px;">
            <input type="text" id="room-code-input" placeholder="Код Ритуала (4 цифры)" maxlength="4" style="letter-spacing: 8px; font-size: 1.5rem; font-weight: bold;">
            <input type="text" id="player-name" placeholder="Истинное Имя">
            
            <h3 style="margin: 20px 0 10px; font-size: 1rem; color: #aaa;">Выберите Аватара:</h3>
            
            <button class="btn role-btn" onclick="selectRole('Шуршик', this, '#4CAF50')">
                🐭 Дух Дома (Шуршик)
                <div class="role-desc">Сбор осколков. Уязвимы, но хитры. Имеют инвентарь и 3 ед. здоровья.</div>
            </button>
            <button class="btn role-btn" onclick="selectRole('Степан', this, '#FF5722')">
                🦁 Степан (Искатель)
                <div class="role-desc">Спит у дверей. Полностью блокирует вход и выход из локации. Никто в его комнате не соберет Осколки.</div>
            </button>
            <button class="btn role-btn" onclick="selectRole('Наташа', this, '#00E5FF')">
                🌊 Наташа (Голодная Бездна)
                <div class="role-desc">Затапливает комнату. Крадет Осколки у всех, кто не сможет отвлечь её водой.</div>
            </button>
            <button class="btn role-btn" onclick="selectRole('Соня', this, '#B200FF')">
                🌙 Соня (Тень Безмолвия)
                <div class="role-desc">Смертоносна, но пуглива. Атакует только тех, кто производит ШУМ в её комнате.</div>
            </button>

            <button class="btn" style="background: var(--gold-light); color: #000; margin-top: 25px;" onclick="joinGame()">ВОЙТИ В МИР</button>
            <div style="text-align: center; margin-top: 15px; cursor: pointer; color: #888; z-index:10; position:relative;" onclick="showMainMenu()">⬅ Вернуться</div>
        </div>
    </div>

    <!-- HOST SCREEN -->
    <div id="host-screen" class="screen hidden">
        <div id="cinematic-overlay"><div id="cinematic-text"></div></div>

        <div class="host-header">
            <div style="font-family: var(--font-title); font-size: 1.2rem;">КОД РИТУАЛА: <br><span id="display-room-code" style="color: var(--gold-light); font-size: 2.5rem; letter-spacing: 5px;"></span></div>
            <div style="font-family: var(--font-title); font-size: 1.2rem; text-align: right;">ЧАС НОЧИ: <br><span id="round-counter" style="color: var(--gold-light); font-size: 2.5rem;">1 / 7</span></div>
        </div>
        
        <div class="arena-container" id="arena">
            <!-- Rooms generated via JS -->
        </div>

        <div class="host-status glass-panel">
            <div id="readiness-text" style="font-size: 1.2rem; color: #ccc;">Ожидание плетения судеб...</div>
            <div class="progress-track"><div class="progress-fill" id="readiness-bar"></div></div>
            <div style="font-size: 1rem; color: #888;">Сущностей в ритуале: <span id="player-count" style="color: #fff; font-weight: bold; font-size: 1.2rem;">0</span></div>
        </div>
    </div>

    <!-- PLAYER SCREEN -->
    <div id="player-screen" class="screen hidden">
        <div class="player-header glass-panel" style="padding: 15px;">
            <div class="stat-box">
                <div class="stat-label">Имя</div>
                <div id="my-name-display" style="font-weight: bold; color: #fff;">Name</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Осколки</div>
                <div class="stat-val" id="my-coins">0</div>
            </div>
            <div class="stat-box" id="hp-box">
                <div class="stat-label">Жизнь</div>
                <div class="stat-val" id="my-hp" style="color: var(--danger-color); text-shadow: 0 0 10px var(--danger-color);">3</div>
            </div>
        </div>

        <h2 style="margin-bottom: 5px; z-index: 10; font-size: 1.2rem;">Роль: <span id="my-role" class="color-stepan"></span></h2>
        <p id="player-status" style="color: #aaa; margin-bottom: 20px; z-index: 10; text-align: center;">Выберите локацию и действие.</p>

        <div class="card-hand">
            <div class="glass-panel action-select-card">
                <div class="stat-label" style="margin-bottom: 10px;">Куда направим шаг?</div>
                <select id="room-select">
                    <option value="Кухня">Ущелье Котлов (Кухня)</option>
                    <option value="Зал">Великая Пустошь (Зал)</option>
                    <option value="Спальня">Грот Сновидений (Спальня)</option>
                    <option value="Коридор">Перекресток Ветров (Коридор)</option>
                </select>
            </div>

            <div class="glass-panel action-select-card hidden" id="actions-shurshik">
                <div class="stat-label" style="margin-bottom: 10px;">Техника Духа</div>
                <select id="action-select-shurshik">
                    <option value="Жадный поиск">⚔️ Жадный поиск (+2 Осколка, ШУМНО - риск от Сони)</option>
                    <option value="Скрытный шаг">🥷 Скрытный шаг (+1 Осколок, ТИХО - защита от Сони)</option>
                    <option value="Включить воду">💧 Включить воду (0 Осколков, Завораживает Наташу)</option>
                </select>
            </div>

            <button class="btn" id="btn-submit-action" style="background: var(--gold-light); color: #000; padding: 20px; font-size: 1.2rem;" onclick="submitAction()">СВЕРШИТЬ СУДЬБУ</button>
        </div>
    </div>

    <!-- MAIN LOGIC -->
    <script>
        /* --- GLOBALS --- */
        let peer = null, hostConnection = null;
        let playersData = {}, playerConnections = {};
        let selectedRole = '', myRole = '', myCoins = 0, myHp = 3;
        let currentRound = 1;
        const MAX_ROUNDS = 7;
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const ROOMS = ["Кухня", "Зал", "Спальня", "Коридор"];

        /* --- FX ENGINE (CANVAS) --- */
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let fxMode = 'mist'; // mist, embers, water

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class Particle {
            constructor() { this.reset(); this.y = Math.random() * canvas.height; }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * -1 - 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.life = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speedY; this.x += this.speedX;
                if (fxMode === 'water') this.y += 2; // Water falls down
                if (this.y < -10 || this.y > canvas.height + 20) this.reset();
            }
            draw() {
                ctx.beginPath();
                if (fxMode === 'embers') {
                    ctx.fillStyle = `rgba(255, 87, 34, ${this.life})`;
                    ctx.shadowBlur = 10; ctx.shadowColor = '#FF5722';
                } else if (fxMode === 'water') {
                    ctx.fillStyle = `rgba(0, 229, 255, ${this.life})`;
                    ctx.shadowBlur = 5; ctx.shadowColor = '#00E5FF';
                } else {
                    ctx.fillStyle = `rgba(178, 0, 255, ${this.life * 0.3})`;
                    ctx.shadowBlur = 20; ctx.shadowColor = '#B200FF';
                    this.size = Math.random() * 10 + 5;
                }
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < 60; i++) particles.push(new Particle());
        
        function animateFx() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateFx);
        }
        animateFx();

        function setFxMode(mode) { fxMode = mode; particles.forEach(p => p.reset()); }

        /* --- NAVIGATION --- */
        function show(id) {
            ['main-menu', 'lobby-screen', 'host-screen', 'player-screen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        function showLobby() { show('lobby-screen'); }
        function showMainMenu() { show('main-menu'); peer?.destroy(); }

        function selectRole(role, btnElement, color) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
        }

        /* --- HOST 3D ARENA --- */
        function setupArena() {
            const arena = document.getElementById('arena');
            arena.innerHTML = '';
            ROOMS.forEach((r, i) => {
                const angle = (i * 90) * (Math.PI / 180);
                const radius = 280;
                const x = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius;
                
                const monolith = document.createElement('div');
                monolith.className = 'room-monolith';
                monolith.id = `room-${r}`;
                monolith.style.transform = `translate3d(${x}px, 0, ${z}px) rotateY(${i*90}deg)`;
                
                monolith.innerHTML = `
                    <div class="monolith-face" style="color:#fff;">
                        <span style="font-size:0.8rem; color:#aaa;">ЛОКАЦИЯ</span>
                        ${r}
                    </div>
                `;
                arena.appendChild(monolith);
            });
        }

        async function focusMonolith(roomName, color, text) {
            const arena = document.getElementById('arena');
            const targetIndex = ROOMS.indexOf(roomName);
            // Spin arena to face the room
            arena.style.transition = 'transform 1s cubic-bezier(0.2, 0.8, 0.2, 1)';
            arena.style.transform = `rotateY(${-targetIndex * 90}deg) translateZ(100px)`;
            
            const monolith = document.getElementById(`room-${roomName}`);
            const face = monolith.querySelector('.monolith-face');
            const originalBoxShadow = face.style.boxShadow;
            
            face.style.boxShadow = `0 0 50px ${color}, inset 0 0 30px ${color}`;
            face.innerHTML = `<span style="font-size:0.8rem; color:#fff; text-shadow:none;">${text}</span><br>${roomName}`;
            
            await sleep(3500);
            
            // Reset
            face.style.boxShadow = originalBoxShadow;
            face.innerHTML = `<span style="font-size:0.8rem; color:#aaa;">ЛОКАЦИЯ</span>${roomName}`;
            arena.style.transform = `rotateY(0deg) translateZ(0px)`;
            await sleep(1000);
        }


        /* --- HOST LOGIC --- */
        function initHost() {
            show('host-screen');
            setupArena();
            
            const roomCode = String(Math.floor(1000 + Math.random() * 9000));
            document.getElementById('display-room-code').innerText = roomCode;

            peer = new Peer(roomCode);
            peer.on('connection', (conn) => {
                conn.on('data', (data) => handleDataFromPlayer(conn.peer, data));
                playerConnections[conn.peer] = conn;
                updateHostUI();
            });
        }

        function handleDataFromPlayer(peerId, data) {
            if (data.type === 'JOIN') {
                playersData[peerId] = { name: data.name, role: data.role, coins: 0, hp: 3, ready: false };
                updateHostUI();
            }
            if (data.type === 'ACTION') {
                playersData[peerId].room = data.room;
                playersData[peerId].action = data.action;
                playersData[peerId].ready = true;
                updateHostUI();
            }
        }

        function updateHostUI() {
            const total = Object.keys(playersData).length;
            const readyCount = Object.values(playersData).filter(p => p.ready).length;
            
            document.getElementById('player-count').innerText = total;
            const statusText = document.getElementById('readiness-text');
            const progressBar = document.getElementById('readiness-bar');

            if (total === 0) return;
            progressBar.style.width = `${(readyCount / total) * 100}%`;

            if (readyCount < total) {
                statusText.innerHTML = `Плетение судеб... <span style="color:var(--gold-light);">${readyCount}/${total}</span>`;
            } else {
                statusText.innerHTML = `<span style="color:var(--spirit-color);">Нити натянуты. Время Развязки.</span>`;
                setTimeout(resolveRound, 1200);
            }
        }

        async function cinematicLog(html, color = "#fff", duration = 3000, fx = null, shake = false) {
            const overlay = document.getElementById('cinematic-overlay');
            const textBox = document.getElementById('cinematic-text');
            if (fx) setFxMode(fx);
            if (shake) overlay.classList.add('shake');
            
            textBox.innerHTML = html; 
            textBox.style.color = color;
            overlay.classList.add('active');
            
            await sleep(duration);
            overlay.classList.remove('active');
            overlay.classList.remove('shake');
            await sleep(600);
        }

        /* --- THE GAME ENGINE (RESOLUTION PHASE) --- */
        async function resolveRound() {
            // Prevent double triggers
            Object.values(playersData).forEach(p => p.ready = false);

            await cinematicLog(`ЧАС ${currentRound} ИЗ ${MAX_ROUNDS}<br><span style="font-size:1.5rem; color:#aaa;">Дом пробуждается...</span>`, "var(--gold-light)", 2000, 'mist');

            // 1. Identify Cat Locations
            let cats = { Stepan: null, Natasha: null, Sonya: null };
            let spirits = [];

            for (const [id, p] of Object.entries(playersData)) {
                if(p.hp <= 0) continue; // Dead spirits do nothing
                if(p.role === 'Степан') cats.Stepan = p.room;
                else if(p.role === 'Наташа') cats.Natasha = p.room;
                else if(p.role === 'Соня') cats.Sonya = p.room;
                else if(p.role === 'Шуршик') spirits.push({id, ...p});
            }

            // 2. Announce Cat Placements
            if (cats.Stepan) {
                await cinematicLog(`🦁 СТЕПАН лег у дверей в локации:<br><span style="color:var(--stepan-color)">${cats.Stepan}</span><br><span style="font-size:1.2rem">Вход заблокирован!</span>`, "#fff", 2500, 'embers');
                await focusMonolith(cats.Stepan, 'var(--stepan-color)', 'Врата Закрыты');
            }
            if (cats.Natasha) {
                await cinematicLog(`🌊 НАТАША открыла потоки в локации:<br><span style="color:var(--natasha-color)">${cats.Natasha}</span><br><span style="font-size:1.2rem">Начинается потоп...</span>`, "#fff", 2500, 'water');
                await focusMonolith(cats.Natasha, 'var(--natasha-color)', 'Бездна');
            }
            if (cats.Sonya) {
                await cinematicLog(`🌙 СОНЯ дремлет в тенях локации:<br><span style="color:var(--sonya-color)">${cats.Sonya}</span><br><span style="font-size:1.2rem">Не шумите...</span>`, "#fff", 2500, 'mist');
            }

            // 3. Resolve Spirit Actions
            for (let sp of spirits) {
                await cinematicLog(`Дух <span style="color:var(--gold-light)">${sp.name}</span> проникает в ${sp.room}...`, "#ccc", 1500, 'mist');

                // Check Stepan (Absolute Block)
                if (sp.room === cats.Stepan) {
                    await cinematicLog(`💥 УДАР! Степан преграждает путь!<br>${sp.name} теряет ход и 1 Жизнь!`, "var(--stepan-color)", 3000, 'embers', true);
                    playersData[sp.id].hp -= 1;
                    continue; // Action completely blocked
                }

                // Check Sonya (Sound mechanics)
                if (sp.room === cats.Sonya) {
                    if (sp.action === 'Жадный поиск') {
                        await focusMonolith(cats.Sonya, 'var(--sonya-color)', 'ПРОБУЖДЕНИЕ');
                        await cinematicLog(`КРИТИЧЕСКАЯ ОШИБКА!<br>Громкий звук будит Соню!`, "var(--danger-color)", 2000, 'mist', true);
                        await cinematicLog(`Теневые когти наносят 2 Урона!<br>${sp.name} роняет осколки!`, "var(--sonya-color)", 3000, 'mist', true);
                        playersData[sp.id].hp -= 2;
                        continue;
                    } else if (sp.action === 'Скрытный шаг') {
                        await cinematicLog(`🌙 Соня продолжает спать...<br>${sp.name} безопасно проходит рядом.`, "#aaa", 2000);
                    }
                }

                // Check Natasha (Water/Greed mechanics)
                if (sp.room === cats.Natasha) {
                    if (sp.action === 'Включить воду') {
                        await cinematicLog(`💧 УСПЕХ! ${sp.name} включает воду!<br>Наташа заворожена игрой струй.`, "var(--natasha-color)", 3000, 'water');
                        // Survives but gets 0 coins from this action
                    } else {
                        await cinematicLog(`🌊 ПОТОП! Водоворот Наташи затягивает ${sp.name}!`, "var(--natasha-color)", 2500, 'water', true);
                        if (playersData[sp.id].coins > 0) {
                            playersData[sp.id].coins = 0;
                            await cinematicLog(`Наташа съедает ВСЕ осколки ${sp.name}!`, "var(--danger-color)", 2500);
                        } else {
                            playersData[sp.id].hp -= 1;
                            await cinematicLog(`У ${sp.name} нет осколков... Наташа кусает за ногу! (-1 HP)`, "var(--danger-color)", 2500);
                        }
                    }
                    continue; // Reached end of Natasha interaction
                }

                // Standard Resolution (If survived)
                if (sp.action === 'Жадный поиск') {
                    playersData[sp.id].coins += 2;
                    await cinematicLog(`✨ Успех! ${sp.name} находит 2 Осколка!`, "var(--gold-light)");
                } else if (sp.action === 'Скрытный шаг') {
                    playersData[sp.id].coins += 1;
                    await cinematicLog(`🥷 ${sp.name} тихо крадет 1 Осколок.`, "var(--spirit-color)");
                } else if (sp.action === 'Включить воду') {
                    await cinematicLog(`💧 ${sp.name} налил воду, но здесь никого нет... (0 Осколков)`, "#888");
                }
            }

            // Check Deaths
            for (let sp of spirits) {
                if (playersData[sp.id].hp <= 0) {
                    await cinematicLog(`💀 ДУХ РАССЕЯН! ${sp.name} покидает этот мир...`, "var(--danger-color)", 3000, 'mist');
                }
            }

            currentRound++;
            if (currentRound > MAX_ROUNDS) {
                await cinematicLog("🌅 ЛУЧИ РАССВЕТА...<br>Дом растворяется в тумане. ИГРА ОКОНЧЕНА!", "var(--gold-light)", 8000, 'mist');
                // Could display winner here based on coins
            } else {
                await cinematicLog("Тьма сгущается вновь... Готовьтесь.", "#555", 2000, 'mist');
                
                // Send updates to phones
                Object.keys(playerConnections).forEach(id => {
                    const pd = playersData[id];
                    playerConnections[id].send({ type: 'ROUND_END', coins: pd.coins, hp: pd.hp, round: currentRound });
                });
                
                document.getElementById('round-counter').innerText = `${currentRound} / ${MAX_ROUNDS}`;
                updateHostUI();
            }
        }

        /* --- PLAYER PHONE LOGIC --- */
        function joinGame() {
            const roomCode = document.getElementById('room-code-input').value;
            const playerName = document.getElementById('player-name').value;
            
            if (!roomCode || !playerName || !selectedRole) { 
                alert("Заполните код, имя и выберите Аватара!"); return; 
            }

            event.target.innerText = "ПОДКЛЮЧЕНИЕ..."; event.target.disabled = true;

            peer = new Peer(); 
            peer.on('open', (id) => {
                hostConnection = peer.connect(roomCode);
                
                hostConnection.on('open', () => {
                    hostConnection.send({ type: 'JOIN', name: playerName, role: selectedRole });
                    myRole = selectedRole;
                    document.getElementById('my-name-display').innerText = playerName;
                    
                    const roleSpan = document.getElementById('my-role');
                    roleSpan.innerText = myRole;
                    
                    if (myRole === 'Шуршик') {
                        document.getElementById('actions-shurshik').classList.remove('hidden');
                        roleSpan.className = 'color-spirit';
                    } else if (myRole === 'Степан') {
                        document.getElementById('hp-box').classList.add('hidden'); // Cats don't have HP
                        roleSpan.className = 'color-stepan';
                    } else if (myRole === 'Наташа') {
                        document.getElementById('hp-box').classList.add('hidden');
                        roleSpan.className = 'color-natasha';
                    } else if (myRole === 'Соня') {
                        document.getElementById('hp-box').classList.add('hidden');
                        roleSpan.className = 'color-sonya';
                    }
                    
                    show('player-screen');
                });
                
                hostConnection.on('data', (data) => {
                    if (data.type === 'ROUND_END') {
                        myCoins = data.coins;
                        myHp = data.hp;
                        document.getElementById('my-coins').innerText = myCoins;
                        if(myRole === 'Шуршик') document.getElementById('my-hp').innerText = myHp;
                        
                        if (myHp <= 0 && myRole === 'Шуршик') {
                            document.getElementById('player-status').innerHTML = "<span style='color:red;'>ВЫ МЕРТВЫ. ВЫ СТАЛИ ТЕНЬЮ.</span>";
                            document.getElementById('btn-submit-action').classList.add('hidden');
                        } else {
                            document.getElementById('btn-submit-action').classList.remove('hidden');
                            document.getElementById('player-status').innerText = `Час ${data.round}. Выберите следующий шаг.`;
                        }
                    }
                });
            });
            
            peer.on('error', function(err) {
                alert("Ошибка! Врата не найдены. Проверьте код.");
                document.querySelector('.btn[onclick="joinGame()"]').innerText = "ВОЙТИ В МИР";
                document.querySelector('.btn[onclick="joinGame()"]').disabled = false;
            });
        }

        function submitAction() {
            const room = document.getElementById('room-select').value;
            let action = myRole === 'Шуршик' ? document.getElementById('action-select-shurshik').value : 'Влияние Аватара';

            hostConnection.send({ type: 'ACTION', room: room, action: action });
            document.getElementById('btn-submit-action').classList.add('hidden');
            document.getElementById('player-status').innerHTML = "Решение принято.<br><span style='color:var(--gold-light);'>Смотрите на Врата (Главный экран).</span>";
        }
    </script>
</body>
</html>
