<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Триада: Расколотый Город (Шедевр)</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060609;
            --panel-bg: rgba(15, 15, 22, 0.7);
            
            /* Фракции */
            --faction-stepan: #FF5722; /* Кузня (Медь/Огонь) */
            --faction-natasha: #00E5FF; /* Тени (Вода/Неон) */
            --faction-sonya: #B200FF; /* Эхо (Магия/Аметист) */
            --gold: #D4AF37;
            
            --font-title: 'Cinzel', serif;
            --font-ui: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: var(--bg-base); color: #fff; font-family: var(--font-ui); overflow: hidden; }
        .hidden { display: none !important; }

        /* --- FX ФОН --- */
        #fx-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .vignette { position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, transparent 20%, #030305 100%); z-index: 2; pointer-events: none; }

        /* --- БАЗОВЫЕ ЭЛЕМЕНТЫ UI --- */
        h1, h2, h3 { font-family: var(--font-title); text-align: center; font-weight: 700; }
        .glass { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        .btn {
            background: linear-gradient(180deg, rgba(40,40,50,0.8), rgba(20,20,25,0.9));
            color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 15px 30px; font-family: var(--font-title); font-size: 1.2rem;
            border-radius: 4px; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 2px; width: 100%; max-width: 320px; margin: 10px auto; display: block;
            position: relative; overflow: hidden; z-index: 10;
        }
        .btn:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); transform: translateY(-2px); }
        .btn.selected { background: linear-gradient(180deg, rgba(212, 175, 55, 0.3), rgba(0,0,0,0.9)); border-color: var(--gold); box-shadow: 0 0 20px var(--gold); color: #fff;}

        input {
            width: 100%; max-width: 320px; padding: 15px; margin: 10px auto; display: block;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
            color: #fff; font-family: var(--font-ui); font-size: 1.2rem; text-align: center; outline: none; z-index: 10; position: relative;
        }
        input:focus { border-color: var(--gold); }

        .screen { position: absolute; top:0; left:0; width:100%; height:100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }

        /* --- ГЛАВНЫЙ ЭКРАН (КАРТА ГОРОДА) --- */
        #host-screen { justify-content: flex-start; padding: 40px; }
        .header { display: flex; justify-content: space-between; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; z-index: 10; }
        .header-title { font-size: 1.5rem; letter-spacing: 3px; color: #aaa; }
        .header-val { font-size: 2.5rem; color: var(--gold); font-family: var(--font-title); }

        /* Модульное поле */
        .city-map {
            position: relative; width: 800px; height: 500px; margin-top: 50px; z-index: 10;
            display: flex; justify-content: center; align-items: center;
        }
        .district {
            position: absolute; width: 180px; height: 180px;
            background: radial-gradient(circle at top left, rgba(40,40,50,0.9), rgba(10,10,15,0.9));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8);
            transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .district::before { content:''; position:absolute; top:-2px; left:-2px; right:-2px; bottom:-2px; border-radius: 50%; background: linear-gradient(45deg, transparent, var(--gold), transparent); z-index: -1; opacity: 0.3; }
        .district-name { font-family: var(--font-title); font-size: 1.2rem; font-weight: 700; text-align: center; z-index: 2;}
        .district-players { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; justify-content: center; z-index: 2;}
        .player-token { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 10px #000; }

        /* Кинематографичный лог */
        #cine-log {
            position: absolute; bottom: 40px; width: 80%; max-width: 800px;
            text-align: center; font-size: 1.8rem; padding: 20px; z-index: 20;
            text-shadow: 0 4px 15px #000; opacity: 0; transition: opacity 0.3s;
        }

        /* --- ЭКРАН ИГРОКА (ТЕЛЕФОН) --- */
        #player-screen { justify-content: flex-start; padding: 20px; overflow-y: auto; display: block;}
        
        /* Планшет героя */
        .player-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; z-index: 10; position: relative;}
        .stat-card { padding: 15px; text-align: center; }
        .stat-title { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px;}
        .stat-value { font-size: 2rem; font-family: var(--font-title); margin-top: 5px;}
        
        /* Инвентарь */
        .inventory-slots { display: flex; justify-content: space-between; margin-bottom: 20px; z-index: 10; position: relative;}
        .slot { width: 30%; aspect-ratio: 1; border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);}
        .slot.filled { border-style: solid; border-color: var(--gold); color: #fff; background: rgba(212, 175, 55, 0.1); box-shadow: inset 0 0 15px rgba(212,175,55,0.2);}

        /* Колода Действий (Таро стиль) */
        .hand-container { display: flex; flex-direction: column; gap: 15px; z-index: 10; position: relative; padding-bottom: 50px;}
        .action-card {
            background: linear-gradient(135deg, rgba(30,30,40,0.95), rgba(15,15,20,0.95));
            border: 1px solid #444; border-radius: 12px; padding: 20px;
            display: grid; grid-template-columns: 50px 1fr; gap: 15px; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .action-card.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(1); }
        .action-card:active { transform: scale(0.98); }
        .card-init {
            width: 50px; height: 50px; border-radius: 50%; background: var(--bg-base); border: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 1.5rem; color: var(--gold);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .card-info h4 { font-size: 1.3rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .card-info p { font-size: 0.9rem; color: #aaa; line-height: 1.2;}

    </style>
</head>
<body>

    <!-- Рендер FX -->
    <canvas id="fx-canvas"></canvas>
    <div class="vignette"></div>

    <!-- МЕНЮ -->
    <div id="main-menu" class="screen">
        <h1 style="font-size: 4rem; text-transform: uppercase; letter-spacing: 8px; color: #fff; text-shadow: 0 0 20px var(--gold); margin-bottom: 0; z-index: 10;">ТРИАДА</h1>
        <h2 style="font-size: 1.5rem; color: #888; font-family: var(--font-ui); font-weight: 400; letter-spacing: 5px; margin-bottom: 50px; z-index: 10;">РАСКОЛОТЫЙ ГОРОД</h2>
        <button class="btn" onclick="initHost()">👁️ Создать Город (Стол)</button>
        <button class="btn" onclick="show('lobby-screen')">📜 Возглавить Гильдию (Игрок)</button>
    </div>

    <!-- ЛОББИ ИГРОКА -->
    <div id="lobby-screen" class="screen hidden">
        <div class="glass" style="padding: 30px; width: 90%; max-width: 400px; text-align: center;">
            <h2 style="margin-bottom: 20px; color: var(--gold);">РИТУАЛ ОСНОВАТЕЛЕЙ</h2>
            <input type="text" id="room-code" placeholder="Код Города" maxlength="4" style="letter-spacing: 5px; font-weight: bold;">
            <input type="text" id="player-name" placeholder="Имя Лидера">
            
            <h3 style="margin: 20px 0 10px; font-size: 1rem; color: #aaa;">Выберите Покровителя:</h3>
            <button class="btn role-btn" style="border-color: var(--faction-stepan); color: var(--faction-stepan);" onclick="selectFaction('Stepan', this)">
                Кузня Степана<br><span style="font-size:0.7rem; color:#888;">Защита. Старт: Броня.</span>
            </button>
            <button class="btn role-btn" style="border-color: var(--faction-natasha); color: var(--faction-natasha);" onclick="selectFaction('Natasha', this)">
                Тени Наташи<br><span style="font-size:0.7rem; color:#888;">Блеф. Старт: +Кинжал.</span>
            </button>
            <button class="btn role-btn" style="border-color: var(--faction-sonya); color: var(--faction-sonya);" onclick="selectFaction('Sonya', this)">
                Эхо Сони<br><span style="font-size:0.7rem; color:#888;">Магия. Старт: Амулет.</span>
            </button>

            <button class="btn" style="background: var(--gold); color: #000; margin-top: 20px;" onclick="joinGame()">ВОЙТИ В СОВЕТ</button>
        </div>
    </div>

    <!-- ЭКРАН ХОСТА (СТОЛ) -->
    <div id="host-screen" class="screen hidden">
        <div class="header">
            <div><div class="header-title">КОД ДОСТУПА</div><div class="header-val" id="display-code">----</div></div>
            <div style="text-align: right;"><div class="header-title">ЦИКЛ (РАУНД)</div><div class="header-val" id="round-counter">1 / 10</div></div>
        </div>

        <div class="city-map" id="map-container">
            <!-- Районы генерируются через JS -->
        </div>

        <div id="cine-log" class="glass">Ожидание лидеров гильдий...</div>
    </div>

    <!-- ЭКРАН ИГРОКА (ТЕЛЕФОН) -->
    <div id="player-screen" class="screen hidden">
        <h2 style="font-size: 1.2rem; color: var(--gold); text-align: left; margin-bottom: 10px; width: 100%; z-index:10;" id="my-name-display">Имя</h2>
        
        <div class="player-dashboard">
            <div class="glass stat-card">
                <div class="stat-title">Победные Очки (ПО)</div>
                <div class="stat-value" id="vp-display" style="color: var(--gold);">0</div>
            </div>
            <div class="glass stat-card">
                <div class="stat-title">Эфир (Валюта)</div>
                <div class="stat-value" id="eth-display" style="color: #00E5FF;">0</div>
            </div>
        </div>

        <div class="stat-title" style="margin-bottom: 5px; z-index:10; position:relative;">Ваш Инвентарь</div>
        <div class="inventory-slots">
            <div class="slot" id="inv-amulet" title="Амулет">🧿</div>
            <div class="slot" id="inv-weapon" title="Оружие">⚔️</div>
            <div class="slot" id="inv-armor" title="Броня">🛡️</div>
        </div>

        <div class="glass" style="padding: 15px; margin-bottom: 20px; text-align: center; z-index: 10; position: relative;">
            <div class="stat-title">Текущая Локация</div>
            <div id="my-location" style="font-family: var(--font-title); font-size: 1.5rem; margin-top: 5px;">Шпиль Раскола</div>
        </div>

        <div class="stat-title" style="margin-bottom: 10px; z-index:10; position:relative;" id="action-header">Фаза Интриг: Выберите действие</div>
        <div class="hand-container" id="cards-container">
            <!-- Карты генерируются JS -->
        </div>
    </div>

    <!-- ЯДРО ИГРЫ (ЛОГИКА) -->
    <script>
        /* --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ --- */
        let peer = null, hostConn = null;
        let players = {}; // { id: { name, faction, vp, eth, loc, inv: {am, wp, ar}, action: null } }
        let currentRound = 1;
        let phase = 'LOBBY'; // LOBBY, DRAFT, RESOLVE
        
        const DISTRICTS = [
            { id: 0, name: 'Кузня Реальности', x: -250, y: -150, color: 'var(--faction-stepan)' },
            { id: 1, name: 'Теневые Каналы', x: 250, y: -150, color: 'var(--faction-natasha)' },
            { id: 2, name: 'Сады Эха', x: -250, y: 150, color: 'var(--faction-sonya)' },
            { id: 3, name: 'Шпиль Раскола', x: 0, y: 0, color: 'var(--gold)' } // Центр
        ];

        // Колода действий игрока. Инициатива: 1 (самая быстрая) - 10 (медленная).
        const CARDS = [
            { id: 'move', title: 'Перемещение', desc: 'Перейдите в любой Район Города.', init: 2, icon: '🏃' },
            { id: 'gather', title: 'Сбор Эфира', desc: 'Получите 2 Эфира в текущей локации.', init: 5, icon: '💎' },
            { id: 'attack', title: 'Удар в спину', desc: 'Украсть 1 ПО у игрока в вашей локации.', init: 8, icon: '🗡️' },
            { id: 'evolve', title: 'Модернизация', desc: 'Потратьте 3 Эфира на +1 ПО.', init: 9, icon: '⚙️' }
        ];

        let myId = '', myFaction = '', selectedFaction = '';
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        /* --- FX КАНВАС (ЧАСТИЦЫ) --- */
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        function renderFx() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.y -= p.speed; p.x += Math.sin(p.angle) * 0.5; p.alpha -= 0.005;
                if (p.alpha <= 0) particles.splice(i, 1);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fillStyle = `rgba(212,175,55,${p.alpha})`; ctx.shadowBlur = 10; ctx.shadowColor = '#D4AF37'; ctx.fill();
            });
            if (Math.random() < 0.2) particles.push({ x: Math.random()*canvas.width, y: canvas.height+10, size: Math.random()*2+1, speed: Math.random()*1+0.5, angle: Math.random()*Math.PI*2, alpha: Math.random()*0.5+0.2 });
            requestAnimationFrame(renderFx);
        }
        renderFx();

        /* --- НАВИГАЦИЯ --- */
        function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function selectFaction(f, btn) { selectedFaction = f; document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); }

        /* ================= ХОСТ (ИГРОВОЙ ДВИЖОК) ================= */
        function initHost() {
            show('host-screen');
            drawMap();
            
            const code = String(Math.floor(1000 + Math.random() * 9000));
            document.getElementById('display-code').innerText = code;
            
            peer = new Peer(code);
            peer.on('connection', (conn) => {
                conn.on('data', (data) => processHostData(conn.peer, conn, data));
            });
        }

        function drawMap() {
            const container = document.getElementById('map-container');
            container.innerHTML = '';
            DISTRICTS.forEach(d => {
                const el = document.createElement('div');
                el.className = 'district';
                el.id = `dist-${d.id}`;
                el.style.transform = `translate(${d.x}px, ${d.y}px)`;
                el.style.borderColor = d.color;
                el.innerHTML = `<div class="district-name" style="color:${d.color}">${d.name}</div><div class="district-players" id="dist-players-${d.id}"></div>`;
                container.appendChild(el);
            });
        }

        function updateHostMap() {
            DISTRICTS.forEach(d => document.getElementById(`dist-players-${d.id}`).innerHTML = '');
            Object.values(players).forEach(p => {
                if (p.loc !== null) {
                    const token = document.createElement('div');
                    token.className = 'player-token';
                    // Цвет фишки по фракции
                    let color = p.faction==='Stepan'?'#FF5722':p.faction==='Natasha'?'#00E5FF':'#B200FF';
                    token.style.background = color;
                    token.title = p.name;
                    document.getElementById(`dist-players-${p.loc}`).appendChild(token);
                }
            });
        }

        function processHostData(id, conn, data) {
            if (data.type === 'JOIN') {
                // Инициализация RPG статов
                let inv = { am: false, wp: false, ar: false };
                if(data.faction === 'Stepan') inv.ar = true;
                if(data.faction === 'Natasha') inv.wp = true;
                if(data.faction === 'Sonya') inv.am = true;

                players[id] = { conn, name: data.name, faction: data.faction, vp: 0, eth: 2, loc: 3, inv: inv, action: null };
                logCine(`${data.name} прибыл в город.`, '#fff');
                updateHostMap();
                broadcastState();
                
                if(Object.keys(players).length >= 2 && phase === 'LOBBY') {
                    phase = 'DRAFT';
                    setTimeout(() => logCine(`Город ждет ваших приказов...`, 'var(--gold)'), 2000);
                }
            }
            if (data.type === 'ACTION' && phase === 'DRAFT') {
                players[id].action = data.action; // { cardId, targetLoc }
                checkAllReady();
            }
        }

        async function logCine(text, color) {
            const log = document.getElementById('cine-log');
            log.innerHTML = text; log.style.color = color;
            log.style.opacity = 1;
            await sleep(2500);
            log.style.opacity = 0;
            await sleep(500);
        }

        function checkAllReady() {
            const allReady = Object.values(players).every(p => p.action !== null);
            if (allReady) {
                phase = 'RESOLVE';
                resolveRound();
            } else {
                const count = Object.values(players).filter(p => p.action !== null).length;
                const total = Object.keys(players).length;
                document.getElementById('cine-log').innerHTML = `Плетение интриг... ${count}/${total}`;
                document.getElementById('cine-log').style.opacity = 1;
            }
        }

        async function resolveRound() {
            await logCine(`ЧАС ${currentRound}. НАЧАЛО.`, 'var(--gold)');
            
            // 1. Собираем и сортируем действия по инициативе (1 -> 10)
            let actions = [];
            for (let id in players) {
                const card = CARDS.find(c => c.id === players[id].action.cardId);
                actions.push({ id, p: players[id], card, targetLoc: players[id].action.targetLoc });
            }
            actions.sort((a, b) => a.card.init - b.card.init);

            // 2. Отыгрываем действия по очереди (RPG Движок)
            for (let act of actions) {
                const p = act.p;
                
                // Визуальный фокус на локации
                const distEl = document.getElementById(`dist-${p.loc}`);
                distEl.style.boxShadow = `0 0 50px ${DISTRICTS[p.loc].color}`;
                
                if (act.card.id === 'move') {
                    p.loc = act.targetLoc;
                    await logCine(`🏃 ${p.name} перемещается в ${DISTRICTS[p.loc].name}`, '#fff');
                    updateHostMap();
                } 
                else if (act.card.id === 'gather') {
                    let bonus = p.inv.am ? 1 : 0; // Амулет дает +1 Эфир
                    p.eth += (2 + bonus);
                    await logCine(`💎 ${p.name} добывает Эфир (+${2+bonus})`, '#00E5FF');
                }
                else if (act.card.id === 'attack') {
                    // Ищем цель в этой же локации
                    const targets = Object.values(players).filter(t => t !== p && t.loc === p.loc);
                    if (targets.length > 0) {
                        let target = targets[0];
                        if (target.inv.ar) {
                            await logCine(`🛡️ ${target.name} отражает атаку Броней!`, '#FF5722');
                            target.inv.ar = false; // Броня ломается
                        } else {
                            if (target.vp > 0) {
                                target.vp -= 1; p.vp += 1;
                                let bonus = p.inv.wp ? " (и +1 Эфир за Кинжал)" : "";
                                if (p.inv.wp) p.eth += 1;
                                await logCine(`🗡️ ${p.name} крадет ПО у ${target.name}!${bonus}`, '#FF003C');
                            } else {
                                await logCine(`🗡️ У ${target.name} нет ПО для кражи.`, '#888');
                            }
                        }
                    } else {
                        await logCine(`🗡️ ${p.name} атакует пустоту...`, '#888');
                    }
                }
                else if (act.card.id === 'evolve') {
                    if (p.eth >= 3) {
                        p.eth -= 3; p.vp += 1;
                        await logCine(`⚙️ ${p.name} строит двигатель! (+1 ПО)`, 'var(--gold)');
                    } else {
                        await logCine(`❌ ${p.name}: Недостаточно Эфира.`, '#888');
                    }
                }
                
                distEl.style.boxShadow = `0 15px 35px rgba(0,0,0,0.9)`;
                await sleep(500);
            }

            // Конец раунда
            Object.values(players).forEach(p => p.action = null);
            currentRound++;
            phase = 'DRAFT';
            
            if (currentRound > 10) {
                let winner = Object.values(players).sort((a,b)=>b.vp - a.vp)[0];
                await logCine(`ГОРОД ПАЛ. ПРАВИТЕЛЬ: ${winner.name} (${winner.vp} ПО)`, 'var(--gold)');
            } else {
                document.getElementById('round-counter').innerText = `${currentRound} / 10`;
                broadcastState();
            }
        }

        function broadcastState() {
            for (let id in players) {
                const p = players[id];
                p.conn.send({ type: 'STATE', vp: p.vp, eth: p.eth, loc: p.loc, inv: p.inv, phase });
            }
        }

        /* ================= ИГРОК (ТЕЛЕФОН) ================= */
        function joinGame() {
            const code = document.getElementById('room-code').value;
            const name = document.getElementById('player-name').value;
            if(!code || !name || !selectedFaction) return alert("Заполните все данные!");
            
            event.target.innerText = "ПОДКЛЮЧЕНИЕ..."; event.target.disabled = true;

            peer = new Peer();
            peer.on('open', (id) => {
                hostConn = peer.connect(code);
                hostConn.on('open', () => {
                    hostConn.send({ type: 'JOIN', name, faction: selectedFaction });
                    document.getElementById('my-name-display').innerText = `Лидер: ${name}`;
                    renderCards();
                    show('player-screen');
                });
                
                hostConn.on('data', (data) => {
                    if (data.type === 'STATE') {
                        document.getElementById('vp-display').innerText = data.vp;
                        document.getElementById('eth-display').innerText = data.eth;
                        document.getElementById('my-location').innerText = DISTRICTS[data.loc].name;
                        
                        document.getElementById('inv-amulet').classList.toggle('filled', data.inv.am);
                        document.getElementById('inv-weapon').classList.toggle('filled', data.inv.wp);
                        document.getElementById('inv-armor').classList.toggle('filled', data.inv.ar);

                        if(data.phase === 'DRAFT') {
                            document.getElementById('action-header').innerText = "Фаза Интриг: Выберите действие";
                            document.querySelectorAll('.action-card').forEach(c => c.classList.remove('disabled'));
                        }
                    }
                });
            });
            peer.on('error', () => { alert("Ошибка подключения!"); show('lobby-screen'); });
        }

        function renderCards() {
            const cont = document.getElementById('cards-container');
            cont.innerHTML = '';
            CARDS.forEach(c => {
                const el = document.createElement('div');
                el.className = 'action-card glass';
                el.innerHTML = `
                    <div class="card-init" title="Инициатива (чем меньше, тем быстрее)">${c.init}</div>
                    <div class="card-info">
                        <h4>${c.icon} ${c.title}</h4>
                        <p>${c.desc}</p>
                    </div>
                `;
                el.onclick = () => playCard(c.id, el);
                cont.appendChild(el);
            });
        }

        function playCard(cardId, el) {
            // Защита от повторного клика
            if(el.classList.contains('disabled')) return;
            
            let targetLoc = null;
            if (cardId === 'move') {
                // Упрощенный выбор: в прототипе просто прыгаем в случайный соседний район (или промптом)
                let dest = prompt("Куда переместиться? (0: Кузня, 1: Каналы, 2: Сады, 3: Шпиль)", "0");
                targetLoc = parseInt(dest);
                if(isNaN(targetLoc) || targetLoc < 0 || targetLoc > 3) return alert("Отмена перемещения");
            }

            document.querySelectorAll('.action-card').forEach(c => c.classList.add('disabled'));
            document.getElementById('action-header').innerText = "Ожидайте развязки на Главном Экране...";
            
            hostConn.send({ type: 'ACTION', action: { cardId, targetLoc } });
        }
    </script>
</body>
</html>
