<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Полуночный Особняк: Тайна Трёх Кошек</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --theme-hue: 350;
      --theme-sat: 82%;
      --bg-dark: hsl(350, 75%, 5%);
      --glass-bg: hsla(350, 65%, 9%, 0.82);
      --glass-border: hsla(350, 90%, 65%, 0.35);
      --accent: hsl(350, 95%, 60%);
      --accent-soft: hsla(350, 95%, 60%, 0.25);
      --gold: #ffd15c;
      --text-main: #fff8f9;
      --text-muted: hsl(350, 80%, 84%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    #mansion-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), inset 0 0 24px var(--accent-soft);
      color: var(--text-main);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    #app {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Верхняя полоса быстрого выбора цвета */
    .top-color-bar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(8, 4, 10, 0.85);
      border: 1px solid var(--glass-border);
      pointer-events: auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .c-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.45);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .c-dot:hover {
      transform: scale(1.18);
      border-color: var(--gold);
    }

    .c-random-btn {
      background: linear-gradient(90deg, #f43f5e, #8b5cf6, #06b6d4, #eab308);
      border: 1px solid #fff;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .btn {
      background: linear-gradient(135deg, hsla(var(--theme-hue), 85%, 44%, 0.72), hsla(var(--theme-hue), 85%, 20%, 0.94));
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--gold);
      box-shadow: 0 0 18px var(--accent-soft);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-gold {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.8), hsla(var(--theme-hue), 85%, 30%, 0.95));
      border: 2px solid var(--gold);
      color: #fffbeb;
      box-shadow: 0 0 24px rgba(255, 209, 92, 0.3);
    }

    input[type="text"] {
      background: rgba(8, 4, 10, 0.88);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 1.05rem;
      outline: none;
      width: 100%;
      text-align: center;
      pointer-events: auto;
    }

    input[type="text"]:focus {
      border-color: var(--gold);
    }

    .center-modal {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 28px 32px;
      max-width: 580px;
      width: 94%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      pointer-events: auto;
    }

    .title-grand {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff, var(--gold), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* Сетка экрана ТВ */
    .tv-layout {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 300px 1fr 310px;
      grid-template-rows: 66px 1fr 126px;
      gap: 12px;
      padding: 12px;
    }

    .tv-header {
      grid-column: 1 / 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .pin-display {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid var(--gold);
      padding: 4px 14px;
      border-radius: 10px;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold);
    }

    .tv-left {
      grid-column: 1 / 2;
      grid-row: 2 / 4;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .tv-stage {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      pointer-events: none;
    }

    .tv-right {
      grid-column: 3 / 4;
      grid-row: 2 / 4;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .tv-bottom {
      grid-column: 2 / 3;
      grid-row: 3 / 4;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .p-row {
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.25s ease;
    }

    .p-row.active-turn {
      border: 2px solid var(--gold);
      background: linear-gradient(135deg, hsla(var(--theme-hue), 80%, 26%, 0.88), rgba(12, 8, 14, 0.92));
      box-shadow: 0 0 18px rgba(255, 209, 92, 0.35);
      transform: translateX(4px);
    }

    .cinematic-banner {
      background: rgba(8, 4, 10, 0.9);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 8px 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 95%;
    }

    .cats-status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      height: 100%;
    }

    .cat-status-card {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.74rem;
    }

    .log-feed {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.79rem;
      padding-right: 4px;
    }

    .log-item {
      background: rgba(0, 0, 0, 0.38);
      border-left: 3px solid var(--accent);
      padding: 6px 9px;
      border-radius: 0 8px 8px 0;
      line-height: 1.32;
    }

    /* Мобильный контроллер */
    .phone-wrap {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      margin: 0 auto;
      padding: 46px 12px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      pointer-events: auto;
    }

    .action-btn-phone {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(14, 7, 15, 0.92);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .action-btn-phone:active:not(:disabled) {
      transform: scale(0.98);
    }

    .action-btn-phone:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Верхняя панель смены цвета (доступна на главном экране в любой момент) -->
  <div class="top-color-bar" id="color-bar">
    <span style="font-size:0.74rem; font-weight:800; color:var(--gold); margin-right:4px;">ЦВЕТ:</span>
    <div class="c-dot" style="background:hsl(350, 82%, 45%);" data-hue="350" data-sat="82" title="Багровый"></div>
    <div class="c-dot" style="background:hsl(160, 78%, 40%);" data-hue="160" data-sat="78" title="Изумрудный"></div>
    <div class="c-dot" style="background:hsl(215, 84%, 48%);" data-hue="215" data-sat="84" title="Сапфировый"></div>
    <div class="c-dot" style="background:hsl(275, 78%, 48%);" data-hue="275" data-sat="78" title="Аметистовый"></div>
    <div class="c-dot" style="background:hsl(24, 88%, 46%);" data-hue="24" data-sat="88" title="Янтарный"></div>
    <button class="c-random-btn" id="btn-top-random">🎲 Рандом</button>
  </div>

  <!-- Анимированная сцена Особняка, Персонажей и Трёх Кошек -->
  <canvas id="mansion-canvas"></canvas>

  <!-- Слой интерфейса -->
  <div id="app"></div>

  <script>
    /***************************************************************************
     * 1. УПРАВЛЕНИЕ ЦВЕТОМ И СИНХРОНИЗАЦИЯ СО ВСЕМИ ИГРОКАМИ
     ***************************************************************************/
    const themeState = {
      hue: 350,
      sat: 82
    };

    function setGlobalTheme(hue, sat = 82) {
      themeState.hue = ((hue % 360) + 360) % 360;
      themeState.sat = sat;
      const h = themeState.hue;
      const s = themeState.sat;
      const r = document.documentElement;

      r.style.setProperty('--theme-hue', h);
      r.style.setProperty('--theme-sat', `${s}%`);
      r.style.setProperty('--bg-dark', `hsl(${h}, 75%, 5%)`);
      r.style.setProperty('--glass-bg', `hsla(${h}, 65%, 9%, 0.82)`);
      r.style.setProperty('--glass-border', `hsla(${h}, 90%, 65%, 0.35)`);
      r.style.setProperty('--accent', `hsl(${h}, 95%, 60%)`);
      r.style.setProperty('--accent-soft', `hsla(${h}, 95%, 60%, 0.25)`);
      r.style.setProperty('--text-muted', `hsl(${h}, 80%, 84%)`);

      if (mode === 'HOST') {
        broadcastStateToPhones();
      }
    }

    document.querySelectorAll('.c-dot').forEach(dot => {
      dot.onclick = () => {
        setGlobalTheme(Number(dot.getAttribute('data-hue')), Number(dot.getAttribute('data-sat')));
        SFX.coin();
      };
    });

    document.getElementById('btn-top-random').onclick = () => {
      const rh = Math.floor(Math.random() * 360);
      const rs = 70 + Math.floor(Math.random() * 25);
      setGlobalTheme(rh, rs);
      SFX.coin();
    };

    /***************************************************************************
     * 2. ЗВУКОВОЙ ДВИЖОК (ШАГИ, УДАР НОЖОМ, МЯУКАНЬЕ, ВОДА, ЗВОН МОНЕТ)
     ***************************************************************************/
    const SFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      play(freq, type = 'sine', dur = 0.15, vol = 0.12, slide = null) {
        if (!this.ctx) return;
        try {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = type;
          o.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (slide) o.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
          g.gain.setValueAtTime(vol, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start();
          o.stop(this.ctx.currentTime + dur);
        } catch (e) {}
      },
      coin() {
        this.play(1046, 'sine', 0.1, 0.1);
        setTimeout(() => this.play(1318, 'triangle', 0.18, 0.12), 65);
      },
      knifeSlash() {
        this.play(680, 'sawtooth', 0.16, 0.16, 120);
        setTimeout(() => this.play(160, 'square', 0.22, 0.15, 65), 90);
      },
      shieldClang() {
        this.play(520, 'square', 0.12, 0.14);
        setTimeout(() => this.play(880, 'triangle', 0.25, 0.14), 60);
      },
      sneakStep() {
        for (let i = 0; i < 4; i++) {
          setTimeout(() => this.play(180 + (i % 2) * 40, 'sine', 0.06, 0.07), i * 130);
        }
      },
      sonyaMeow() {
        this.play(540, 'sine', 0.35, 0.14, 720);
        setTimeout(() => this.play(720, 'sine', 0.4, 0.12, 480), 220);
      },
      waterSplash() {
        for (let i = 0; i < 5; i++) {
          setTimeout(() => this.play(400 + Math.random() * 500, 'sine', 0.09, 0.08), i * 65);
        }
      },
      fanfare() {
        [261, 329, 392, 523].forEach((f, i) => {
          setTimeout(() => this.play(f, 'triangle', 0.24, 0.15), i * 95);
        });
      }
    };

    /***************************************************************************
     * 3. СОСТОЯНИЕ ОСОБНЯКА, ИГРОКОВ, ТРЁХ КОШЕК И АНИМАЦИОННОЙ СЦЕНЫ
     ***************************************************************************/
    const AVATAR_COLORS = [
      '#ff3b5c', '#38bdf8', '#a3e635', '#fb923c',
      '#c084fc', '#2dd4bf', '#facc15', '#f472b6'
    ];

    const ROOM_PREFIX = 'midnight-mansion-';
    const appEl = document.getElementById('app');
    let mode = 'MENU'; // MENU | HOST | CLIENT
    let peer = null;

    const hostState = {
      pin: '',
      phase: 'LOBBY', // LOBBY | PLAYER_TURN | ANIMATING | GAME_OVER
      round: 1,
      activeIndex: 0,
      headline: 'ОЖИДАНИЕ ГОСТЕЙ В ОСОБНЯКЕ',
      subline: 'Подключитесь со смартфонов по PIN-коду или нажмите Начать Игру',
      winner: null,
      players: [], // { id, name, color, gold, rubies, hp, shield, stealth, isBot, conn }

      // Состояние Трёх Кошек Особняка
      cats: {
        // Соня: спит у любимого хозяина, боится резких движений, мяукает максимум 2 раза за всю партию
        sonyaOwnerId: null,
        sonyaMeowsLeft: 2,

        // Наташа: высунутый язычок, любит воду в ванной и каждые 2 раунда просит поесть
        natashaWaterActive: false,
        natashaTargetId: null,

        // Степан: авантюрист, лежит у двери Сейфа или прямо на вещах выбранного игрока
        stepanLocation: 'VAULT', // 'VAULT' или ID игрока, на чьих вещах он развалился
      },

      // Текущая буквальная анимация на экране
      // type: 'ATTACK' | 'STEAL' | 'VAULT' | 'RUBY' | 'SONYA' | 'NATASHA_WATER' | 'NATASHA_FEED' | 'STEPAN'
      scene: null,
      logs: []
    };

    const vfx = {
      floatingTexts: [],
      particles: [],
      bloodDrops: [],
      waterDrops: [],
      hearts: [],
      screenShake: 0
    };

    /***************************************************************************
     * 4. КАРТА ОСОБНЯКА И БУКВАЛЬНАЯ АНИМАЦИЯ ПЕРСОНАЖЕЙ И КОШЕК НА CANVAS
     ***************************************************************************/
    const canvas = document.getElementById('mansion-canvas');
    const ctx = canvas.getContext('2d');
    let cw = window.innerWidth;
    let ch = window.innerHeight;

    function resizeCanvas() {
      cw = canvas.width = window.innerWidth;
      ch = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Координаты объектов в центре Зала Особняка
    function getMansionLandmarks() {
      const cx = cw * 0.5;
      const cy = ch * 0.48;
      return {
        center: { x: cx, y: cy },
        vault: { x: cx, y: cy - 88 },          // Золотой Сейф и Рубиновый Пьедестал
        bath: { x: cx - 125, y: cy + 18 },     // Мраморная Ванная и Поилка Наташи
        cushion: { x: cx + 125, y: cy + 18 }   // Тихая Подушка Сони
      };
    }

    // Координаты каждого персонажа игрока вокруг центрального ковра
    function getPlayerHomePos(index, total) {
      const count = Math.max(2, total);
      const angle = (index / count) * Math.PI * 2 - Math.PI / 2;
      const rx = Math.min(cw * 0.25, 315);
      const ry = Math.min(ch * 0.25, 195);
      const cx = cw * 0.5;
      const cy = ch * 0.48;
      return {
        x: cx + Math.cos(angle) * rx,
        y: cy + Math.sin(angle) * ry
      };
    }

    // Отрисовка живой кошки с узнаваемыми деталями!
    function drawCatSprite(x, y, type, time, labelText) {
      ctx.save();
      ctx.translate(x, y);
      const bob = Math.sin(time * 3.5) * 2;

      if (type === 'sonya') {
        // Соня: пушистая, тихая, свернулась калачиком и мирно спит
        ctx.fillStyle = '#e2e8f0';
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 4, 16, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Голова с закрытыми сонными глазками
        ctx.beginPath();
        ctx.arc(-9, 1, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Ушки
        ctx.fillStyle = '#f472b6';
        ctx.beginPath();
        ctx.moveTo(-15, -5); ctx.lineTo(-12, -13); ctx.lineTo(-7, -7);
        ctx.moveTo(-6, -6); ctx.lineTo(-2, -13); ctx.lineTo(-1, -5);
        ctx.fill();

        // Сонные реснички
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(-12, 1, 2.5, 0, Math.PI);
        ctx.moveTo(-6, 1);
        ctx.arc(-6, 1, 2.5, 0, Math.PI);
        ctx.stroke();
      } else if (type === 'natasha') {
        // Наташа: любопытная, сидит у воды, и ВСЕГДА торчит розовый кончик языка!
        ctx.fillStyle = '#334155';
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 5 + bob * 0.4, 14, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Голова
        ctx.beginPath();
        ctx.arc(0, -8 + bob, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Ушки
        ctx.beginPath();
        ctx.moveTo(-8, -14 + bob); ctx.lineTo(-10, -23 + bob); ctx.lineTo(-2, -17 + bob);
        ctx.moveTo(8, -14 + bob); ctx.lineTo(10, -23 + bob); ctx.lineTo(2, -17 + bob);
        ctx.fill();
        ctx.stroke();

        // Любопытные большие глаза
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(-4, -9 + bob, 2.8, 0, Math.PI * 2);
        ctx.arc(4, -9 + bob, 2.8, 0, Math.PI * 2);
        ctx.fill();

        // ТОТ САМЫЙ РОЗОВЫЙ ЯЗЫЧОК НАТАШИ, КОТОРЫЙ ВСЕГДА ТОРЧИТ!
        ctx.fillStyle = '#ff4d79';
        ctx.strokeStyle = '#9f1239';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(-2.8, -3 + bob, 5.6, 6.5, 3);
        ctx.fill();
        ctx.stroke();
      } else if (type === 'stepan') {
        // Степан: рыжий/золотистый авантюрист, развалился в кайф прямо посреди событий!
        ctx.fillStyle = '#fb923c';
        ctx.strokeStyle = '#7c2d12';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 5, 19, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Довольная морда авантюриста
        ctx.beginPath();
        ctx.arc(11, -3 + bob, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Ушки
        ctx.beginPath();
        ctx.moveTo(5, -10 + bob); ctx.lineTo(4, -19 + bob); ctx.lineTo(10, -12 + bob);
        ctx.moveTo(14, -11 + bob); ctx.lineTo(18, -19 + bob); ctx.lineTo(19, -9 + bob);
        ctx.fill();
        ctx.stroke();

        // Яркие глаза
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(8, -4 + bob, 2.4, 0, Math.PI * 2);
        ctx.arc(14, -4 + bob, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Подпись имени кошки
      if (labelText) {
        ctx.font = '800 11px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        const w = ctx.measureText(labelText).width + 10;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
        ctx.beginPath();
        ctx.roundRect(-w / 2, 19, w, 16, 6);
        ctx.fill();
        ctx.fillStyle = '#ffd15c';
        ctx.fillText(labelText, 0, 30);
      }

      ctx.restore();
    }

    // Отрисовка живого персонажа игрока (с оружием, маской вора, щитом и эмоциями!)
    function drawHumanCharacter(x, y, player, isTurn, pose, time) {
      // pose: 'IDLE' | 'WALK' | 'STAB' | 'HURT' | 'SNEAK' | 'CELEBRATE'
      ctx.save();
      ctx.translate(x, y);

      const walkCycle = pose === 'WALK' || pose === 'SNEAK' ? Math.sin(time * 18) * 6 : 0;
      const bodyTilt = pose === 'HURT' ? 0.35 : (pose === 'SNEAK' ? -0.18 : 0);
      ctx.rotate(bodyTilt);

      // Тень под ногами
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.ellipse(0, 24, 20, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Золотой ореол под активным игроком
      if (isTurn) {
        ctx.strokeStyle = '#ffd15c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 24, 26 + Math.sin(time * 5) * 3, 11, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Ноги в движении
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-6, 10);
      ctx.lineTo(-6 - walkCycle, 22);
      ctx.moveTo(6, 10);
      ctx.lineTo(6 + walkCycle, 22);
      ctx.stroke();

      // Плащ и торс персонажа в его цвете
      ctx.fillStyle = player.color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14, 14);
      ctx.lineTo(-10, -10);
      ctx.lineTo(10, -10);
      ctx.lineTo(14, 14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Голова персонажа
      ctx.fillStyle = '#fde68a';
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -19, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Если персонаж крадётся как вор — рисуем чёрную маску грабителя на глазах!
      if (pose === 'SNEAK' || player.stealth) {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-10, -23, 20, 6);
      }

      // Глаза
      ctx.fillStyle = pose === 'HURT' ? '#ef4444' : '#0f172a';
      ctx.beginPath();
      ctx.arc(-4, -20, 1.8, 0, Math.PI * 2);
      ctx.arc(4, -20, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Щит, если игрок защищён
      if (player.shield) {
        ctx.fillStyle = '#38bdf8';
        ctx.strokeStyle = '#ffd15c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-18, -8);
        ctx.lineTo(-10, -8);
        ctx.lineTo(-10, 4);
        ctx.lineTo(-14, 10);
        ctx.lineTo(-18, 4);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Если поза STAB — рисуем в руке большой сверкающий КИНЖАЛ и кровавый росчерк!
      if (pose === 'STAB') {
        ctx.save();
        ctx.translate(16, -4);
        ctx.rotate(Math.sin(time * 25) * 0.5);
        // Рукоять
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-4, -2, 8, 4);
        // Лезвие ножа с багровым кончиком
        ctx.fillStyle = '#e2e8f0';
        ctx.strokeStyle = '#ff2a4b';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(4, -4);
        ctx.lineTo(28, 0);
        ctx.lineTo(4, 4);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // Если поза CELEBRATE — персонаж держит над головой сияющий Рубин или мешок золота!
      if (pose === 'CELEBRATE') {
        ctx.fillStyle = '#ff2a4b';
        ctx.strokeStyle = '#ffd15c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -48);
        ctx.lineTo(10, -38);
        ctx.lineTo(0, -28);
        ctx.lineTo(-10, -38);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();

      // Информационная плашка прямо над головой каждого персонажа: Имя, Сердца, Золото, Рубины
      ctx.save();
      const heartsStr = '❤️'.repeat(Math.max(0, player.hp));
      const rubiesStr = '💎'.repeat(player.rubies);
      const topLabel = `${player.name} ${rubiesStr}`;
      const subLabel = `${heartsStr}  🪙 ${player.gold}`;

      ctx.font = '900 12px "Segoe UI", sans-serif';
      const w = Math.max(ctx.measureText(topLabel).width, ctx.measureText(subLabel).width) + 16;

      ctx.fillStyle = 'rgba(8, 4, 12, 0.86)';
      ctx.strokeStyle = isTurn ? '#ffd15c' : player.color;
      ctx.lineWidth = isTurn ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.roundRect(x - w / 2, y - 66, w, 32, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(topLabel, x, y - 53);

      ctx.font = '800 11px "Segoe UI", sans-serif';
      ctx.fillStyle = '#ffd15c';
      ctx.fillText(subLabel, x, y - 39);
      ctx.restore();
    }

    function renderMansionCanvas(timestamp) {
      const t = timestamp * 0.001;
      const h = themeState.hue;
      const s = themeState.sat;

      ctx.save();
      if (vfx.screenShake > 0) {
        const dx = (Math.random() - 0.5) * vfx.screenShake;
        const dy = (Math.random() - 0.5) * vfx.screenShake;
        ctx.translate(dx, dy);
        vfx.screenShake *= 0.88;
        if (vfx.screenShake < 0.5) vfx.screenShake = 0;
      }

      // 1. Фон Особняка
      const bgGrad = ctx.createRadialGradient(cw * 0.5, ch * 0.48, 40, cw * 0.5, ch * 0.5, Math.max(cw, ch) * 0.85);
      bgGrad.addColorStop(0, `hsl(${h}, ${s}%, 19%)`);
      bgGrad.addColorStop(0.55, `hsl(${h}, ${s}%, 9%)`);
      bgGrad.addColorStop(1, `hsl(${h}, 80%, 4%)`);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, cw, ch);

      const lm = getMansionLandmarks();

      // 2. Королевский ковёр в центре зала
      ctx.save();
      ctx.translate(lm.center.x, lm.center.y);
      ctx.scale(1, 0.62);
      ctx.beginPath();
      ctx.arc(0, 0, 265, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${h}, 75%, 15%, 0.85)`;
      ctx.fill();
      ctx.strokeStyle = '#ffd15c';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, 245, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${h}, 90%, 68%, 0.35)`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      // 3. Отрисовка 3 центральных интерактивных зон Особняка:
      // 3.1. ЗОЛОТОЙ СЕЙФ И СОКРОВИЩНИЦА РУБИНОВ
      ctx.save();
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#ffd15c';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(lm.vault.x - 46, lm.vault.y - 32, 92, 54, 10);
      ctx.fill();
      ctx.stroke();
      // Рубин на вершине сейфа
      ctx.fillStyle = '#ff2a4b';
      ctx.beginPath();
      ctx.moveTo(lm.vault.x, lm.vault.y - 46);
      ctx.lineTo(lm.vault.x + 10, lm.vault.y - 36);
      ctx.lineTo(lm.vault.x, lm.vault.y - 26);
      ctx.lineTo(lm.vault.x - 10, lm.vault.y - 36);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffd15c';
      ctx.font = '800 11px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ЗОЛОТОЙ СЕЙФ И РУБИНЫ', lm.vault.x, lm.vault.y - 52);
      ctx.restore();

      // 3.2. МРАМОРНАЯ ВАННАЯ И ПОИЛКА НАТАШИ
      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(lm.bath.x, lm.bath.y, 44, 24, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = hostState.cats.natashaWaterActive ? '#38bdf8' : '#0284c7';
      ctx.beginPath();
      ctx.ellipse(lm.bath.x, lm.bath.y + 2, 36, 17, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7dd3fc';
      ctx.font = '800 11px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ВАННАЯ НАТАШИ', lm.bath.x, lm.bath.y - 30);
      ctx.restore();

      // 3.3. БАРХАТНАЯ ПОДУШКА СОНИ
      ctx.save();
      ctx.fillStyle = '#831843';
      ctx.strokeStyle = '#f472b6';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(lm.cushion.x, lm.cushion.y, 40, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fbcfe8';
      ctx.font = '800 11px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('УГОЛОК ТИШИНЫ СОНИ', lm.cushion.x, lm.cushion.y - 28);
      ctx.restore();

      // 4. Вычисление текущих позиций всех игроков с учётом буквальной анимации (`hostState.scene`)
      const sc = hostState.scene;
      let scProgress = 0;
      if (sc) {
        scProgress = Math.min(1, (performance.now() - sc.startTime) / sc.duration);
      }

      hostState.players.forEach((p, idx) => {
        const home = getPlayerHomePos(idx, hostState.players.length);
        let drawX = home.x;
        let drawY = home.y;
        let pose = 'IDLE';

        if (sc && sc.actorIdx === idx) {
          // Сцена, где этот игрок идёт к цели, совершает действие и возвращается!
          const target = sc.targetPos;
          if (scProgress < 0.35) {
            // Идёт к цели
            const k = scProgress / 0.35;
            drawX = home.x + (target.x - home.x) * k;
            drawY = home.y + (target.y - home.y) * k;
            pose = sc.type === 'STEAL' ? 'SNEAK' : 'WALK';
          } else if (scProgress < 0.72) {
            // Совершает действие у цели (режет ножом, крадёт, открывает сейф и т.д.)
            drawX = target.x;
            drawY = target.y;
            if (sc.type === 'ATTACK') pose = 'STAB';
            else if (sc.type === 'STEAL') pose = 'SNEAK';
            else pose = 'CELEBRATE';
          } else {
            // Возвращается на своё место
            const k = (scProgress - 0.72) / 0.28;
            drawX = target.x + (home.x - target.x) * k;
            drawY = target.y + (home.y - target.y) * k;
            pose = 'WALK';
          }
        } else if (sc && sc.victimIdx === idx && scProgress >= 0.35 && scProgress <= 0.75) {
          if (sc.type === 'ATTACK') pose = 'HURT';
        }

        drawHumanCharacter(drawX, drawY, p, idx === hostState.activeIndex && hostState.phase !== 'LOBBY', pose, t);

        // Если Соня выбрала этого игрока своим хозяином — Соня спит прямо у его ног!
        if (hostState.cats.sonyaOwnerId === p.id) {
          drawCatSprite(drawX + 28, drawY + 14, 'sonya', t, 'Соня спит у хозяина');
        }

        // Если Степан развалился прямо на вещах этого игрока
        if (hostState.cats.stepanLocation === p.id) {
          drawCatSprite(drawX - 28, drawY + 14, 'stepan', t, 'Степан лежит на вещах!');
        }
      });

      // Отрисовка кошек на их центральных местах, если они не у игроков
      if (!hostState.cats.sonyaOwnerId) {
        drawCatSprite(lm.cushion.x, lm.cushion.y, 'sonya', t, 'Соня ждёт ласки');
      }

      // Наташа: либо у ванной с высунутым языком, либо бежит будить/кусать игрока в раунде кормёжки!
      let natashaPos = { x: lm.bath.x, y: lm.bath.y + 4 };
      if (sc && sc.type === 'NATASHA_FEED' && sc.targetPos) {
        const k = scProgress < 0.5 ? scProgress * 2 : (1 - scProgress) * 2;
        natashaPos = {
          x: lm.bath.x + (sc.targetPos.x - lm.bath.x) * k,
          y: lm.bath.y + (sc.targetPos.y - lm.bath.y) * k
        };
      }
      drawCatSprite(natashaPos.x, natashaPos.y, 'natasha', t, 'Наташа 👅');

      // Степан у двери Сейфа
      if (hostState.cats.stepanLocation === 'VAULT') {
        drawCatSprite(lm.vault.x, lm.vault.y + 18, 'stepan', t, 'Степан у двери Сейфа');
      }

      // 5. Спецэффекты: Брызги крови при ударе ножом, брызги воды в ванной Наташи, сердечки
      for (let i = vfx.bloodDrops.length - 1; i >= 0; i--) {
        const b = vfx.bloodDrops[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.25;
        b.life -= 1;
        if (b.life <= 0) {
          vfx.bloodDrops.splice(i, 1);
          continue;
        }
        ctx.fillStyle = '#ff1e42';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = vfx.waterDrops.length - 1; i >= 0; i--) {
        const w = vfx.waterDrops[i];
        w.x += w.vx;
        w.y += w.vy;
        w.vy += 0.18;
        w.life -= 1;
        if (w.life <= 0) {
          vfx.waterDrops.splice(i, 1);
          continue;
        }
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(w.x, w.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // 6. Крупные всплывающие тексты над персонажами
      for (let i = vfx.floatingTexts.length - 1; i >= 0; i--) {
        const ft = vfx.floatingTexts[i];
        ft.y -= 0.9;
        ft.life -= 1;
        if (ft.life <= 0) {
          vfx.floatingTexts.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.font = '900 18px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.globalAlpha = Math.min(1, ft.life / 25);
        ctx.fillStyle = ft.color;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 8;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(renderMansionCanvas);
    }
    requestAnimationFrame(renderMansionCanvas);

    function spawnBloodSplash(x, y) {
      vfx.screenShake = 14;
      for (let i = 0; i < 24; i++) {
        vfx.bloodDrops.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 9,
          vy: -Math.random() * 7 - 2,
          r: 2.5 + Math.random() * 3.5,
          life: 40 + Math.random() * 20
        });
      }
    }

    function spawnWaterSplash(x, y) {
      for (let i = 0; i < 22; i++) {
        vfx.waterDrops.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 7,
          vy: -Math.random() * 6 - 2,
          life: 45 + Math.random() * 15
        });
      }
    }

    function spawnBannerPopup(x, y, text, color = '#ffd15c') {
      vfx.floatingTexts.push({ x, y, text, color, life: 95 });
    }

    /***************************************************************************
     * 5. СТАРТОВОЕ МЕНЮ
     ***************************************************************************/

    /***************************************************************************
     * 6. ИГРОВОЙ СЕРВЕР НА ЭКРАНЕ ТВ И БУКВАЛЬНЫЕ СЦЕНЫ ДЕЙСТВИЙ
     ***************************************************************************/
    function addLog(text) {
      hostState.logs.unshift(text);
      if (hostState.logs.length > 30) hostState.logs.pop();
    }

    function createPlayer(id, name, isBot = false, conn = null) {
      const idx = hostState.players.length;
      return {
        id,
        name: name.slice(0, 12),
        color: AVATAR_COLORS[idx % AVATAR_COLORS.length],
        gold: 4,
        rubies: 0,
        hp: 3,
        shield: false,
        stealth: false,
        isBot,
        conn
      };
    }

    function initHostMode() {
      mode = 'HOST';
      hostState.pin = String(Math.floor(1000 + Math.random() * 9000));
      const peerId = ROOM_PREFIX + hostState.pin;

      addLog(`Особняк открыт! PIN-код для телефонов: ${hostState.pin}`);
      renderHostHUD();

      peer = new Peer(peerId);
      peer.on('open', () => renderHostHUD());
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') initHostMode();
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => handleHostPacket(conn, data));
      });
    }

    function handleHostPacket(conn, data) {
      if (data.type === 'JOIN') {
        let p = hostState.players.find(x => x.id === conn.peer);
        if (!p && hostState.players.length < 8) {
          p = createPlayer(conn.peer, data.name, false, conn);
          hostState.players.push(p);
          SFX.coin();
          addLog(`✨ В Особняк вошёл игрок «${p.name}»!`);
        }
        broadcastStateToPhones();
        renderHostHUD();
      }

      const active = hostState.players[hostState.activeIndex];
      if (!active || active.id !== conn.peer) return;

      if (data.type === 'PERFORM_ACTION' && hostState.phase === 'PLAYER_TURN') {
        executeLiteralActionScene(data.actionType, data.targetId);
      }
    }

    function addBotOnHost() {
      if (hostState.players.length >= 8) return;
      const botNames = ['Граф Ворон', 'Леди Тень', 'Барон Клинок', 'Маркиз Нуар', 'Доктор Вальс'];
      const used = hostState.players.map(p => p.name);
      const name = botNames.find(n => !used.includes(n)) || `Гость-${hostState.players.length + 1}`;
      hostState.players.push(createPlayer('bot-' + Math.random().toString(36).slice(2, 7), name, true, null));
      addLog(`🤖 В зал вошёл ИИ-соперник «${name}».`);
      renderHostHUD();
    }

    // ВТОРОЙ КЛИК НА ТВ — ЗАПУСК ПАРТИИ
    function startMansionGame() {
      SFX.init();
      while (hostState.players.length < 2) {
        addBotOnHost();
      }
      hostState.round = 1;
      hostState.activeIndex = 0;
      startNextPlayerTurn();
    }

    function startNextPlayerTurn() {
      const active = hostState.players[hostState.activeIndex];
      hostState.phase = 'PLAYER_TURN';
      hostState.scene = null;

      // Пассивный бонус, если Соня спит рядом со своим избранным хозяином
      if (hostState.cats.sonyaOwnerId === active.id) {
        active.gold += 1;
        active.shield = true;
        const pos = getPlayerHomePos(hostState.activeIndex, hostState.players.length);
        spawnBannerPopup(pos.x, pos.y - 75, '+1 🪙 и Щит от спящей Сони', '#f472b6');
      }

      hostState.headline = `ХОД ИГРОКА: ${active.name.toUpperCase()} — ВЫБЕРИТЕ ДЕЙСТВИЕ НА СМАРТФОНЕ`;
      hostState.subline = `Золото: ${active.gold} 🪙 | Рубины: ${active.rubies} из 3 💎 | Жизни: ${active.hp} ❤️`;

      broadcastStateToPhones();
      renderHostHUD();

      if (active.isBot) {
        setTimeout(() => runBotTurnDecision(active), 1500);
      }
    }

    function runBotTurnDecision(bot) {
      if (bot.gold >= 6) {
        executeLiteralActionScene('BUY_RUBY', null);
        return;
      }
      const others = hostState.players.filter(p => p.id !== bot.id);
      const richTarget = others.find(p => p.gold >= 4 && !p.stealth);
      if (richTarget && Math.random() > 0.4) {
        const act = Math.random() > 0.5 ? 'ATTACK' : 'STEAL';
        executeLiteralActionScene(act, richTarget.id);
        return;
      }
      const choices = ['VAULT', 'SONYA', 'NATASHA_WATER', 'STEPAN'];
      const pick = choices[Math.floor(Math.random() * choices.length)];
      const randVictim = others[Math.floor(Math.random() * others.length)];
      executeLiteralActionScene(pick, randVictim ? randVictim.id : null);
    }

    // БУКВАЛЬНАЯ АНИМАЦИЯ ДЕЙСТВИЯ ПЕРСОНАЖА НА ГЛАВНОМ ЭКРАНЕ
    function executeLiteralActionScene(actionType, targetId) {
      const actorIdx = hostState.activeIndex;
      const actor = hostState.players[actorIdx];
      const lm = getMansionLandmarks();

      hostState.phase = 'ANIMATING';
      const duration = 3100;

      // 1. НАПАДЕНИЕ С КИНЖАЛОМ НА СОПЕРНИКА
      if (actionType === 'ATTACK') {
        const victimIdx = hostState.players.findIndex(p => p.id === targetId);
        const victim = hostState.players[victimIdx];
        if (!victim) {
          startNextPlayerTurn();
          return;
        }
        const victimPos = getPlayerHomePos(victimIdx, hostState.players.length);

        // Если нападающий был хозяином Сони — Соня пугается резкого движения и убегает на подушку!
        if (hostState.cats.sonyaOwnerId === actor.id) {
          hostState.cats.sonyaOwnerId = null;
          addLog(`🐾 Соня испугалась резкого взмаха ножа ${actor.name} и убежала на подушку!`);
        }

        hostState.scene = {
          type: 'ATTACK',
          actorIdx,
          victimIdx,
          targetPos: { x: victimPos.x - 26, y: victimPos.y },
          startTime: performance.now(),
          duration
        };

        hostState.headline = `🗡️ ${actor.name.toUpperCase()} ИДЁТ С НОЖОМ К ИГРОКУ ${victim.name.toUpperCase()}!`;
        hostState.subline = `Все смотрят на центр зала...`;
        SFX.sneakStep();
        broadcastStateToPhones();
        renderHostHUD();

        // Момент удара ножом в середине анимации!
        setTimeout(() => {
          // Проверяем, спасёт ли Соня своего любимого хозяина редким «Мяу»!
          if (hostState.cats.sonyaOwnerId === victim.id && hostState.cats.sonyaMeowsLeft > 0) {
            hostState.cats.sonyaMeowsLeft -= 1;
            SFX.sonyaMeow();
            spawnBannerPopup(victimPos.x, victimPos.y - 75, `🐱 МЯУ! СОНЯ СПАСАЕТ ХОЗЯИНА!`, '#f472b6');
            hostState.headline = `🐱 СОНЯ ИЗДАЛА СВОЁ РЕДКОЕ «МЯУ» И ЗАЩИТИЛА ${victim.name.toUpperCase()}!`;
            hostState.subline = `Осталось легендарных мяуканий Сони за партию: ${hostState.cats.sonyaMeowsLeft}`;
            addLog(`🐱 Невероятно! Тихая Соня мяукнула и спасла своего хозяина ${victim.name} от ножа!`);
            renderHostHUD();
            return;
          }

          if (victim.shield) {
            victim.shield = false;
            SFX.shieldClang();
            spawnBannerPopup(victimPos.x, victimPos.y - 75, `🛡️ ЩИТ ОТРАЗИЛ УДАР НОЖОМ!`, '#38bdf8');
            hostState.headline = `🛡️ ${victim.name.toUpperCase()} ОТРАЖАЕТ УДАР НОЖОМ!`;
            addLog(`🛡️ Щит спас ${victim.name} от кинжала ${actor.name}!`);
            renderHostHUD();
            return;
          }

          // Настоящий удар ножом!
          SFX.knifeSlash();
          spawnBloodSplash(victimPos.x, victimPos.y - 10);
          victim.hp -= 1;
          const loot = Math.max(1, Math.floor(victim.gold / 2));
          const actualLoot = Math.min(victim.gold, loot);
          victim.gold -= actualLoot;
          actor.gold += actualLoot;

          if (victim.hp <= 0) {
            victim.hp = 3; // Доктор особняка приводит в чувство, но атакующий забирает ещё бонус
            actor.gold += 2;
            spawnBannerPopup(victimPos.x, victimPos.y - 80, `💀 НОКАУТ! -${actualLoot} 🪙`, '#ff2a4b');
            addLog(`🗡️ ${actor.name} поверг ${victim.name} ударом кинжала и забрал ${actualLoot} 🪙 + 2 🪙 трофея!`);
          } else {
            spawnBannerPopup(victimPos.x, victimPos.y - 80, `🩸 УДАР НОЖОМ! -1 ❤️ и -${actualLoot} 🪙`, '#ff2a4b');
            addLog(`🗡️ ${actor.name} ранил ножом ${victim.name} и забрал ${actualLoot} 🪙!`);
          }
          renderHostHUD();
        }, 1150);

        setTimeout(() => finishTurnAndAdvance(), duration);
        return;
      }

      // 2. ТИХАЯ КРАЖА ЗОЛОТА ИЗ КАРМАНА
      if (actionType === 'STEAL') {
        const victimIdx = hostState.players.findIndex(p => p.id === targetId);
        const victim = hostState.players[victimIdx];
        if (!victim) {
          startNextPlayerTurn();
          return;
        }
        const victimPos = getPlayerHomePos(victimIdx, hostState.players.length);

        hostState.scene = {
          type: 'STEAL',
          actorIdx,
          victimIdx,
          targetPos: { x: victimPos.x + 24, y: victimPos.y },
          startTime: performance.now(),
          duration
        };

        hostState.headline = `🕵️ ${actor.name.toUpperCase()} КРАДЁТСЯ К КАРМАНАМ ${victim.name.toUpperCase()}...`;
        hostState.subline = `Персонаж в маске подбирается со спины`;
        SFX.sneakStep();
        broadcastStateToPhones();
        renderHostHUD();

        setTimeout(() => {
          const stolen = Math.min(victim.gold, 3);
          victim.gold -= stolen;
          actor.gold += stolen;
          SFX.coin();
          spawnBannerPopup(victimPos.x, victimPos.y - 75, `💰 УКРАДЕНО ${stolen} 🪙!`, '#ffd15c');
          hostState.headline = `💰 ${actor.name.toUpperCase()} ВЫТАЩИЛ ${stolen} 🪙 У ${victim.name.toUpperCase()}!`;
          addLog(`🕵️ ${actor.name} незаметно вытащил ${stolen} 🪙 из кармана ${victim.name}!`);
          renderHostHUD();
        }, 1150);

        setTimeout(() => finishTurnAndAdvance(), duration);
        return;
      }

      // 3. ПОХОД К ЗОЛОТОМУ СЕЙФУ В ЦЕНТРЕ
      if (actionType === 'VAULT') {
        hostState.scene = {
          type: 'VAULT',
          actorIdx,
          victimIdx: -1,
          targetPos: { x: lm.vault.x, y: lm.vault.y + 22 },
          startTime: performance.now(),
          duration
        };

        const stepanAtDoor = hostState.cats.stepanLocation === 'VAULT';
        hostState.headline = `🏦 ${actor.name.toUpperCase()} ИДЁТ К ЗОЛОТОМУ СЕЙФУ`;
        hostState.subline = stepanAtDoor
          ? `У двери сейфа развалился Степан — придётся погладить его и взять на руки!`
          : `Персонаж подбирает шифр к замку...`;
        SFX.sneakStep();
        broadcastStateToPhones();
        renderHostHUD();

        setTimeout(() => {
          const gain = stepanAtDoor ? 5 : 4;
          actor.gold += gain;
          SFX.coin();
          spawnBannerPopup(lm.vault.x, lm.vault.y - 60, `+${gain} 🪙 ИЗ СЕЙФА!`, '#ffd15c');
          if (stepanAtDoor) {
            addLog(`🐱 ${actor.name} погладил Степана у двери сейфа и вынес целых +${gain} 🪙!`);
          } else {
            addLog(`🏦 ${actor.name} открыл Золотой Сейф и забрал +${gain} 🪙.`);
          }
          renderHostHUD();
        }, 1150);

        setTimeout(() => finishTurnAndAdvance(), duration);
        return;
      }

      // 4. ПОКУПКА КОРОЛЕВСКОГО РУБИНА ДЛЯ ПОБЕДЫ
      if (actionType === 'BUY_RUBY') {
        hostState.scene = {
          type: 'RUBY',
          actorIdx,
          victimIdx: -1,
          targetPos: { x: lm.vault.x, y: lm.vault.y + 18 },
          startTime: performance.now(),
          duration
        };

        hostState.headline = `💎 ${actor.name.toUpperCase()} НАПРАВЛЯЕТСЯ ЗА КОРОЛЕВСКИМ РУБИНОМ!`;
        SFX.sneakStep();
        broadcastStateToPhones();
        renderHostHUD();

        setTimeout(() => {
          if (actor.gold >= 6) {
            actor.gold -= 6;
            actor.rubies += 1;
            SFX.fanfare();
            spawnBannerPopup(lm.vault.x, lm.vault.y - 65, `💎 РУБИН ${actor.rubies} ИЗ 3!`, '#ff2a4b');
            hostState.headline = `👑 ${actor.name.toUpperCase()} ПОЛУЧАЕТ РУБИН ${actor.rubies} ИЗ 3!`;
            addLog(`💎 ${actor.name} покупает Королевский Рубин! Теперь у него ${actor.rubies} из 3!`);
            renderHostHUD();
          }
        }, 1150);

        setTimeout(() => finishTurnAndAdvance(), duration);
        return;
      }

      // 5. ПОГЛАДИТЬ ТИХУЮ СОНЮ — ОНА ВЫБИРАЕТ ВАС СВОИМ ХОЗЯИНОМ
      if (actionType === 'SONYA') {
        const targetPos = { x: lm.cushion.x, y: lm.cushion.y };
        hostState.scene = {
          type: 'SONYA',
          actorIdx,
          victimIdx: -1,
          targetPos,
          startTime: performance.now(),
          duration
        };

        hostState.headline = `🐾 ${actor.name.toUpperCase()} ТИХО ПОДХОДИТ ПОГЛАДИТЬ СОНЮ...`;
        hostState.subline = `Соня обожает спокойствие и ласку своего избранного человека`;
        broadcastStateToPhones();
        renderHostHUD();

        setTimeout(() => {
          hostState.cats.sonyaOwnerId = actor.id;
          actor.hp = Math.min(3, actor.hp + 1);
          actor.shield = true;
          actor.gold += 2;
          SFX.coin();
          spawnBannerPopup(targetPos.x, targetPos.y - 50, `💖 СОНЯ ВЫБРАЛА ${actor.name.toUpperCase()} ХОЗЯИНОМ!`, '#f472b6');
          addLog(`🐾 ${actor.name} ласково погладил Соню! Теперь Соня спит рядом с ним, даёт Щит, +2 🪙 и лечит раны.`);
          renderHostHUD();
        }, 1150);

        setTimeout(() => finishTurnAndAdvance(), duration);
        return;
      }

      // 6. ВКЛЮЧИТЬ ВОДУ В ВАННОЙ ДЛЯ НАТАШИ
      if (actionType === 'NATASHA_WATER') {
        const targetPos = { x: lm.bath.x, y: lm.bath.y };
        hostState.scene = {
          type: 'NATASHA_WATER',
          actorIdx,
          victimIdx: -1,
          targetPos,
          startTime: performance.now(),
          duration
        };

        hostState.headline = `💧 ${actor.name.toUpperCase()} ВКЛЮЧАЕТ ВОДУ В ВАННОЙ ДЛЯ НАТАШИ!`;
        hostState.subline = `Наташа с высунутым язычком бежит играть со струйками воды!`;
        broadcastStateToPhones();
        renderHostHUD();

        setTimeout(() => {
          hostState.cats.natashaWaterActive = true;
          SFX.waterSplash();
          spawnWaterSplash(lm.bath.x, lm.bath.y);
          actor.gold += 3;
          actor.stealth = true;
          spawnBannerPopup(lm.bath.x, lm.bath.y - 50, `💧 ИГРА С ВОДОЙ! +3 🪙 И СКРЫТНОСТЬ`, '#38bdf8');
          addLog(`💧 ${actor.name} включил воду для Наташи! Наташа счастлива и приносит +3 🪙 и Скрытность от воров.`);
          renderHostHUD();
        }, 1150);

        setTimeout(() => finishTurnAndAdvance(), duration);
        return;
      }

      // 7. ВЗЯТЬ СТЕПАНА НА РУКИ И НАПРАВИТЬ В ЦЕНТР СОБЫТИЙ
      if (actionType === 'STEPAN') {
        const victim = hostState.players.find(p => p.id === targetId);
        const targetPos = { x: lm.vault.x, y: lm.vault.y + 18 };
        hostState.scene = {
          type: 'STEPAN',
          actorIdx,
          victimIdx: -1,
          targetPos,
          startTime: performance.now(),
          duration
        };

        hostState.headline = `🔥 ${actor.name.toUpperCase()} БЕРЁТ СТЕПАНА НА РУКИ И НАГЛАЖИВАЕТ!`;
        hostState.subline = `Степан обожает быть в центре внимания и ложится прямо на чужие вещи!`;
        broadcastStateToPhones();
        renderHostHUD();

        setTimeout(() => {
          actor.gold += 3;
          if (victim) {
            hostState.cats.stepanLocation = victim.id;
            const take = Math.min(victim.gold, 2);
            victim.gold -= take;
            actor.gold += take;
            const vPos = getPlayerHomePos(hostState.players.indexOf(victim), hostState.players.length);
            spawnBannerPopup(vPos.x, vPos.y - 75, `🐱 СТЕПАН ЛЁГ НА ВЕЩИ! -${take} 🪙`, '#fb923c');
            addLog(`🔥 Довольный Степан улёгся прямо на вещи ${victim.name} и принёс ${actor.name} в сумме +${3 + take} 🪙!`);
          } else {
            hostState.cats.stepanLocation = 'VAULT';
            addLog(`🔥 ${actor.name} подержал Степана на руках и получил +3 🪙!`);
          }
          SFX.coin();
          renderHostHUD();
        }, 1150);

        setTimeout(() => finishTurnAndAdvance(), duration);
        return;
      }
    }

    function finishTurnAndAdvance() {
      const active = hostState.players[hostState.activeIndex];

      // Проверка победы: 3 Королевских Рубина
      if (active.rubies >= 3) {
        hostState.winner = active;
        hostState.phase = 'GAME_OVER';
        hostState.scene = null;
        hostState.headline = `👑 ПОБЕДИТЕЛЬ ПАРТИИ: ${active.name.toUpperCase()}!`;
        hostState.subline = `Собраны все 3 Королевских Рубина Особняка Трёх Кошек!`;
        SFX.fanfare();
        broadcastStateToPhones();
        renderHostHUD();
        return;
      }

      // Переход хода
      hostState.activeIndex = (hostState.activeIndex + 1) % hostState.players.length;
      const newRoundStarted = hostState.activeIndex === 0;
      if (newRoundStarted) {
        hostState.round += 1;
      }

      // КАЖДЫЕ 2 РАУНДА ПО ЧАСАМ: НАТАША ИДЁТ ПРОСИТЬ ПОЕСТЬ, ПОКУСЫВАЯ И ОБТИРАЯСЬ ОБ ИГРОКА!
      if (newRoundStarted && hostState.round % 2 === 0) {
        runNatashaFeedingClockEvent(() => startNextPlayerTurn());
      } else {
        startNextPlayerTurn();
      }
    }

    // Специальная сценка каждые 2 раунда: Наташа просит есть как по часам!
    function runNatashaFeedingClockEvent(onDone) {
      // Наташа выбирает самого богатого игрока
      const sorted = [...hostState.players].sort((a, b) => b.gold - a.gold);
      const target = sorted[0];
      const targetIdx = hostState.players.indexOf(target);
      const tPos = getPlayerHomePos(targetIdx, hostState.players.length);

      hostState.phase = 'ANIMATING';
      hostState.scene = {
        type: 'NATASHA_FEED',
        actorIdx: -1,
        victimIdx: targetIdx,
        targetPos: tPos,
        startTime: performance.now(),
        duration: 2800
      };

      hostState.headline = `⏰ ЧАСЫ КОРМЁЖКИ НАТАШИ! ОНА БЕЖИТ К ИГРОКУ ${target.name.toUpperCase()}!`;
      hostState.subline = `Наташа с высунутым язычком трётся об ноги и покусывает, требуя вкусняшку!`;
      broadcastStateToPhones();
      renderHostHUD();

      setTimeout(() => {
        if (target.gold >= 1) {
          target.gold -= 1;
          target.hp = Math.min(3, target.hp + 1);
          target.shield = true;
          SFX.coin();
          spawnBannerPopup(tPos.x, tPos.y - 75, `🐟 НАТАША ПОКОРМЛЕНА! +1 ❤️ И ЩИТ`, '#38bdf8');
          addLog(`🐟 Наташа покусала за ногу ${target.name}, выпросила угощение за 1 🪙 и подарила Щит и +1 ❤️!`);
        } else {
          spawnBannerPopup(tPos.x, tPos.y - 75, `😼 КУСЬ! НЕТ ЕДЫ!`, '#fb923c');
          addLog(`😼 У ${target.name} не нашлось монетки на корм — Наташа сделала «кусь» и убежала к воде!`);
        }
        renderHostHUD();
      }, 1200);

      setTimeout(() => {
        hostState.scene = null;
        onDone();
      }, 2800);
    }

    function broadcastStateToPhones() {
      const activePlayer = hostState.players[hostState.activeIndex];
      const publicPlayers = hostState.players.map(p => ({
        id: p.id,
        name: p.name,
        color: p.color,
        gold: p.gold,
        rubies: p.rubies,
        hp: p.hp,
        shield: p.shield
      }));

      hostState.players.forEach((p, idx) => {
        if (p.conn && p.conn.open) {
          p.conn.send({
            type: 'SYNC',
            themeHue: themeState.hue,
            themeSat: themeState.sat,
            phase: hostState.phase,
            round: hostState.round,
            isMyTurn: idx === hostState.activeIndex,
            activePlayerName: activePlayer ? activePlayer.name : '',
            headline: hostState.headline,
            winner: hostState.winner ? hostState.winner.name : null,
            players: publicPlayers,
            me: {
              id: p.id,
              name: p.name,
              color: p.color,
              gold: p.gold,
              rubies: p.rubies,
              hp: p.hp,
              shield: p.shield
            }
          });
        }
      });
    }

    /***************************************************************************
     * 7. ОТРИСОВКА ИНТЕРФЕЙСА ЭКРАНА ТВ
     ***************************************************************************/
    function renderHostHUD() {
      if (mode !== 'HOST') return;

      const playersHtml = hostState.players.map((p, idx) => {
        const isTurn = (hostState.phase !== 'LOBBY' && idx === hostState.activeIndex);
        const isSonyaOwner = hostState.cats.sonyaOwnerId === p.id;
        return `
          <div class="p-row ${isTurn ? 'active-turn' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="display:flex; align-items:center; gap:7px; font-weight:900;">
                <span style="width:12px; height:12px; border-radius:50%; background:${p.color}; display:inline-block; border:2px solid #fff;"></span>
                <span>${p.name} ${p.isBot ? '🤖' : ''}</span>
              </div>
              <span style="color:var(--gold); font-weight:900;">🪙 ${p.gold} | 💎 ${p.rubies}/3</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.76rem; color:var(--text-muted);">
              <span>Жизни: ${'❤️'.repeat(p.hp)} ${p.shield ? '🛡️ Щит' : ''}</span>
              <span>${isSonyaOwner ? '🐾 Любимчик Сони' : ''}</span>
            </div>
          </div>
        `;
      }).join('');

      const sonyaOwner = hostState.players.find(p => p.id === hostState.cats.sonyaOwnerId);
      const stepanTarget = hostState.players.find(p => p.id === hostState.cats.stepanLocation);

      const logsHtml = hostState.logs.map(l => `<div class="log-item">${l}</div>`).join('');

      let centerModalHtml = '';
      if (hostState.phase === 'LOBBY') {
        centerModalHtml = `
          <div class="glass-panel interactive" style="padding:22px 28px; text-align:center; max-width:520px; margin:auto;">
            <div class="title-grand" style="font-size:1.5rem;">ДОБРО ПОЖАЛОВАТЬ В ОСОБНЯК</div>
            <div style="text-align:left; font-size:0.84rem; line-height:1.45; margin:10px 0 14px; background:rgba(0,0,0,0.4); padding:12px; border-radius:10px;">
              🗡️ <b>Удар Кинжалом:</b> персонаж подходит к сопернику, ранит его ножом и забирает половину золота.<br/>
              🕵️ <b>Кража:</b> персонаж в маске крадётся за спину и вытаскивает до 3 монет.<br/>
              🐱 <b>Три Кошки:</b> тихая <b>Соня</b> спит у хозяина и спасает от ножа, <b>Наташа</b> с высунутым языком играет с водой в ванной и каждые 2 раунда просит поесть, а авантюрист <b>Степан</b> ложится у двери Сейфа и на чужие вещи!<br/>
              💎 <b>Цель:</b> первым собрать <b>3 Королевских Рубина</b>!
            </div>
            <div style="display:flex; gap:10px; justify-content:center; margin-bottom:10px;">
              <button class="btn" id="btn-add-bot">+ Добавить ИИ-Гостя</button>
            </div>
            <button class="btn btn-gold" id="btn-start-match" style="width:100%; font-size:1.12rem; padding:14px;">
              2. Начать Партию на Экране ТВ ▶
            </button>
          </div>
        `;
      } else if (hostState.phase === 'GAME_OVER') {
        centerModalHtml = `
          <div class="glass-panel interactive" style="padding:26px 34px; text-align:center; margin:auto;">
            <div class="title-grand" style="font-size:2rem;">👑 ПОБЕДИТЕЛЬ: ${hostState.winner.name}!</div>
            <p style="margin:10px 0 18px;">Собраны все 3 Королевских Рубина Полуночного Особняка!</p>
            <button class="btn btn-gold" onclick="location.reload()">Сыграть Ещё Раз</button>
          </div>
        `;
      }

      appEl.innerHTML = `
        <div class="tv-layout">
          <div class="glass-panel tv-header">
            <div style="display:flex; align-items:center; gap:14px;">
              <span style="font-weight:900; font-size:1.15rem; color:var(--gold);">ПОЛУНОЧНЫЙ ОСОБНЯК</span>
              <span style="font-size:0.84rem; color:var(--text-muted);">Раунд ${hostState.round} • Цель: 3 Рубина 💎</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:0.82rem;">КОД КОМНАТЫ:</span>
              <span class="pin-display">${hostState.pin}</span>
            </div>
          </div>

          <div class="glass-panel tv-left">
            <div style="font-weight:900; font-size:0.86rem; color:var(--gold); border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:5px;">
              ПЕРСОНАЖИ В ЗАЛЕ: ${hostState.players.length} из 8
            </div>
            ${playersHtml || '<div style="opacity:0.65; font-size:0.82rem;">Подключитесь со смартфона или нажмите Начать Партию...</div>'}
          </div>

          <div class="tv-stage">
            <div class="cinematic-banner">
              <div style="font-weight:900; font-size:1.08rem; color:var(--gold);">${hostState.headline}</div>
              <div style="font-size:0.83rem; margin-top:2px; opacity:0.92;">${hostState.subline}</div>
            </div>
            ${centerModalHtml}
            <div></div>
          </div>

          <div class="glass-panel tv-right">
            <div style="font-weight:900; font-size:0.86rem; color:var(--gold); border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:5px;">
              ХРОНИКА ПРОИСШЕСТВИЙ
            </div>
            <div class="log-feed">${logsHtml}</div>
          </div>

          <div class="glass-panel tv-bottom">
            <div style="font-size:0.75rem; font-weight:800; color:var(--gold);">
              🐱 ТРИ КОШКИ ОСОБНЯКА И ИХ ПОВЕДЕНИЕ СЕЙЧАС:
            </div>
            <div class="cats-status-grid">
              <div class="cat-status-card" style="border-left: 3px solid #f472b6;">
                <div style="font-weight:900; color:#f472b6;">🐾 СОНЯ — Тихая и Верная</div>
                <div>Хозяин сейчас: <b>${sonyaOwner ? sonyaOwner.name : 'Спит одна на подушке'}</b></div>
                <div style="color:var(--gold);">Спасительных «Мяу» осталось: ${hostState.cats.sonyaMeowsLeft} из 2</div>
              </div>
              <div class="cat-status-card" style="border-left: 3px solid #38bdf8;">
                <div style="font-weight:900; color:#38bdf8;">👅 НАТАША — Язычок, Вода и Еда</div>
                <div>Любит струйки воды в ванной и просит есть каждые 2 раунда</div>
                <div style="color:var(--gold);">Кормёжка через: ${2 - (hostState.round % 2)} р.</div>
              </div>
              <div class="cat-status-card" style="border-left: 3px solid #fb923c;">
                <div style="font-weight:900; color:#fb923c;">🔥 СТЕПАН — В Центре Внимания</div>
                <div>Где лежит сейчас: <b>${stepanTarget ? 'На вещах ' + stepanTarget.name : 'Поперёк двери Сейфа'}</b></div>
                <div style="color:var(--gold);">Любит, когда его гладят и берут на руки</div>
              </div>
            </div>
          </div>
        </div>
      `;

      const bBot = document.getElementById('btn-add-bot');
      if (bBot) bBot.onclick = addBotOnHost;

      const bStart = document.getElementById('btn-start-match');
      if (bStart) bStart.onclick = startMansionGame;
    }

    /***************************************************************************
     * 8. МОБИЛЬНЫЙ КОНТРОЛЛЕР НА СМАРТФОНЕ
     ***************************************************************************/
    const clientState = {
      pin: '',
      name: '',
      connected: false,
      phase: 'LOBBY',
      round: 1,
      isMyTurn: false,
      activePlayerName: '',
      headline: '',
      winner: null,
      players: [],
      me: null,
      conn: null
    };

    function initClientMode(pin, name) {
      mode = 'CLIENT';
      clientState.pin = pin;
      clientState.name = name;
      renderClientPhone('Подключение к Полуночному Особняку...');

      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(ROOM_PREFIX + pin, { reliable: true });
        clientState.conn = conn;

        conn.on('open', () => {
          clientState.connected = true;
          conn.send({ type: 'JOIN', name: clientState.name });
          renderClientPhone();
        });

        conn.on('data', (data) => {
          if (data.type === 'SYNC') {
            if (typeof data.themeHue === 'number') {
              setGlobalTheme(data.themeHue, data.themeSat || 82);
            }
            Object.assign(clientState, data);
            renderClientPhone();
          }
        });

        conn.on('close', () => {
          clientState.connected = false;
          renderClientPhone('Связь с экраном ТВ прервана.');
        });
      });

      peer.on('error', () => {
        renderClientPhone('Не найдена комната с PIN ' + pin);
      });
    }

    function renderClientPhone(statusMsg = '') {
      if (mode !== 'CLIENT') return;

      if (!clientState.connected || !clientState.me) {
        appEl.innerHTML = `
          <div class="glass-panel center-modal">
            <div class="title-grand" style="font-size:1.45rem;">ВХОД В ОСОБНЯК</div>
            <p>${statusMsg || 'Синхронизация с Главным экраном...'}</p>
            <button class="btn" onclick="location.reload()">Назад</button>
          </div>
        `;
        return;
      }

      const me = clientState.me;
      const rivals = clientState.players.filter(p => p.id !== me.id);
      let bodyHtml = '';

      if (clientState.phase === 'LOBBY') {
        bodyHtml = `
          <div style="text-align:center; padding:22px 10px;">
            <div style="font-size:1.25rem; font-weight:900; color:var(--gold);">Ваш персонаж уже в Зале!</div>
            <p style="margin-top:8px; font-size:0.9rem; opacity:0.88;">
              Посмотрите на Главный экран ТВ и нажмите там кнопку «Начать Партию»!
            </p>
          </div>
        `;
      } else if (clientState.phase === 'PLAYER_TURN' && clientState.isMyTurn) {
        const attackButtons = rivals.map(r => `
          <button class="action-btn-phone" data-act="ATTACK" data-target="${r.id}" style="border-left: 4px solid #ff2a4b;">
            <div style="display:flex; justify-content:space-between; font-weight:900; color:#ff4d6d;">
              <span>🗡️ Напасть с ножом на «${r.name}»</span>
              <span>У него 🪙 ${r.gold}</span>
            </div>
            <div style="font-size:0.76rem; opacity:0.88;">Подойти и нанести удар кинжалом, забрав половину его золота!</div>
          </button>
        `).join('');

        const stealButtons = rivals.map(r => `
          <button class="action-btn-phone" data-act="STEAL" data-target="${r.id}" style="border-left: 4px solid #facc15;">
            <div style="display:flex; justify-content:space-between; font-weight:900; color:var(--gold);">
              <span>🕵️ Обокрасть карманы «${r.name}»</span>
              <span>До +3 🪙</span>
            </div>
            <div style="font-size:0.76rem; opacity:0.88;">Подкрасться со спины в маске и вытащить до 3 монет без шума.</div>
          </button>
        `).join('');

        const firstRivalId = rivals[0] ? rivals[0].id : '';

        bodyHtml = `
          <div style="font-weight:900; color:var(--gold); margin-bottom:8px;">
            ВАШ ХОД! ВЫБЕРИТЕ ДЕЙСТВИЕ ПЕРСОНАЖА:
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <button class="action-btn-phone" data-act="BUY_RUBY" data-target="" ${me.gold < 6 ? 'disabled' : ''}
              style="border: 2px solid var(--gold); background: rgba(225, 29, 72, 0.28);">
              <div style="display:flex; justify-content:space-between; font-weight:900; color:var(--gold);">
                <span>💎 Купить Королевский Рубин Победы</span>
                <span>Цена: 6 🪙</span>
              </div>
              <div style="font-size:0.76rem;">Соберите 3 Рубина для немедленной победы в партии!</div>
            </button>

            <button class="action-btn-phone" data-act="VAULT" data-target="" style="border-left: 4px solid #34d399;">
              <div style="font-weight:900; color:#6ee7b7;">🏦 Взломать Золотой Сейф в центре зала — +4 или +5 🪙</div>
              <div style="font-size:0.76rem; opacity:0.88;">Подойти к Сейфу, погладить Степана у двери и забрать золото.</div>
            </button>

            <div style="font-size:0.78rem; font-weight:800; color:var(--gold); margin-top:4px;">
              🐱 ВЗАИМОДЕЙСТВИЕ С КОШКАМИ ОСОБНЯКА:
            </div>

            <button class="action-btn-phone" data-act="SONYA" data-target="" style="border-left: 4px solid #f472b6;">
              <div style="font-weight:900; color:#f472b6;">🐾 Тихо погладить Соню — Стать её хозяином, +2 🪙 и Щит</div>
              <div style="font-size:0.76rem; opacity:0.88;">Соня перейдёт спать к вашим ногам, вылечит +1 ❤️ и защитит от ножа!</div>
            </button>

            <button class="action-btn-phone" data-act="NATASHA_WATER" data-target="" style="border-left: 4px solid #38bdf8;">
              <div style="font-weight:900; color:#38bdf8;">👅 Включить воду в ванной для Наташи — +3 🪙 и Скрытность</div>
              <div style="font-size:0.76rem; opacity:0.88;">Наташа с высунутым язычком побежит играть с водой и найдёт вам клад.</div>
            </button>

            <button class="action-btn-phone" data-act="STEPAN" data-target="${firstRivalId}" style="border-left: 4px solid #fb923c;">
              <div style="font-weight:900; color:#fb923c;">🔥 Взять Степана на руки и нагладить — до +5 🪙</div>
              <div style="font-size:0.76rem; opacity:0.88;">Степан развалится прямо на вещах соперника и принесёт вам монеты!</div>
            </button>

            <div style="font-size:0.78rem; font-weight:800; color:#ff4d6d; margin-top:4px;">
              🗡️ ПРЯМОЕ НАПАДЕНИЕ И ГРАБЁЖ СОПЕРНИКОВ:
            </div>
            ${attackButtons}
            ${stealButtons}
          </div>
        `;
      } else if (clientState.phase === 'GAME_OVER') {
        bodyHtml = `
          <div style="text-align:center; padding:24px;">
            <div class="title-grand" style="font-size:1.5rem;">👑 ПОБЕДИТЕЛЬ: ${clientState.winner}</div>
          </div>
        `;
      } else {
        bodyHtml = `
          <div style="text-align:center; padding:24px 10px;">
            <div style="font-size:1.15rem; font-weight:900; color:var(--gold);">
              👀 СМОТРИТЕ НА ГЛАВНЫЙ ЭКРАН!
            </div>
            <p style="margin-top:8px; font-size:0.9rem;">
              ${clientState.headline || 'Сейчас разыгрывается ход игрока ' + clientState.activePlayerName}
            </p>
          </div>
        `;
      }

      appEl.innerHTML = `
        <div class="phone-wrap">
          <div class="glass-panel" style="padding:12px 14px; display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="width:14px; height:14px; border-radius:50%; background:${me.color}; display:inline-block; border:2px solid #fff;"></span>
              <div>
                <div style="font-weight:900; font-size:1.05rem;">${me.name}</div>
                <div style="font-size:0.75rem; color:var(--gold);">Жизни: ${'❤️'.repeat(me.hp)} • Рубины: ${me.rubies}/3 💎</div>
              </div>
            </div>
            <div style="font-weight:900; font-size:1.15rem; color:var(--gold);">🪙 ${me.gold}</div>
          </div>

          <div class="glass-panel" style="padding:14px; flex:1; overflow-y:auto;">
            ${bodyHtml}
          </div>
        </div>
      `;

      document.querySelectorAll('[data-act]').forEach(btn => {
        btn.onclick = () => {
          clientState.conn.send({
            type: 'PERFORM_ACTION',
            actionType: btn.getAttribute('data-act'),
            targetId: btn.getAttribute('data-target')
          });
        };
      });
    }

    // Запуск стартового экрана
    renderMenu();
  </script>
</body>
  </html>
