<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Королевский Стол: Война Трёх Знамён</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --theme-hue: 18;
      --theme-sat: 80%;
      --bg-dark: hsl(18, 70%, 5%);
      --glass-bg: hsla(18, 60%, 9%, 0.85);
      --glass-border: hsla(38, 90%, 60%, 0.42);
      --accent: hsl(18, 92%, 58%);
      --accent-soft: hsla(18, 92%, 58%, 0.25);
      --gold: #ffcf54;
      --gold-dark: #b45309;
      --text-main: #fffbeb;
      --text-muted: hsl(38, 75%, 82%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: Georgia, 'Times New Roman', serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    #webgl-table {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    /* Проекционные 2D-знамёна над 3D-замками */
    #banners-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .castle-banner {
      position: absolute;
      transform: translate(-50%, -100%);
      background: rgba(16, 10, 6, 0.9);
      border: 2px solid var(--gold);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fffbeb;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0,0,0,0.85);
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .castle-banner.targeted {
      transform: translate(-50%, -112%) scale(1.12);
      border-color: #ffffff;
      box-shadow: 0 0 22px var(--gold);
    }

    .cat-guardian-tag {
      position: absolute;
      transform: translate(-50%, -100%);
      background: rgba(24, 12, 18, 0.94);
      border: 2px solid #fff;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.85);
    }

    /* Средневековые панели с золотой окантовкой */
    .medieval-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.8), inset 0 0 24px var(--accent-soft);
      color: var(--text-main);
    }

    #app {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Верхняя полоса выбора цвета */
    .top-color-bar {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(14, 8, 5, 0.9);
      border: 1.5px solid var(--gold);
      pointer-events: auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.75);
    }

    .c-dot {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .c-dot:hover {
      transform: scale(1.18);
      border-color: var(--gold);
    }

    .c-random-btn {
      background: linear-gradient(90deg, #dc2626, #d97706, #059669, #2563eb, #7c3aed);
      border: 1px solid var(--gold);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .btn {
      background: linear-gradient(180deg, hsla(var(--theme-hue), 75%, 38%, 0.9), hsla(var(--theme-hue), 80%, 18%, 0.96));
      border: 1.5px solid var(--gold);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      pointer-events: auto;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .btn:hover:not(:disabled) {
      box-shadow: 0 0 18px rgba(255, 207, 84, 0.45);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-royal {
      background: linear-gradient(180deg, #d97706, #78350f);
      border: 2px solid var(--gold);
      color: #fffbeb;
      box-shadow: 0 0 24px rgba(255, 207, 84, 0.35);
    }

    input[type="text"] {
      background: rgba(12, 7, 4, 0.92);
      border: 1.5px solid var(--glass-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1.05rem;
      outline: none;
      width: 100%;
      text-align: center;
      pointer-events: auto;
    }

    .center-modal {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 26px 30px;
      max-width: 600px;
      width: 94%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
      pointer-events: auto;
    }

    .title-medieval {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--gold);
      text-shadow: 0 3px 12px rgba(0,0,0,0.9);
      text-transform: uppercase;
    }

    /* Сетка экрана ТВ */
    .tv-layout {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 295px 1fr 305px;
      grid-template-rows: 64px 1fr 122px;
      gap: 12px;
      padding: 12px;
    }

    .tv-header {
      grid-column: 1 / 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .pin-crest {
      background: rgba(10, 5, 2, 0.75);
      border: 2px solid var(--gold);
      padding: 4px 14px;
      border-radius: 8px;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold);
    }

    .tv-left {
      grid-column: 1 / 2;
      grid-row: 2 / 4;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .tv-stage {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      pointer-events: none;
    }

    .tv-right {
      grid-column: 3 / 4;
      grid-row: 2 / 4;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .tv-bottom {
      grid-column: 2 / 3;
      grid-row: 3 / 4;
      padding: 9px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .lord-card {
      background: rgba(10, 6, 4, 0.65);
      border: 1px solid rgba(255, 207, 84, 0.25);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lord-card.active-turn {
      border: 2px solid var(--gold);
      background: linear-gradient(135deg, hsla(var(--theme-hue), 80%, 24%, 0.9), rgba(20, 10, 5, 0.95));
      box-shadow: 0 0 18px rgba(255, 207, 84, 0.35);
    }

    .chronicle-banner {
      background: rgba(14, 8, 5, 0.92);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 8px 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      max-width: 96%;
    }

    .guardians-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      height: 100%;
    }

    .guardian-box {
      background: rgba(8, 4, 2, 0.6);
      border: 1px solid rgba(255, 207, 84, 0.28);
      border-radius: 9px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.73rem;
    }

    .log-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.78rem;
      padding-right: 4px;
    }

    .log-entry {
      background: rgba(0, 0, 0, 0.42);
      border-left: 3px solid var(--gold);
      padding: 6px 9px;
      border-radius: 0 8px 8px 0;
      line-height: 1.32;
    }

    /* СМАРТФОН КАК СРЕДНЕВЕКОВЫЙ ГЕЙМПАД */
    .gamepad-wrap {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      margin: 0 auto;
      padding: 44px 12px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      pointer-events: auto;
    }

    .province-dpad {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .dpad-btn {
      padding: 10px 8px;
      border-radius: 10px;
      background: rgba(15, 9, 5, 0.88);
      border: 1.5px solid rgba(255, 207, 84, 0.3);
      color: #fffbeb;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
    }

    .dpad-btn.selected {
      border: 2px solid var(--gold);
      background: hsla(var(--theme-hue), 80%, 28%, 0.95);
      box-shadow: 0 0 14px rgba(255, 207, 84, 0.4);
    }

    .gamepad-action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .gp-action-btn {
      padding: 12px 10px;
      border-radius: 12px;
      background: rgba(18, 10, 6, 0.94);
      border: 2px solid var(--glass-border);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }

    .gp-action-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .gp-action-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Верхняя панель смены цвета -->
  <div class="top-color-bar">
    <span style="font-size:0.74rem; font-weight:800; color:var(--gold); margin-right:4px;">ЦВЕТ:</span>
    <div class="c-dot" style="background:hsl(18, 80%, 42%);" data-hue="18" data-sat="80"></div>
    <div class="c-dot" style="background:hsl(350, 82%, 44%);" data-hue="350" data-sat="82"></div>
    <div class="c-dot" style="background:hsl(155, 76%, 38%);" data-hue="155" data-sat="76"></div>
    <div class="c-dot" style="background:hsl(215, 82%, 46%);" data-hue="215" data-sat="82"></div>
    <div class="c-dot" style="background:hsl(272, 76%, 46%);" data-hue="272" data-sat="76"></div>
    <button class="c-random-btn" id="btn-top-random">🎲 Рандом</button>
  </div>

  <!-- 3D-сцена Средневекового Королевского Стола -->
  <div id="webgl-table"></div>

  <!-- 2D-знамёна поверх 3D-замков -->
  <div id="banners-layer"></div>

  <!-- Слой интерфейса -->
  <div id="app"></div>

  <script>
    /***************************************************************************
     * 1. УПРАВЛЕНИЕ ЦВЕТОВОЙ ТЕМОЙ И СИНХРОНИЗАЦИЯ С ГЕЙМПАДАМИ
     ***************************************************************************/
    const themeState = { hue: 18, sat: 80 };

    function setGlobalTheme(hue, sat = 80) {
      themeState.hue = ((hue % 360) + 360) % 360;
      themeState.sat = sat;
      const h = themeState.hue;
      const s = themeState.sat;
      const r = document.documentElement;

      r.style.setProperty('--theme-hue', h);
      r.style.setProperty('--theme-sat', `${s}%`);
      r.style.setProperty('--bg-dark', `hsl(${h}, 70%, 5%)`);
      r.style.setProperty('--glass-bg', `hsla(${h}, 60%, 9%, 0.85)`);
      r.style.setProperty('--glass-border', `hsla(${h}, 85%, 62%, 0.42)`);
      r.style.setProperty('--accent', `hsl(${h}, 92%, 58%)`);
      r.style.setProperty('--accent-soft', `hsla(${h}, 92%, 58%, 0.25)`);
      r.style.setProperty('--text-muted', `hsl(${h}, 75%, 84%)`);

      update3DTableAtmosphere();
      if (mode === 'HOST') broadcastStateToGamepads();
    }

    document.querySelectorAll('.c-dot').forEach(dot => {
      dot.onclick = () => {
        setGlobalTheme(Number(dot.getAttribute('data-hue')), Number(dot.getAttribute('data-sat')));
        SFX.horn();
      };
    });

    document.getElementById('btn-top-random').onclick = () => {
      setGlobalTheme(Math.floor(Math.random() * 360), 70 + Math.floor(Math.random() * 25));
      SFX.horn();
    };

    /***************************************************************************
     * 2. СРЕДНЕВЕКОВЫЙ ЗВУКОВОЙ СИНТЕЗАТОР (МЕЧИ, ГОРН, КАТАПУЛЬТА, МЯУКАНЬЕ)
     ***************************************************************************/
    const SFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      tone(freq, type = 'sine', dur = 0.18, vol = 0.12, slide = null) {
        if (!this.ctx) return;
        try {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = type;
          o.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (slide) o.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
          g.gain.setValueAtTime(vol, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start();
          o.stop(this.ctx.currentTime + dur);
        } catch (e) {}
      },
      horn() {
        this.tone(220, 'sawtooth', 0.35, 0.11, 330);
        setTimeout(() => this.tone(330, 'triangle', 0.4, 0.12), 180);
      },
      swords() {
        for (let i = 0; i < 4; i++) {
          setTimeout(() => this.tone(720 + i * 110, 'sawtooth', 0.09, 0.12, 240), i * 120);
        }
      },
      coin() {
        this.tone(987, 'sine', 0.1, 0.1);
        setTimeout(() => this.tone(1318, 'triangle', 0.2, 0.12), 65);
      },
      sonyaMeow() {
        this.tone(560, 'sine', 0.35, 0.14, 750);
        setTimeout(() => this.tone(750, 'sine', 0.4, 0.12, 490), 220);
      },
      waterWave() {
        for (let i = 0; i < 6; i++) {
          setTimeout(() => this.tone(350 + Math.random() * 450, 'sine', 0.09, 0.09), i * 55);
        }
      },
      fanfare() {
        [261, 329, 392, 523, 659].forEach((f, i) => {
          setTimeout(() => this.tone(f, 'triangle', 0.28, 0.15), i * 100);
        });
      }
    };

    /***************************************************************************
     * 3. 7 ЗЕМЕЛЬ СРЕДНЕВЕКОВОГО КОРОЛЕВСТВА И ТРИ КОШКИ-ХРАНИТЕЛЬНИЦЫ
     ***************************************************************************/
    const PROVINCES_DATA = [
      {
        id: 0, x: 0, z: 0,
        name: 'Тронная Цитадель',
        terrainColor: 0x6b1d2f,
        specialType: 'throne',
        income: 4,
        desc: 'Сердце королевства. Захват Цитадели дарит Королевскую Корону'
      },
      {
        id: 1, x: -9.5, z: -6.2,
        name: 'Тёмный Шатёр Сони',
        terrainColor: 0x3b1d2e,
        specialType: 'sonya_tent',
        income: 2,
        desc: 'Бархатный шатёр-плед, где спит тихая полосатая Соня и дарит защиту'
      },
      {
        id: 2, x: 9.5, z: -6.2,
        name: 'Водяная Мельница Наташи',
        terrainColor: 0x164e63,
        specialType: 'natasha_mill',
        income: 3,
        desc: 'Речная плотина и пиршественный стол с клетчатой чашей для Наташи'
      },
      {
        id: 3, x: 9.8, z: 6.2,
        name: 'Пурпурный Мост Степана',
        terrainColor: 0x581c87,
        specialType: 'stepan_gate',
        income: 3,
        desc: 'Крепостные врата с фиолетовой плиткой, где поперёк дороги лежит Степан'
      },
      {
        id: 4, x: -9.8, z: 6.2,
        name: 'Золотые Рудники',
        terrainColor: 0x713f12,
        specialType: 'gold_mine',
        income: 4,
        desc: 'Богатые копи, приносящие своему владельцу по 4 золотых червонца'
      },
      {
        id: 5, x: 0, z: -9.2,
        name: 'Осадная Кузница',
        terrainColor: 0x334155,
        specialType: 'forge',
        income: 2,
        desc: 'Королевская оружейная, усиливающая рыцарские полки в битвах'
      },
      {
        id: 6, x: 0, z: 9.2,
        name: 'Аббатство Заката',
        terrainColor: 0x14532d,
        specialType: 'abbey',
        income: 3,
        desc: 'Древний монастырь на холме с высокой сторожевой башней'
      }
    ];

    const HERALDIC_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f97316', '#a855f7', '#14b8a6', '#eab308', '#ec4899'];
    const ROOM_PREFIX = 'royal-table-war-';
    const appEl = document.getElementById('app');
    const bannersLayer = document.getElementById('banners-layer');

    let mode = 'MENU'; // MENU | HOST | CLIENT
    let peer = null;

    const hostState = {
      pin: '',
      phase: 'LOBBY', // LOBBY | TURN_GAMEPAD | ANIMATING | GAME_OVER
      round: 1,
      activeIndex: 0,
      targetedProvinceId: 0,
      sonyaMeowsLeft: 2,
      sonyaProtectedLordId: null,
      stepanBlockedProvinceId: 3,
      headline: 'СОВЕТ ЛОРДОВ У КОРОЛЕВСКОГО СТОЛА',
      subline: 'Подключите смартфоны как геймпады и начните борьбу за 3 Королевские Короны',
      winnerName: '',
      players: [], // { id, name, color, gold, crowns, isBot, conn }
      provinces: [], // { id, ownerId, knights, fortLevel }
      logs: []
    };

    // Инициализация провинций
    function resetProvincesState() {
      hostState.provinces = PROVINCES_DATA.map(p => ({
        id: p.id,
        ownerId: null,
        knights: p.id === 0 ? 4 : 2,
        fortLevel: 1
      }));
    }
    resetProvincesState();

    /***************************************************************************
     * 4. 3D-ДВИЖОК THREE.JS: СРЕДНЕВЕКОВЫЕ ЗАМКИ, РЫЦАРИ, КАТАПУЛЬТЫ И 3 КОШКИ
     ***************************************************************************/
    let scene, camera, renderer, ambientLight, torchLight1, torchLight2;
    const province3DGroups = {}; // id -> { group, castleMat, bannerMesh, knightsGroup }
    const cat3DModels = {};      // sonya, natasha, stepan
    const marchingSquad = {
      active: false,
      group: null,
      fromPos: new THREE.Vector3(),
      toPos: new THREE.Vector3(),
      progress: 0,
      fireball: null
    };

    const cameraTarget = new THREE.Vector3(0, 0, 0);
    const cameraPosGoal = new THREE.Vector3(0, 25, 24);

    function initMedieval3DWorld() {
      const container = document.getElementById('webgl-table');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x140804, 0.016);

      camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.copy(cameraPosGoal);
      camera.lookAt(cameraTarget);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      ambientLight = new THREE.AmbientLight(0xffe4b5, 0.65);
      scene.add(ambientLight);

      torchLight1 = new THREE.PointLight(0xff9933, 1.2, 55);
      torchLight1.position.set(-16, 18, 12);
      scene.add(torchLight1);

      torchLight2 = new THREE.PointLight(0xffaa44, 1.1, 55);
      torchLight2.position.set(16, 18, -12);
      scene.add(torchLight2);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
      dirLight.position.set(10, 30, 16);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 1. Поверхность резного дубового Королевского Стола и средневекового моря
      const tableBoard = new THREE.Mesh(
        new THREE.CylinderGeometry(18.5, 19.5, 1.2, 48),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.2 })
      );
      tableBoard.position.y = -0.8;
      scene.add(tableBoard);

      const goldRim = new THREE.Mesh(
        new THREE.TorusGeometry(19.0, 0.45, 12, 64),
        new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.7, roughness: 0.3 })
      );
      goldRim.rotation.x = Math.PI / 2;
      goldRim.position.y = -0.3;
      scene.add(goldRim);

      // 2. Каменные средневековые мосты от всех земель к Тронной Цитадели
      const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.8 });
      PROVINCES_DATA.slice(1).forEach(p => {
        const vec = new THREE.Vector3(p.x, 0, p.z);
        const len = vec.length();
        const bridge = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.35, len), bridgeMat);
        bridge.position.set(p.x / 2, -0.05, p.z / 2);
        bridge.lookAt(0, -0.05, 0);
        scene.add(bridge);
      });

      // 3. Строим 7 средневековых провинций с 3D-замками и деталями по фото кошек
      PROVINCES_DATA.forEach(pData => {
        build3DProvince(pData);
      });

      // 4. Создаём 3D-фигурки Хранителей: Сони, Наташи и Степана
      cat3DModels.sonya = createGuardianCat3D('sonya');
      cat3DModels.natasha = createGuardianCat3D('natasha');
      cat3DModels.stepan = createGuardianCat3D('stepan');

      scene.add(cat3DModels.sonya);
      scene.add(cat3DModels.natasha);
      scene.add(cat3DModels.stepan);

      // 5. Создаём 3D-отряд марширующих рыцарей и огненный снаряд катапульты для анимаций штурма
      createMarchingBattleActors();

      update3DTableAtmosphere();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      requestAnimationFrame(animateMedieval3D);
    }

    function update3DTableAtmosphere() {
      if (!scene) return;
      const bgCol = new THREE.Color(`hsl(${themeState.hue}, 70%, 5%)`);
      scene.background = bgCol;
      scene.fog.color.copy(bgCol);
    }

    function build3DProvince(pData) {
      const group = new THREE.Group();
      group.position.set(pData.x, 0, pData.z);

      // Каменное плато провинции
      const islandGeo = new THREE.CylinderGeometry(3.6, 4.1, 0.9, 8);
      const islandMat = new THREE.MeshStandardMaterial({ color: pData.terrainColor, roughness: 0.75 });
      const island = new THREE.Mesh(islandGeo, islandMat);
      island.position.y = 0.2;
      group.add(island);

      // 3D-Замок с башнями и зубцами, меняющий цвет под знамя владельца
      const castleMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.55 });
      const keep = new THREE.Mesh(new THREE.BoxGeometry(2.1, 2.0, 2.1), castleMat);
      keep.position.set(0, 1.4, -0.5);
      group.add(keep);

      // 4 угловые средневековые башни с остроконечными крышами
      const roofMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.5 });
      [[-1.1, -1.5], [1.1, -1.5], [-1.1, 0.5], [1.1, 0.5]].forEach(([tx, tz]) => {
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 2.6, 12), castleMat);
        tower.position.set(tx, 1.7, tz);
        group.add(tower);

        const roof = new THREE.Mesh(new THREE.ConeGeometry(0.62, 0.9, 12), roofMat);
        roof.position.set(tx, 3.4, tz);
        group.add(roof);
      });

      // Уникальные декорации провинций по вашим фотографиям!
      if (pData.specialType === 'sonya_tent') {
        // Тёмно-бордовый рыцарский шатёр-плед Сони (по фото 1)
        const tent = new THREE.Mesh(
          new THREE.ConeGeometry(1.5, 1.8, 4),
          new THREE.MeshStandardMaterial({ color: 0x4a1d2c, roughness: 0.85 })
        );
        tent.position.set(-1.6, 1.4, 1.2);
        tent.rotation.y = Math.PI / 4;
        group.add(tent);
      } else if (pData.specialType === 'natasha_mill') {
        // Водяное колесо, красно-чёрная клетчатая чаша и цветок в белом горшке (по фото 2)
        const bowl = new THREE.Mesh(
          new THREE.CylinderGeometry(0.55, 0.42, 0.25, 16),
          new THREE.MeshStandardMaterial({ color: 0xdc2626 })
        );
        bowl.position.set(1.5, 0.8, 1.4);
        group.add(bowl);

        const whitePot = new THREE.Mesh(
          new THREE.CylinderGeometry(0.38, 0.3, 0.65, 14),
          new THREE.MeshStandardMaterial({ color: 0xffffff })
        );
        whitePot.position.set(2.3, 0.9, 0.8);
        group.add(whitePot);

        const plant = new THREE.Mesh(
          new THREE.SphereGeometry(0.6, 10, 10),
          new THREE.MeshStandardMaterial({ color: 0x15803d })
        );
        plant.position.set(2.3, 1.65, 0.8);
        group.add(plant);
      } else if (pData.specialType === 'stepan_gate') {
        // Светлые дубовые ворота и фиолетовая плитка Степана (по фото 3)
        const gateDoor = new THREE.Mesh(
          new THREE.BoxGeometry(1.8, 2.2, 0.3),
          new THREE.MeshStandardMaterial({ color: 0xd6c3a5 })
        );
        gateDoor.position.set(0, 1.5, 1.4);
        group.add(gateDoor);
      } else if (pData.specialType === 'throne') {
        // Большая золотая Корона над Центральной Цитаделью
        const crown = new THREE.Mesh(
          new THREE.CylinderGeometry(0.85, 0.65, 0.6, 8),
          new THREE.MeshStandardMaterial({ color: 0xffcf54, metalness: 0.8, roughness: 0.2 })
        );
        crown.position.set(0, 3.8, -0.5);
        group.add(crown);
      }

      // Группа 3D-фигурок рыцарей, стоящих на защите провинции
      const knightsGroup = new THREE.Group();
      group.add(knightsGroup);

      scene.add(group);
      province3DGroups[pData.id] = {
        group,
        castleMat,
        knightsGroup
      };
    }

    // Отрисовка 3D-фигурок рыцарей в каждой провинции по их реальному числу
    function refreshProvince3DKnights() {
      hostState.provinces.forEach(prov => {
        const p3d = province3DGroups[prov.id];
        if (!p3d) return;

        const owner = hostState.players.find(pl => pl.id === prov.ownerId);
        const colorHex = owner ? owner.color : '#94a3b8';
        p3d.castleMat.color.setStyle(colorHex);

        // Очищаем и заново расставляем 3D-рыцарей
        while (p3d.knightsGroup.children.length > 0) {
          p3d.knightsGroup.remove(p3d.knightsGroup.children[0]);
        }

        const count = Math.min(8, prov.knights);
        for (let i = 0; i < count; i++) {
          const kMesh = createSingle3DKnight(colorHex);
          const angle = (i / Math.max(1, count)) * Math.PI - Math.PI * 0.1;
          kMesh.position.set(Math.cos(angle) * 2.1, 0.65, Math.sin(angle) * 1.4 + 1.1);
          p3d.knightsGroup.add(kMesh);
        }
      });
    }

    function createSingle3DKnight(coatColor) {
      const k = new THREE.Group();
      const armorMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.7, roughness: 0.3 });
      const tunicMat = new THREE.MeshStandardMaterial({ color: coatColor, roughness: 0.5 });

      // Торс в рыцарском плаще
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.65, 8), tunicMat);
      body.position.y = 0.32;
      k.add(body);

      // Стальной шлем
      const helm = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 10), armorMat);
      helm.position.y = 0.78;
      k.add(helm);

      // Поднятый меч
      const sword = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.65, 0.08), armorMat);
      sword.position.set(0.28, 0.65, 0.1);
      sword.rotation.z = -0.25;
      k.add(sword);

      // Геральдический щит
      const shield = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.42, 0.08), tunicMat);
      shield.position.set(-0.24, 0.42, 0.18);
      k.add(shield);

      return k;
    }

    // 3D-модели Сони, Наташи и Степана с деталями с ваших фотографий
    function createGuardianCat3D(catType) {
      const group = new THREE.Group();
      let coatHex = 0xa6754b; // Соня
      if (catType === 'natasha') coatHex = 0xd99b52; // Наташа
      if (catType === 'stepan') coatHex = 0xdbe2e9;  // Степан

      const coatMat = new THREE.MeshStandardMaterial({ color: coatHex, roughness: 0.55 });
      const stripeMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });

      const body = new THREE.Mesh(new THREE.SphereGeometry(0.65, 16, 14), coatMat);
      body.scale.set(1.3, 0.9, 0.95);
      body.position.set(0, 0.65, 0);
      group.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.54, 16, 16), coatMat);
      head.position.set(0.55, 1.18, 0);
      group.add(head);

      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x65a30d, emissive: 0x365314, emissiveIntensity: 0.4 });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat);
      eyeL.position.set(0.98, 1.26, 0.2);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat);
      eyeR.position.set(0.98, 1.26, -0.2);
      group.add(eyeL, eyeR);

      if (catType === 'sonya') {
        const earGeo = new THREE.ConeGeometry(0.18, 0.42, 6);
        const earL = new THREE.Mesh(earGeo, coatMat);
        earL.position.set(0.52, 1.72, 0.25);
        const earR = new THREE.Mesh(earGeo, coatMat);
        earR.position.set(0.52, 1.72, -0.25);
        group.add(earL, earR);
      } else {
        const foldGeo = new THREE.BoxGeometry(0.22, 0.12, 0.24);
        const earL = new THREE.Mesh(foldGeo, coatMat);
        earL.position.set(0.52, 1.56, 0.34);
        const earR = new THREE.Mesh(foldGeo, coatMat);
        earR.position.set(0.52, 1.56, -0.34);
        group.add(earL, earR);
      }

      // Розовый язычок Наташи и капельки воды на носу (по фото 2)
      if (catType === 'natasha') {
        const tongue = new THREE.Mesh(
          new THREE.BoxGeometry(0.26, 0.08, 0.34),
          new THREE.MeshStandardMaterial({ color: 0xff4d88, emissive: 0xbe185d, emissiveIntensity: 0.35 })
        );
        tongue.position.set(1.06, 0.98, 0.12);
        tongue.rotation.z = -0.25;
        group.add(tongue);
      }

      const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.17, 1.15, 10), stripeMat);
      tail.position.set(-0.88, 0.78, 0);
      tail.rotation.z = 0.85;
      group.add(tail);

      return group;
    }

    function createMarchingBattleActors() {
      const grp = new THREE.Group();
      for (let i = 0; i < 3; i++) {
        const kn = createSingle3DKnight('#ffcf54');
        kn.position.set((i - 1) * 0.75, 0, 0);
        grp.add(kn);
      }
      grp.visible = false;
      scene.add(grp);
      marchingSquad.group = grp;

      const fb = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: 0xff2200, emissiveIntensity: 0.9 })
      );
      fb.visible = false;
      scene.add(fb);
      marchingSquad.fireball = fb;
    }

    function animateMedieval3D(time) {
      const t = time * 0.001;

      camera.position.lerp(cameraPosGoal, 0.05);
      camera.lookAt(cameraTarget);

      // Позиционирование 3D-фигурок Сони, Наташи и Степана на карте
      if (cat3DModels.sonya) {
        let sonyaProv = PROVINCES_DATA[1];
        if (hostState.sonyaProtectedLordId) {
          const ownedProv = hostState.provinces.find(pr => pr.ownerId === hostState.sonyaProtectedLordId);
          if (ownedProv) sonyaProv = PROVINCES_DATA[ownedProv.id];
        }
        cat3DModels.sonya.position.set(sonyaProv.x - 1.8, 0.8 + Math.sin(t * 2.5) * 0.08, sonyaProv.z + 1.5);
      }

      if (cat3DModels.natasha) {
        const natProv = PROVINCES_DATA[2];
        cat3DModels.natasha.position.set(natProv.x + 1.8, 0.8 + Math.sin(t * 3.2) * 0.1, natProv.z + 1.5);
      }

      if (cat3DModels.stepan) {
        const stProv = PROVINCES_DATA[hostState.stepanBlockedProvinceId ?? 3];
        cat3DModels.stepan.position.set(stProv.x, 0.85 + Math.sin(t * 2.0) * 0.06, stProv.z + 2.2);
      }

      // Анимация марширующего войска и огненного снаряда катапульты во время штурма!
      if (marchingSquad.active) {
        marchingSquad.progress = Math.min(1, marchingSquad.progress + 0.016);
        const p = marchingSquad.progress;
        marchingSquad.group.position.lerpVectors(marchingSquad.fromPos, marchingSquad.toPos, p);
        marchingSquad.group.position.y = 0.7 + Math.abs(Math.sin(t * 18)) * 0.35;
        marchingSquad.group.lookAt(marchingSquad.toPos.x, 0.7, marchingSquad.toPos.z);

        // Парабола полёта огненного ядра катапульты
        marchingSquad.fireball.position.lerpVectors(marchingSquad.fromPos, marchingSquad.toPos, p);
        marchingSquad.fireball.position.y = 1.5 + Math.sin(p * Math.PI) * 6.5;
      }

      renderer.render(scene, camera);
      update2DBannersOverlay();
      requestAnimationFrame(animateMedieval3D);
    }

    function update2DBannersOverlay() {
      if (mode !== 'HOST') {
        bannersLayer.innerHTML = '';
        return;
      }

      let html = '';
      const halfW = window.innerWidth / 2;
      const halfH = window.innerHeight / 2;

      PROVINCES_DATA.forEach(pData => {
        const provState = hostState.provinces[pData.id];
        const owner = hostState.players.find(pl => pl.id === provState.ownerId);
        const pos = new THREE.Vector3(pData.x, 4.3, pData.z);
        pos.project(camera);
        if (pos.z > 1) return;

        const sx = (pos.x * halfW) + halfW;
        const sy = -(pos.y * halfH) + halfH;
        const isTargeted = hostState.targetedProvinceId === pData.id;
        const stepanHere = hostState.stepanBlockedProvinceId === pData.id;

        html += `
          <div class="castle-banner ${isTargeted ? 'targeted' : ''}"
            style="left:${sx}px; top:${sy}px; border-color:${owner ? owner.color : '#ffcf54'};">
            <div style="color:${owner ? owner.color : '#ffcf54'}; font-size:0.8rem;">
              🏰 ${pData.name}
            </div>
            <div>
              ${owner ? 'Лорд: ' + owner.name : 'Свободная земля'} • ⚔️ ${provState.knights} • +${pData.income}🪙
            </div>
            ${stepanHere ? '<div style="color:#fb923c;">🔥 У ворот лежит Степан!</div>' : ''}
          </div>
        `;
      });

      bannersLayer.innerHTML = html;
    }

    function zoomCameraToProvince(provId, duration = 2600) {
      const p = PROVINCES_DATA[provId];
      if (!p) return;
      cameraTarget.set(p.x, 0.8, p.z);
      cameraPosGoal.set(p.x, 13.5, p.z + 12.5);

      if (duration > 0) {
        setTimeout(() => {
          cameraTarget.set(0, 0, 0);
          cameraPosGoal.set(0, 25, 24);
        }, duration);
      }
    }

    /***************************************************************************
     * 6. СЕРВЕРНАЯ ЛОГИКА НА ЭКРАНЕ ТВ И 3D-БИТВЫ РЫЦАРЕЙ
     ***************************************************************************/
    function addLog(text) {
      hostState.logs.unshift(text);
      if (hostState.logs.length > 30) hostState.logs.pop();
    }

    function createLordPlayer(id, name, isBot = false, conn = null) {
      const idx = hostState.players.length;
      const color = HERALDIC_COLORS[idx % HERALDIC_COLORS.length];

      // Выдаём каждому новому лорду собственную стартовую крепость на карте
      const freeProv = hostState.provinces.find(pr => pr.id !== 0 && pr.ownerId === null);
      if (freeProv) {
        freeProv.ownerId = id;
        freeProv.knights = 3;
      }

      refreshProvince3DKnights();
      return {
        id,
        name: name.slice(0, 12),
        color,
        gold: 5,
        crowns: 0,
        isBot,
        conn
      };
    }

    function initHostMode() {
      mode = 'HOST';
      hostState.pin = String(Math.floor(1000 + Math.random() * 9000));
      const peerId = ROOM_PREFIX + hostState.pin;

      addLog(`Королевский Стол открыт! PIN для геймпадов: ${hostState.pin}`);
      renderHostHUD();

      peer = new Peer(peerId);
      peer.on('open', () => renderHostHUD());
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') initHostMode();
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => handleHostPacket(conn, data));
      });
    }

    function handleHostPacket(conn, data) {
      if (data.type === 'JOIN') {
        let p = hostState.players.find(x => x.id === conn.peer);
        if (!p && hostState.players.length < 6) {
          p = createLordPlayer(conn.peer, data.name, false, conn);
          hostState.players.push(p);
          SFX.horn();
          addLog(`⚔️ Лорд «${p.name}» поднял своё знамя над замком!`);
        }
        broadcastStateToGamepads();
        renderHostHUD();
      }

      const active = hostState.players[hostState.activeIndex];
      if (!active || active.id !== conn.peer) return;

      if (data.type === 'AIM_PROVINCE') {
        hostState.targetedProvinceId = Number(data.provId);
        zoomCameraToProvince(hostState.targetedProvinceId, 1800);
        renderHostHUD();
      }

      if (data.type === 'GAMEPAD_COMMAND' && hostState.phase === 'TURN_GAMEPAD') {
        executeMedievalAction(data.cmd, Number(data.provId));
      }
    }

    function addBotLord() {
      if (hostState.players.length >= 6) return;
      const names = ['Король Артур', 'Барон Роланд', 'Герцог Ричард', 'Леди Жанна', 'Лорд Годфри'];
      const used = hostState.players.map(p => p.name);
      const name = names.find(n => !used.includes(n)) || `Лорд-${hostState.players.length + 1}`;
      hostState.players.push(createLordPlayer('bot-' + Math.random().toString(36).slice(2, 7), name, true, null));
      addLog(`🤖 К столу присоединился ИИ-полководец «${name}».`);
      renderHostHUD();
    }

    // ВТОРОЙ КЛИК НА ТВ — ЗАПУСК КАМПАНИИ
    function startRoyalCampaign() {
      SFX.init();
      while (hostState.players.length < 2) {
        addBotLord();
      }
      hostState.round = 1;
      hostState.activeIndex = 0;
      startLordTurn();
    }

    function startLordTurn() {
      const active = hostState.players[hostState.activeIndex];
      hostState.phase = 'TURN_GAMEPAD';

      // Начисление налогов со всех замков активного лорда в начале его хода
      let taxIncome = 1;
      hostState.provinces.forEach(pr => {
        if (pr.ownerId === active.id) {
          taxIncome += PROVINCES_DATA[pr.id].income;
        }
      });
      active.gold += taxIncome;
      SFX.coin();

      hostState.headline = `ХОД ЛОРДА: ${active.name.toUpperCase()} — НАЛОГ С ЗЕМЕЛЬ ПРИНЁС +${taxIncome} 🪙`;
      hostState.subline = `Казна: ${active.gold} 🪙 | Короны: ${active.crowns} из 3 👑 | Отдайте приказ на геймпаде смартфона`;

      broadcastStateToGamepads();
      renderHostHUD();

      if (active.isBot) {
        setTimeout(() => runBotGamepadTurn(active), 1600);
      }
    }

    function runBotGamepadTurn(bot) {
      if (bot.gold >= 6) {
        executeMedievalAction('FORGE_CROWN', 0);
        return;
      }
      const targetProv = hostState.provinces.find(pr => pr.ownerId !== bot.id);
      if (targetProv && Math.random() > 0.35) {
        executeMedievalAction('MARCH_ATTACK', targetProv.id);
      } else {
        const myProv = hostState.provinces.find(pr => pr.ownerId === bot.id) || hostState.provinces[0];
        executeMedievalAction('RECRUIT_KNIGHTS', myProv.id);
      }
    }

    // ВЫПОЛНЕНИЕ ТАКТИЧЕСКИХ ПРИКАЗОВ С 3D-АНИМАЦИЕЙ НА ВОЕННОМ СТОЛЕ
    function executeMedievalAction(cmd, targetProvId) {
      const activeLord = hostState.players[hostState.activeIndex];
      const myHomeProv = hostState.provinces.find(pr => pr.ownerId === activeLord.id) || hostState.provinces[0];
      const targetProv = hostState.provinces[targetProvId] || hostState.provinces[0];
      const targetData = PROVINCES_DATA[targetProv.id];

      hostState.phase = 'ANIMATING';
      hostState.targetedProvinceId = targetProv.id;

      // 1. МАРШ РЫЦАРЕЙ И ШТУРМ ЗАМКА С КАТАПУЛЬТОЙ
      if (cmd === 'MARCH_ATTACK') {
        // Если атакующий лорд был под защитой тихой Сони — она пугается лязга мечей и уходит в шатёр!
        if (hostState.sonyaProtectedLordId === activeLord.id) {
          hostState.sonyaProtectedLordId = null;
          addLog(`🐾 Тихая Соня испугалась резкого боевого клича ${activeLord.name} и вернулась под свой тёмный шатёр!`);
        }

        const fromData = PROVINCES_DATA[myHomeProv.id];
        marchingSquad.active = true;
        marchingSquad.progress = 0;
        marchingSquad.fromPos.set(fromData.x, 0.7, fromData.z);
        marchingSquad.toPos.set(targetData.x, 0.7, targetData.z);
        marchingSquad.group.visible = true;
        marchingSquad.fireball.visible = true;

        zoomCameraToProvince(targetProv.id, 3000);
        SFX.horn();

        hostState.headline = `⚔️ ПОЛКИ ЛОРДА ${activeLord.name.toUpperCase()} ИДУТ НА ШТУРМ ЗЕМЛИ «${targetData.name.toUpperCase()}»!`;
        hostState.subline = `Рыцари маршируют по мосту под прикрытием огненной катапульты...`;
        broadcastStateToGamepads();
        renderHostHUD();

        setTimeout(() => {
          marchingSquad.active = false;
          marchingSquad.group.visible = false;
          marchingSquad.fireball.visible = false;

          const defender = hostState.players.find(pl => pl.id === targetProv.ownerId);

          // Проверка: защищает ли этот замок тихая Соня своим редким «Мяу»!
          if (defender && hostState.sonyaProtectedLordId === defender.id && hostState.sonyaMeowsLeft > 0) {
            hostState.sonyaMeowsLeft -= 1;
            SFX.sonyaMeow();
            hostState.headline = `🐱 ТИХАЯ СОНЯ ИЗДАЛА СВОЁ РЕДКОЕ «МЯУ» И ОСТАНОВИЛА ШТУРМ ${activeLord.name.toUpperCase()}!`;
            hostState.subline = `Рыцари в изумлении отступили! Осталось мяуканий Сони за партию: ${hostState.sonyaMeowsLeft}`;
            addLog(`🐱 Чудо! Тихая Соня мяукнула со стены замка и спасла владения ${defender.name} от штурма!`);
            renderHostHUD();
            setTimeout(() => advanceTurn(), 2200);
            return;
          }

          // Проверка: лежит ли авантюрист Степан поперёк ворот этой провинции!
          if (hostState.stepanBlockedProvinceId === targetProv.id && targetProv.ownerId !== activeLord.id) {
            if (activeLord.gold >= 2) {
              activeLord.gold -= 2;
              addLog(`🔥 Чтобы пройти через ворота «${targetData.name}», лорд ${activeLord.name} сначала погладил Степана и дал ему 2 🪙!`);
            }
          }

          SFX.swords();
          targetProv.ownerId = activeLord.id;
          targetProv.knights = Math.max(2, myHomeProv.knights);
          activeLord.gold += 2;

          if (targetProv.id === 0) {
            activeLord.crowns += 1;
            SFX.fanfare();
            hostState.headline = `👑 ${activeLord.name.toUpperCase()} ЗАХВАТИЛ ТРОННУЮ ЦИТАДЕЛЬ И ПОЛУЧИЛ КОРОНУ!`;
            addLog(`👑 ${activeLord.name} взял штурмом Тронную Цитадель и завоевал Королевскую Корону!`);
          } else {
            hostState.headline = `🏰 ЗЕМЛЯ «${targetData.name.toUpperCase()}» ПЕРЕШЛА ПОД ЗНАМЯ ЛОРДА ${activeLord.name.toUpperCase()}!`;
            addLog(`⚔️ Рыцари ${activeLord.name} взяли штурмом «${targetData.name}» и добыли 2 🪙 трофеев!`);
          }

          refreshProvince3DKnights();
          renderHostHUD();
          setTimeout(() => advanceTurn(), 2000);
        }, 1600);
        return;
      }

      // 2. НАБОР РЫЦАРЕЙ И УКРЕПЛЕНИЕ ЗАМКА
      if (cmd === 'RECRUIT_KNIGHTS') {
        zoomCameraToProvince(myHomeProv.id, 2400);
        SFX.horn();
        myHomeProv.knights = Math.min(8, myHomeProv.knights + 2);
        activeLord.gold += 2;
        refreshProvince3DKnights();

        hostState.headline = `🛡️ ЛОРД ${activeLord.name.toUpperCase()} УКРЕПЛЯЕТ ЗАМОК И ПРИЗЫВАЕТ +2 РЫЦАРЕЙ!`;
        hostState.subline = `Гарнизон крепости вырос до ${myHomeProv.knights} полков, а казна пополнилась на +2 🪙`;
        addLog(`🛡️ ${activeLord.name} укрепил гарнизон в земле «${PROVINCES_DATA[myHomeProv.id].name}» и собрал +2 🪙.`);

        broadcastStateToGamepads();
        renderHostHUD();
        setTimeout(() => advanceTurn(), 2300);
        return;
      }

      // 3. ПРИЗОВ ТРЁХ КОШЕК-ХРАНИТЕЛЬНИЦ: СОНИ, НАТАШИ ИЛИ СТЕПАНА
      if (cmd === 'CALL_CAT_GUARDIAN') {
        // Выбор кошки зависит от выбранной провинции или цикла:
        // Если выбрана провинция 1 -> Соня; провинция 2 -> Наташа; иначе -> Степан у ворот выбранной провинции!
        if (targetProv.id === 1) {
          hostState.sonyaProtectedLordId = activeLord.id;
          activeLord.gold += 3;
          zoomCameraToProvince(1, 2500);
          SFX.coin();
          hostState.headline = `🐾 ЛОРД ${activeLord.name.toUpperCase()} ПОГЛАДИЛ ТИХУЮ СОНЮ ПОД ТЁМНЫМ ШАТРОМ!`;
          hostState.subline = `Соня перешла охранять замок ${activeLord.name} от штурмов и подарила +3 🪙`;
          addLog(`🐾 Тихая полосатая Соня выбрала своим хозяином лорда ${activeLord.name} и охраняет его стены!`);
        } else if (targetProv.id === 2) {
          SFX.waterWave();
          zoomCameraToProvince(2, 2500);
          activeLord.gold += 4;
          hostState.headline = `👅 НАТАША С ВЫСУНУТЫМ ЯЗЫЧКОМ ОТКРЫЛА ВОДНЫЙ ШЛЮЗ МЕЛЬНИЦЫ!`;
          hostState.subline = `Бурный поток воды принёс лорду ${activeLord.name} сокровища на +4 🪙`;
          addLog(`👅 Наташа поиграла с потоком воды у мельницы и принесла лорду ${activeLord.name} +4 🪙!`);
        } else {
          hostState.stepanBlockedProvinceId = targetProv.id;
          activeLord.gold += 3;
          zoomCameraToProvince(targetProv.id, 2500);
          SFX.coin();
          hostState.headline = `🔥 АРХИ-КОТ СТЕПАН РАЗВАЛИЛСЯ У ВОРОТ ЗЕМЛИ «${targetData.name.toUpperCase()}»!`;
          hostState.subline = `Лорд ${activeLord.name} подержал Степана на руках, получил +3 🪙 и перекрыл дорогу соперникам`;
          addLog(`🔥 Серебристый вислоухий Степан в кайф улёгся прямо перед воротами «${targetData.name}»!`);
        }

        broadcastStateToGamepads();
        renderHostHUD();
        setTimeout(() => advanceTurn(), 2500);
        return;
      }

      // 4. ОТЛИТЬ КОРОЛЕВСКУЮ КОРОНУ ПОБЕДЫ ЗА 6 ЗОЛОТЫХ
      if (cmd === 'FORGE_CROWN') {
        if (activeLord.gold >= 6) {
          activeLord.gold -= 6;
          activeLord.crowns += 1;
          zoomCameraToProvince(0, 2600);
          SFX.fanfare();
          hostState.headline = `👑 ЛОРД ${activeLord.name.toUpperCase()} ВЫКОВАЛ КОРОЛЕВСКУЮ КОРОНУ ${activeLord.crowns} ИЗ 3!`;
          hostState.subline = `Торжественный звон колоколов разносится над Королевским Столом!`;
          addLog(`👑 Лорд ${activeLord.name} заплатил 6 🪙 золотых дел мастерам и получил Корону ${activeLord.crowns} из 3!`);
        }
        broadcastStateToGamepads();
        renderHostHUD();
        setTimeout(() => advanceTurn(), 2500);
      }
    }

    function advanceTurn() {
      const active = hostState.players[hostState.activeIndex];
      if (active.crowns >= 3) {
        hostState.winnerName = active.name;
        hostState.phase = 'GAME_OVER';
        SFX.fanfare();
        hostState.headline = `👑 ВЕЛИКИЙ КОРОЛЬ: ЛОРД ${active.name.toUpperCase()} ПОБЕЖДАЕТ В КАМПАНИИ!`;
        hostState.subline = `Собраны все 3 Королевские Короны Войны Трёх Знамён!`;
        broadcastStateToGamepads();
        renderHostHUD();
        return;
      }

      hostState.activeIndex = (hostState.activeIndex + 1) % hostState.players.length;
      if (hostState.activeIndex === 0) {
        hostState.round += 1;
        // Каждые 2 раунда как по часам: Наташа требует пир у клетчатой чаши!
        if (hostState.round % 2 === 0) {
          const richest = [...hostState.players].sort((a, b) => b.gold - a.gold)[0];
          if (richest && richest.gold > 0) {
            richest.gold -= 1;
            addLog(`⏰ Колокол трапезы! Наташа с высунутым язычком покусала за сапог лорда ${richest.name} и скушала угощение за 1 🪙!`);
          }
        }
      }
      startLordTurn();
    }

    function broadcastStateToGamepads() {
      const activePlayer = hostState.players[hostState.activeIndex];
      hostState.players.forEach((p, idx) => {
        if (p.conn && p.conn.open) {
          p.conn.send({
            type: 'SYNC',
            themeHue: themeState.hue,
            themeSat: themeState.sat,
            phase: hostState.phase,
            round: hostState.round,
            isMyTurn: idx === hostState.activeIndex,
            activePlayerName: activePlayer ? activePlayer.name : '',
            targetedProvinceId: hostState.targetedProvinceId,
            provinces: hostState.provinces,
            headline: hostState.headline,
            winnerName: hostState.winnerName,
            me: {
              id: p.id,
              name: p.name,
              color: p.color,
              gold: p.gold,
              crowns: p.crowns
            }
          });
        }
      });
    }

    /***************************************************************************
     * 8. СМАРТФОН КАК СРЕДНЕВЕКОВЫЙ ГЕЙМПАД ЛОРДА
     ***************************************************************************/
    const clientState = {
      pin: '',
      name: '',
      connected: false,
      phase: 'LOBBY',
      round: 1,
      isMyTurn: false,
      activePlayerName: '',
      selectedProvinceId: 0,
      provinces: [],
      headline: '',
      winnerName: '',
      me: null,
      conn: null
    };

    function initClientMode(pin, name) {
      mode = 'CLIENT';
      clientState.pin = pin;
      clientState.name = name;
      renderClientGamepad('Подключение геймпада к Королевскому Столу...');

      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(ROOM_PREFIX + pin, { reliable: true });
        clientState.conn = conn;

        conn.on('open', () => {
          clientState.connected = true;
          conn.send({ type: 'JOIN', name: clientState.name });
          renderClientGamepad();
        });

        conn.on('data', (data) => {
          if (data.type === 'SYNC') {
            if (typeof data.themeHue === 'number') {
              setGlobalTheme(data.themeHue, data.themeSat || 80);
            }
            Object.assign(clientState, data);
            renderClientGamepad();
          }
        });

        conn.on('close', () => {
          clientState.connected = false;
          renderClientGamepad('Связь с экраном ТВ прервана.');
        });
      });

      peer.on('error', () => {
        renderClientGamepad('Не найдена комната с PIN ' + pin);
      });
    }

    function renderClientGamepad(statusMsg = '') {
      if (mode !== 'CLIENT') return;

      if (!clientState.connected || !clientState.me) {
        appEl.innerHTML = `
          <div class="medieval-panel center-modal">
            <div class="title-medieval" style="font-size:1.45rem;">ГЕЙМПАД ЛОРДА</div>
            <p>${statusMsg || 'Синхронизация с Королевским Столом...'}</p>
            <button class="btn" onclick="location.reload()">Назад</button>
          </div>
        `;
        return;
      }

      const me = clientState.me;
      let padBody = '';

      if (clientState.phase === 'LOBBY') {
        padBody = `
          <div style="text-align:center; padding:22px 10px;">
            <div style="font-size:1.2rem; font-weight:900; color:var(--gold);">Ваш 3D-замок уже на столе!</div>
            <p style="margin-top:8px; font-size:0.9rem;">
              Посмотрите на экран ТВ и нажмите там кнопку «Начать Королевскую Кампанию»!
            </p>
          </div>
        `;
      } else if (clientState.phase === 'TURN_GAMEPAD' && clientState.isMyTurn) {
        const selId = clientState.selectedProvinceId;
        const selData = PROVINCES_DATA[selId];

        const dpadButtons = PROVINCES_DATA.map(p => `
          <button class="dpad-btn ${selId === p.id ? 'selected' : ''}" data-aim="${p.id}">
            <div style="color:var(--gold);">🏰 ${p.name}</div>
            <div style="font-size:0.7rem; opacity:0.85;">Доход: +${p.income} 🪙</div>
          </button>
        `).join('');

        padBody = `
          <div style="font-weight:900; color:var(--gold); font-size:0.86rem; margin-bottom:6px;">
            1. ПРИЦЕЛ КАМЕРЫ НА 3D-КАРТЕ: «${selData.name.toUpperCase()}»
          </div>
          <div class="province-dpad">
            ${dpadButtons}
          </div>

          <div style="font-weight:900; color:var(--gold); font-size:0.86rem; margin:10px 0 6px;">
            2. ТАКТИЧЕСКИЕ КНОПКИ ГЕЙМПАДА:
          </div>
          <div class="gamepad-action-grid">
            <button class="gp-action-btn" data-cmd="MARCH_ATTACK" style="border-color:#ef4444;">
              <div style="font-weight:900; color:#f87171; font-size:0.95rem;">⚔️ КНОПКА А — Штурм</div>
              <div style="font-size:0.74rem; opacity:0.9;">Отправить 3D-полки рыцарей и катапульты на захват «${selData.name}»!</div>
            </button>

            <button class="gp-action-btn" data-cmd="RECRUIT_KNIGHTS" style="border-color:#38bdf8;">
              <div style="font-weight:900; color:#7dd3fc; font-size:0.95rem;">🛡️ КНОПКА B — Гарнизон</div>
              <div style="font-size:0.74rem; opacity:0.9;">Укрепить свой замок, нанять +2 рыцарей и собрать +2 🪙.</div>
            </button>

            <button class="gp-action-btn" data-cmd="CALL_CAT_GUARDIAN" style="border-color:#f472b6;">
              <div style="font-weight:900; color:#f472b6; font-size:0.95rem;">🐱 КНОПКА X — Кошки</div>
              <div style="font-size:0.74rem; opacity:0.9;">Призвать Соню, Наташу или положить Степана у ворот выбранной земли!</div>
            </button>

            <button class="gp-action-btn" data-cmd="FORGE_CROWN" ${me.gold < 6 ? 'disabled' : ''} style="border-color:var(--gold);">
              <div style="font-weight:900; color:var(--gold); font-size:0.95rem;">👑 КНОПКА Y — Корона</div>
              <div style="font-size:0.74rem; opacity:0.9;">Выковать Королевскую Корону за 6 🪙 для победы в партии!</div>
            </button>
          </div>
        `;
      } else if (clientState.phase === 'GAME_OVER') {
        padBody = `
          <div style="text-align:center; padding:24px;">
            <div class="title-medieval" style="font-size:1.5rem;">👑 ПОБЕДИТЕЛЬ: ${clientState.winnerName}</div>
          </div>
        `;
      } else {
        padBody = `
          <div style="text-align:center; padding:24px 10px;">
            <div style="font-size:1.15rem; font-weight:900; color:var(--gold);">
              👀 СМОТРИТЕ НА КОРОЛЕВСКИЙ СТОЛ НА ТВ!
            </div>
            <p style="margin-top:8px; font-size:0.9rem;">
              ${clientState.headline}
            </p>
          </div>
        `;
      }

      appEl.innerHTML = `
        <div class="gamepad-wrap">
          <div class="medieval-panel" style="padding:12px 14px; display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="width:14px; height:14px; border-radius:50%; background:${me.color}; display:inline-block; border:2px solid #fff;"></span>
              <div>
                <div style="font-weight:900; font-size:1.02rem;">${me.name}</div>
                <div style="font-size:0.75rem; color:var(--gold);">Короны: ${me.crowns}/3 👑</div>
              </div>
            </div>
            <div style="font-weight:900; font-size:1.15rem; color:var(--gold);">🪙 ${me.gold}</div>
          </div>

          <div class="medieval-panel" style="padding:14px; flex:1; overflow-y:auto;">
            ${padBody}
          </div>
        </div>
      `;

      document.querySelectorAll('[data-aim]').forEach(btn => {
        btn.onclick = () => {
          const pId = Number(btn.getAttribute('data-aim'));
          clientState.selectedProvinceId = pId;
          clientState.conn.send({ type: 'AIM_PROVINCE', provId: pId });
          renderClientGamepad();
        };
      });

      document.querySelectorAll('[data-cmd]').forEach(btn => {
        btn.onclick = () => {
          clientState.conn.send({
            type: 'GAMEPAD_COMMAND',
            cmd: btn.getAttribute('data-cmd'),
            provId: clientState.selectedProvinceId
          });
        };
      });
    }

    // Запуск 3D-мира и стартового меню
    initMedieval3DWorld();
    renderMenu();
  </script>
</body>
</html>
