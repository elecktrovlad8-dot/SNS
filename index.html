<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ауренталь - Эпический Интерфейс</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- Tailwind для быстрой сетки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;700&display=swap');
        
        :root {
            /* Цвета из ваших референсов (Teal из 3 картинки, Маджента и Золото из 1 и 2) */
            --glow-teal: rgba(45, 212, 191, 0.6);
            --glow-magenta: rgba(217, 70, 239, 0.5);
            --gold: #eab308;
            --panel-bg: rgba(12, 15, 20, 0.75); /* Полупрозрачный темный фон для панелей */
            --border-glow: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden; /* Игра должна быть как полноэкранное приложение */
            font-family: 'Montserrat', sans-serif;
            color: #e2e8f0;
            /* СЮДА ВЫ ПОТОМ ВСТАВИТЕ ВАШУ ГЛАВНУЮ ФОНОВУЮ КАРТИНКУ */
            background-color: #050505; 
            background-image: 
                radial-gradient(circle at 15% 50%, var(--glow-teal), transparent 40%),
                radial-gradient(circle at 85% 30%, var(--glow-magenta), transparent 40%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .cinzel { font-family: 'Cinzel', serif; }
        
        /* ЭФФЕКТ СТЕКЛА ДЛЯ ПАНЕЛЕЙ (Glassmorphism из 3 картинки) */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        /* ИМИТАЦИЯ ГОТИЧЕСКИХ РАМОК (из 1 и 2 картинки) */
        .gothic-frame {
            position: relative;
        }
        .gothic-frame::before, .gothic-frame::after {
            content: ''; position: absolute; left: 0; right: 0; height: 30px;
            /* Сюда вы вставите URL картинки с резным камнем/металлом */
            background: url('data:image/svg+xml;utf8,<svg width="100" height="30" xmlns="http://www.w3.org/2000/svg"><path d="M0,15 Q25,0 50,15 T100,15" stroke="rgba(255,255,255,0.2)" fill="none"/></svg>') repeat-x;
            background-size: contain; pointer-events: none; z-index: 10;
        }
        .gothic-frame::before { top: -15px; }
        .gothic-frame::after { bottom: -15px; transform: rotate(180deg); }

        /* КНОПКИ */
        .btn-epic {
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(0,0,0,0.5));
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .btn-epic::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(234,179,8,0.2) 0%, transparent 50%);
            opacity: 0; transition: opacity 0.3s;
        }
        .btn-epic:hover::after { opacity: 1; }
        .btn-epic:hover { border-color: var(--gold); text-shadow: 0 0 10px var(--gold); transform: translateY(-2px); }

        /* ТЕКСТОВЫЕ ЭФФЕКТЫ */
        .gold-glow {
            background: linear-gradient(to right, #fef08a, #eab308, #a16207);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(234,179,8,0.4));
        }

        .neon-text {
            color: #fff;
            text-shadow: 0 0 10px rgba(45, 212, 191, 0.8), 0 0 20px rgba(45, 212, 191, 0.5);
        }

        /* АНИМАЦИИ */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .floating { animation: float 6s ease-in-out infinite; }

        .hidden { display: none !important; }
        
        /* Скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- ГЛОБАЛЬНЫЙ СВЕТОВОЙ ЭФФЕКТ (Магические частицы на фоне) -->
    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-teal-500 rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-fuchsia-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div>
    </div>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ (Лобби) -->
    <div id="screen-login" class="relative z-10 flex-1 flex flex-col items-center justify-center p-6 h-full">
        <!-- Логотип как на картинке 2 -->
        <div class="text-center mb-16 floating">
            <h1 class="text-7xl md:text-9xl cinzel gold-glow mb-2 font-black tracking-widest">АУРЕНТАЛЬ</h1>
            <div class="flex items-center justify-center gap-4">
                <div class="h-[1px] w-16 bg-gradient-to-r from-transparent to-yellow-500"></div>
                <p class="text-yellow-500 text-sm md:text-xl tracking-[0.4em] uppercase cinzel">Золотой Предел</p>
                <div class="h-[1px] w-16 bg-gradient-to-l from-transparent to-yellow-500"></div>
            </div>
        </div>
        
        <div class="glass-panel gothic-frame w-full max-w-lg p-10 flex flex-col gap-8">
            <button onclick="engine.initHost()" class="btn-epic py-5 text-xl w-full">Создать Игровой Мир (Экран)</button>
            
            <div class="relative flex items-center justify-center">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white border-opacity-10"></div></div>
                <span class="relative bg-[#0c0f14] px-4 text-xs text-gray-500 tracking-widest">ПОДКЛЮЧИТЬСЯ К ИГРЕ</span>
            </div>
            
            <div class="flex gap-4">
                <input type="text" id="join-pin" placeholder="PIN" class="flex-1 bg-black bg-opacity-50 border border-gray-700 text-white p-4 rounded text-center text-3xl cinzel uppercase focus:border-teal-500 focus:outline-none transition" maxlength="4">
                <button onclick="engine.initClient()" class="btn-epic w-1/3 text-lg">Вход</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ГЛАВНЫЙ ЭКРАН (ТВ / ХОСТ) - Стилизация под карту из 3 картинки -->
    <div id="screen-host" class="hidden relative z-10 flex-1 flex flex-col p-8 h-full">
        
        <!-- Верхняя панель (Header) -->
        <div class="flex justify-between items-start mb-8">
            <div class="glass-panel px-8 py-4 rounded-full flex items-center gap-4 border-t-0 border-l-0 border-r-0 border-b-2 border-teal-500">
                <h1 class="text-3xl cinzel neon-text">Ауренталь</h1>
                <div class="h-6 w-[1px] bg-gray-600"></div>
                <p id="host-phase-display" class="text-sm text-gray-400 uppercase tracking-widest">Ожидание Магистров...</p>
            </div>
            <div class="glass-panel px-8 py-4 flex flex-col items-center gothic-frame">
                <div class="text-xs text-gray-500 tracking-widest mb-1">КОД ПРИЗЫВА</div>
                <div id="host-pin-display" class="text-5xl cinzel font-bold gold-glow tracking-widest"></div>
            </div>
        </div>
        
        <!-- Центральная часть (Здесь будет ваша красивая карта и Астролябия) -->
        <div class="flex-1 flex relative">
            <!-- Левая панель с игроками -->
            <div class="w-1/4 h-full flex flex-col gap-4" id="host-players">
                <!-- Карточки игроков генерируются здесь -->
            </div>
            
            <!-- Центр (Астролябия) -->
            <div class="flex-1 flex items-center justify-center">
                <!-- Заглушка под вашу будущую 3D астролябию -->
                <div class="relative w-96 h-96 rounded-full border-4 border-dashed border-gray-600 animate-[spin_60s_linear_infinite] flex items-center justify-center opacity-30">
                    <div class="absolute w-64 h-64 rounded-full border-2 border-teal-500 animate-[spin_40s_linear_infinite_reverse]"></div>
                    <span class="cinzel text-gray-500 text-center animate-[spin_60s_linear_infinite_reverse]">Место для<br>3D Астролябии</span>
                </div>
            </div>
            
            <!-- Правая панель (События/Лог как на 1 картинке) -->
            <div class="w-1/4 h-full glass-panel p-4 flex flex-col">
                <h3 class="cinzel text-teal-400 mb-4 border-b border-gray-700 pb-2">Летопись Мира</h3>
                <div id="host-log" class="flex-1 overflow-y-auto flex flex-col gap-2 text-sm text-gray-300 font-light">
                    <div class="text-gray-500 italic">Мир ожидает пробуждения...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: ИНТЕРФЕЙС ИГРОКА (СМАРТФОН) -->
    <!-- Дизайн плавающих панелей из 3 картинки -->
    <div id="screen-client" class="hidden relative z-10 flex-1 flex flex-col p-4 h-full overflow-hidden">
        
        <!-- Шапка: Статус игрока -->
        <div class="glass-panel p-4 mb-4 flex justify-between items-center gothic-frame">
            <div>
                <div id="client-char-name" class="text-2xl cinzel gold-glow font-bold"></div>
                <div id="client-role" class="text-xs text-teal-400 tracking-widest uppercase mt-1"></div>
            </div>
            <div class="text-right flex flex-col items-end">
                <span class="text-xs text-gray-500 uppercase">Казна</span>
                <div class="text-4xl cinzel text-white flex items-center gap-2">
                    <span id="client-gold">0</span>
                    <span class="text-yellow-500 text-2xl">🪙</span>
                </div>
            </div>
        </div>

        <!-- Управление Астролябией -->
        <div id="client-planning" class="glass-panel p-5 flex-1 flex flex-col relative overflow-hidden">
            <!-- Декоративное свечение внутри панели -->
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-teal-500 opacity-10 rounded-full blur-2xl"></div>
            
            <h3 class="text-center cinzel text-lg text-gray-300 mb-6 uppercase tracking-[0.2em] border-b border-white border-opacity-10 pb-2">Настройка Механизма</h3>
            
            <div class="flex flex-col gap-4 flex-1">
                <!-- Кастомный селект -->
                <div class="bg-black bg-opacity-40 border border-gray-700 rounded-xl p-4 flex justify-between items-center transition hover:border-teal-500">
                    <div>
                        <div class="text-sm font-bold text-white uppercase tracking-wider">Эмиссия</div>
                        <div class="text-xs text-gray-500">Сумма золота</div>
                    </div>
                    <select id="card-outer" class="bg-transparent text-teal-300 text-2xl font-bold text-right outline-none cursor-pointer cinzel">
                        <option value="0">0</option><option value="1">+1</option><option value="-1">-1</option><option value="2">+2</option>
                    </select>
                </div>
                
                <div class="bg-black bg-opacity-40 border border-gray-700 rounded-xl p-4 flex justify-between items-center transition hover:border-yellow-500">
                    <div>
                        <div class="text-sm font-bold text-white uppercase tracking-wider">Сфера</div>
                        <div class="text-xs text-gray-500">Тип зданий</div>
                    </div>
                    <select id="card-middle" class="bg-transparent text-yellow-300 text-2xl font-bold text-right outline-none cursor-pointer cinzel">
                        <option value="0">0</option><option value="1">+1</option><option value="-1">-1</option>
                    </select>
                </div>
                
                <div class="bg-black bg-opacity-40 border border-gray-700 rounded-xl p-4 flex justify-between items-center transition hover:border-fuchsia-500">
                    <div>
                        <div class="text-sm font-bold text-white uppercase tracking-wider">Событие</div>
                        <div class="text-xs text-gray-500">Глобальный закон</div>
                    </div>
                    <select id="card-inner" class="bg-transparent text-fuchsia-300 text-2xl font-bold text-right outline-none cursor-pointer cinzel">
                        <option value="0">0</option><option value="1">+1</option><option value="-1">-1</option>
                    </select>
                </div>
            </div>
            <button id="btn-submit-cards" onclick="engine.submitCards()" class="btn-epic py-5 text-lg mt-4 shadow-[0_0_20px_rgba(45,212,191,0.2)] border-teal-600">Подтвердить Вращение</button>
        </div>
    </div>

<script>
// В этот блок помещается вся та же логика JS (PeerJS), которую я написал в предыдущем сообщении.
// Я оставил только визуальный HTML/CSS каркас, чтобы не дублировать 500 строк JS логики, 
// которая абсолютно не меняется от смены дизайна. 
// Вы просто берете объект `const engine = { ... }` из предыдущего ответа и вставляете сюда.

const engine = {
    // ... (Вся логика Хоста и Клиента из предыдущего ответа) ...
    initHost() {
        document.getElementById('screen-login').classList.add('hidden');
        document.getElementById('screen-host').classList.remove('hidden');
        document.getElementById('host-pin-display').innerText = "1234"; // Тестовый пин
        this.renderHostPlayersMockup(); // Для визуала
    },
    initClient() {
        document.getElementById('screen-login').classList.add('hidden');
        document.getElementById('screen-client').classList.remove('hidden');
        document.getElementById('client-char-name').innerText = "Степан";
        document.getElementById('client-role').innerText = "Авантюристы";
        document.getElementById('client-gold').innerText = "5";
    },
    submitCards() {
        document.getElementById('btn-submit-cards').innerText = "Ожидание...";
        document.getElementById('btn-submit-cards').disabled = true;
    },
    
    // Вспомогательная функция для генерации красивых карточек игроков на хосте
    renderHostPlayersMockup() {
        const container = document.getElementById('host-players');
        const players = [
            {name: "Соня", role: "Гильдия Теней", gold: 8, color: "fuchsia"},
            {name: "Наташа", role: "Речной Картель", gold: 12, color: "blue"},
            {name: "Степан", role: "Авантюристы", gold: 15, color: "yellow"}
        ];
        
        container.innerHTML = players.map(p => `
            <div class="glass-panel p-4 flex flex-col relative border-l-4 border-l-${p.color}-500">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="text-xl cinzel font-bold text-white">${p.name}</h3>
                        <span class="text-[10px] text-gray-400 uppercase tracking-widest">${p.role}</span>
                    </div>
                    <div class="text-3xl cinzel gold-glow">${p.gold}</div>
                </div>
                <div class="h-2 w-full bg-black bg-opacity-50 rounded-full overflow-hidden">
                    <div class="h-full bg-${p.color}-500 w-1/3"></div>
                </div>
            </div>
        `).join('');
    }
};
</script>
</body>
</html>
