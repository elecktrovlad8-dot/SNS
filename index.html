<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Изумрудный Архипелаг: Три Покровителя</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-deep: #071316;
      --bg-teal: #0d262b;
      --mint-glow: #64ffc8;
      --mint-soft: rgba(100, 255, 200, 0.2);
      --gold: #ffd166;
      --sonya-color: #a3e635;
      --natasha-color: #38bdf8;
      --stepan-color: #fb923c;
      --text-main: #ecfdf5;
      --text-muted: #86efac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-main);
    }

    /* Программный фон Canvas */
    #iso-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Готический Глассморфизм по спецификации */
    .glass-panel {
      background: rgba(15, 25, 30, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(100, 255, 200, 0.2);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: var(--text-main);
    }

    #app {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Кнопки и элементы управления */
    .btn {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(6, 95, 70, 0.6));
      border: 1px solid rgba(100, 255, 200, 0.45);
      color: var(--text-main);
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(6, 95, 70, 0.85));
      border-color: var(--mint-glow);
      box-shadow: 0 0 15px rgba(100, 255, 200, 0.35);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-gold {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.35), rgba(180, 83, 9, 0.65));
      border-color: var(--gold);
      color: #fffbeb;
    }

    input[type="text"] {
      background: rgba(8, 15, 18, 0.85);
      border: 1px solid rgba(100, 255, 200, 0.35);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1.1rem;
      outline: none;
      width: 100%;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: var(--mint-glow);
      box-shadow: 0 0 12px rgba(100, 255, 200, 0.25);
    }

    /* Стартовый экран выбора режима */
    .center-screen {
      margin: auto;
      padding: 36px;
      max-width: 540px;
      width: 92%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .title-glow {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #a7f3d0, #64ffc8, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: rgba(236, 253, 245, 0.75);
      line-height: 1.5;
    }

    /* Сетка экрана ХОСТА */
    .host-layout {
      display: grid;
      grid-template-columns: 330px 1fr 340px;
      grid-template-rows: 74px 1fr 235px;
      gap: 16px;
      padding: 16px;
      width: 100vw;
      height: 100vh;
    }

    .host-header {
      grid-column: 1 / 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .pin-badge {
      background: rgba(100, 255, 200, 0.12);
      border: 1px solid var(--mint-glow);
      padding: 6px 16px;
      border-radius: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--mint-glow);
    }

    .host-left {
      grid-column: 1 / 2;
      grid-row: 2 / 4;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .host-center {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
    }

    .host-right {
      grid-column: 3 / 4;
      grid-row: 2 / 4;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .host-bottom {
      grid-column: 2 / 3;
      grid-row: 3 / 4;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Карточка игрока в левой панели */
    .player-card {
      background: rgba(10, 18, 22, 0.65);
      border: 1px solid rgba(100, 255, 200, 0.15);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .player-card.ready {
      border-color: var(--mint-glow);
      box-shadow: inset 0 0 12px rgba(100, 255, 200, 0.12);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .gold-pill {
      color: var(--gold);
      font-weight: 800;
      font-size: 0.95rem;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .mini-buildings {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .b-tag {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .b-tag.monument {
      background: rgba(255, 209, 102, 0.2);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 700;
    }

    /* Рынок зданий внизу */
    .market-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      height: 100%;
    }

    .market-item {
      background: rgba(8, 16, 20, 0.8);
      border: 1px solid rgba(100, 255, 200, 0.22);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .market-item.monument-card {
      border-color: rgba(255, 209, 102, 0.55);
      background: linear-gradient(180deg, rgba(45, 35, 15, 0.8), rgba(15, 20, 25, 0.85));
    }

    /* Лог событий справа */
    .event-log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      font-size: 0.86rem;
    }

    .log-entry {
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid var(--mint-glow);
      padding: 7px 10px;
      border-radius: 0 8px 8px 0;
      line-height: 1.35;
    }

    /* Визуализация кубика и Покровителей */
    .dice-box {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      background: linear-gradient(135deg, #10b981, #047857);
      border: 2px solid var(--mint-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 30px rgba(100, 255, 200, 0.45);
      margin: 14px auto;
    }

    .patron-cards-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      width: 100%;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .patron-card {
      flex: 1;
      min-width: 175px;
      max-width: 240px;
      background: rgba(12, 22, 27, 0.85);
      border: 1px solid rgba(100, 255, 200, 0.25);
      border-radius: 14px;
      padding: 12px;
      text-align: left;
    }

    /* Мобильный клиент */
    .client-layout {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .client-choice-btn {
      width: 100%;
      text-align: left;
      padding: 14px;
      border-radius: 12px;
      background: rgba(15, 28, 34, 0.85);
      border: 1px solid rgba(100, 255, 200, 0.28);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .client-choice-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .client-choice-btn.selected {
      border: 2px solid var(--mint-glow);
      background: rgba(16, 185, 129, 0.22);
    }
  </style>
</head>
<body>

  <!-- Изометрический процедурный фон -->
  <canvas id="iso-canvas"></canvas>

  <!-- Контейнер приложения -->
  <div id="app"></div>

  <script>
    /*************************************************************************
     * 1. ПРОЦЕДУРНЫЙ ИЗОМЕТРИЧЕСКИЙ ФОН (HTML5 CANVAS)
     * Парящие острова, сосны, извилистые тропы, мятные сферы и лучи света
     *************************************************************************/
    const canvas = document.getElementById('iso-canvas');
    const ctx = canvas.getContext('2d');
    let cw, ch;

    const orbs = [];
    const islands = [
      { xRatio: 0.22, yRatio: 0.35, w: 180, h: 90, phase: 0.0, trees: [[-45, -10], [35, -18], [5, 12]] },
      { xRatio: 0.50, yRatio: 0.48, w: 280, h: 140, phase: 1.5, trees: [[-80, -15], [-30, -35], [65, -20], [85, 10], [-15, 25]] },
      { xRatio: 0.78, yRatio: 0.33, w: 190, h: 95, phase: 3.1, trees: [[-40, -12], [25, -20], [45, 8]] },
      { xRatio: 0.33, yRatio: 0.72, w: 150, h: 75, phase: 4.4, trees: [[-20, -10], [30, 5]] },
      { xRatio: 0.70, yRatio: 0.68, w: 165, h: 82, phase: 2.2, trees: [[-30, -8], [15, -18], [35, 10]] }
    ];

    function resizeCanvas() {
      cw = canvas.width = window.innerWidth;
      ch = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 42; i++) {
      orbs.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 1.8 + Math.random() * 4.5,
        vy: 0.25 + Math.random() * 0.65,
        alpha: 0.2 + Math.random() * 0.6,
        drift: Math.random() * Math.PI * 2
      });
    }

    function drawIsoIsland(cx, cy, w, h) {
      // Нижний каменный конус острова
      ctx.beginPath();
      ctx.moveTo(cx - w / 2, cy);
      ctx.lineTo(cx, cy + h * 0.95);
      ctx.lineTo(cx + w / 2, cy);
      ctx.closePath();
      const rockGrad = ctx.createLinearGradient(cx, cy, cx, cy + h);
      rockGrad.addColorStop(0, '#0f3538');
      rockGrad.addColorStop(1, '#041012');
      ctx.fillStyle = rockGrad;
      ctx.fill();

      // Верхняя изометрическая грань (изумрудная плашка)
      ctx.beginPath();
      ctx.moveTo(cx, cy - h / 2);
      ctx.lineTo(cx + w / 2, cy);
      ctx.lineTo(cx, cy + h / 2);
      ctx.lineTo(cx - w / 2, cy);
      ctx.closePath();
      const topGrad = ctx.createLinearGradient(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);
      topGrad.addColorStop(0, '#134e4a');
      topGrad.addColorStop(0.5, '#0f3d39');
      topGrad.addColorStop(1, '#062421');
      ctx.fillStyle = topGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(100, 255, 200, 0.28)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Извилистая светящаяся тропа на острове
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.25, cy - h * 0.12);
      ctx.quadraticCurveTo(cx, cy + h * 0.08, cx + w * 0.25, cy - h * 0.08);
      ctx.strokeStyle = 'rgba(100, 255, 200, 0.45)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function drawPineTree(tx, ty) {
      // Ствол
      ctx.fillStyle = '#051b18';
      ctx.fillRect(tx - 2, ty - 6, 4, 8);
      // 3 яруса хвои
      for (let tier = 0; tier < 3; tier++) {
        const yOff = ty - 6 - tier * 9;
        const width = 12 - tier * 2.5;
        ctx.beginPath();
        ctx.moveTo(tx, yOff - 14);
        ctx.lineTo(tx + width, yOff);
        ctx.lineTo(tx - width, yOff);
        ctx.closePath();
        ctx.fillStyle = tier === 2 ? '#34d399' : tier === 1 ? '#10b981' : '#059669';
        ctx.fill();
      }
    }

    function animateBackground(time) {
      const t = time * 0.001;
      // Глубокий градиент неба архипелага
      const bgGrad = ctx.createRadialGradient(cw * 0.5, ch * 0.3, 50, cw * 0.5, ch * 0.5, Math.max(cw, ch));
      bgGrad.addColorStop(0, '#11383d');
      bgGrad.addColorStop(0.55, '#091f24');
      bgGrad.addColorStop(1, '#040c0e');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, cw, ch);

      // Мягкие диагональные лучи света
      ctx.save();
      for (let i = 0; i < 4; i++) {
        const rayX = (cw * 0.2) + i * (cw * 0.22) + Math.sin(t * 0.4 + i) * 30;
        const rayGrad = ctx.createLinearGradient(rayX, 0, rayX + 180, ch);
        rayGrad.addColorStop(0, 'rgba(100, 255, 200, 0.06)');
        rayGrad.addColorStop(1, 'rgba(100, 255, 200, 0)');
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(rayX - 60, 0);
        ctx.lineTo(rayX + 80, 0);
        ctx.lineTo(rayX + 340, ch);
        ctx.lineTo(rayX + 120, ch);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Астральные мосты между парящими островами
      ctx.beginPath();
      islands.forEach((isl, idx) => {
        const ix = cw * isl.xRatio;
        const iy = ch * isl.yRatio + Math.sin(t * 1.4 + isl.phase) * 8;
        if (idx === 0) ctx.moveTo(ix, iy);
        else ctx.lineTo(ix, iy);
      });
      ctx.strokeStyle = 'rgba(100, 255, 200, 0.14)';
      ctx.setLineDash([6, 8]);
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);

      // Рисуем парящие острова и сосны
      islands.forEach(isl => {
        const ix = cw * isl.xRatio;
        const iy = ch * isl.yRatio + Math.sin(t * 1.4 + isl.phase) * 8;
        drawIsoIsland(ix, iy, isl.w, isl.h);
        isl.trees.forEach(([ox, oy]) => drawPineTree(ix + ox, iy + oy));
      });

      // Плавающие светящиеся мятные сферы
      orbs.forEach(o => {
        o.y -= o.vy;
        o.x += Math.sin(t + o.drift) * 0.35;
        if (o.y < -20) {
          o.y = ch + 20;
          o.x = Math.random() * cw;
        }
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(100, 255, 200, ${o.alpha})`;
        ctx.shadowColor = '#64ffc8';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      requestAnimationFrame(animateBackground);
    }
    requestAnimationFrame(animateBackground);

    /*************************************************************************
     * 2. ДАННЫЕ ИГРЫ: ПОКРОВИТЕЛИ И ЗДАНИЯ (СТРОГО НА РУССКОМ ЯЗЫКЕ)
     *************************************************************************/
    const PATRONS = {
      sonya: {
        id: 'sonya',
        name: 'Соня',
        title: 'Хранительница Тишины',
        color: '#a3e635',
        desc: 'Не выносит резких звуков и толпы. Защищает ваше Золото от Степана. Даёт +3 Золота, если её выбрали ТОЛЬКО ВЫ (иначе лишь +1 Золото). На кубике 1–2 приносит ещё +2 Золота.'
      },
      natasha: {
        id: 'natasha',
        name: 'Наташа',
        title: 'Повелительница Потока',
        color: '#38bdf8',
        desc: 'Неутолимый аппетит и водная стихия. Мгновенно даёт +2 Золота + по 1 Золоту за каждое ваше Водное здание. Даёт скидку 1 Золото на постройку в этом раунде.'
      },
      stepan: {
        id: 'stepan',
        name: 'Степан',
        title: 'Душа Компании и Авантюрист',
        color: '#fb923c',
        desc: 'Обожает быть в центре событий! Забирает по 1 Золоту у каждого игрока с Наташей (Соня защищает). Если на кубике выпадает 4, 5 или 6 — получает +3 Золота из казны.'
      }
    };

    const BUILDINGS = [
      {
        id: 'moss_garden',
        name: 'Мшистый Сад Сони',
        cost: 2,
        dice: [1, 2],
        type: 'quiet',
        monument: false,
        income: 2,
        desc: 'Кубик [1–2]: +2 Золота владельцу.'
      },
      {
        id: 'fountain_stream',
        name: 'Бурлящий Источник',
        cost: 3,
        dice: [2, 3],
        type: 'water',
        monument: false,
        income: 2,
        desc: 'Кубик [2–3]: +2 Золота (Водное здание Наташи).'
      },
      {
        id: 'fish_pier',
        name: 'Рыбный Причал Наташи',
        cost: 4,
        dice: [3, 4],
        type: 'water',
        monument: false,
        income: 3,
        desc: 'Кубик [3–4]: +3 Золота (Водное здание Наташи).'
      },
      {
        id: 'stepan_tavern',
        name: 'Шумная Площадь Степана',
        cost: 4,
        dice: [4, 5],
        type: 'adventure',
        monument: false,
        income: 3,
        desc: 'Кубик [4–5]: +3 Золота владельцу.'
      },
      {
        id: 'emerald_observatory',
        name: 'Астральный Маяк',
        cost: 5,
        dice: [5, 6],
        type: 'quiet',
        monument: false,
        income: 4,
        desc: 'Кубик [5–6]: +4 Золота владельцу.'
      },
      {
        id: 'grand_monument',
        name: 'Великий Монумент Трёх',
        cost: 8,
        dice: [6],
        type: 'monument',
        monument: true,
        income: 2,
        desc: 'Кубик [6]: +2 Золота. Постройте 3 Монумента для ПОБЕДЫ!'
      }
    ];

    const ROOM_PREFIX = 'aurental-room-';
    const appEl = document.getElementById('app');

    // Состояние приложения
    let mode = 'MENU'; // MENU | HOST | CLIENT
    let peer = null;

    /*************************************************************************
     * 3. НАЧАЛЬНОЕ МЕНЮ ВЫБОРА РЕЖИМА
     *************************************************************************/
    function renderMenu() {
      appEl.innerHTML = `
        <div class="glass-panel center-screen">
          <div>
            <div class="title-glow">ИЗУМРУДНЫЙ АРХИПЕЛАГ</div>
            <div style="font-weight:700; color:var(--mint-glow); margin-bottom:8px;">Хроники Трёх Покровителей: Соня, Наташа, Степан</div>
            <p class="subtitle">
              Экономическая настольная стратегия для 2–8 игроков.
              Запустите <b>Главный экран</b> на ТВ или мониторе, а со смартфонов подключитесь по 4-значному коду комнаты!
            </p>
          </div>

          <button class="btn btn-gold" id="btn-start-host" style="font-size:1.15rem; padding:16px;">
            Создать комнату (Главный Экран / ТВ)
          </button>

          <div style="border-top: 1px solid rgba(100,255,200,0.2); padding-top: 16px; display:flex; flex-direction:column; gap:10px;">
            <div style="font-weight:600; font-size:0.95rem;">Подключиться как Игрок (Смартфон)</div>
            <input type="text" id="input-pin" maxlength="4" placeholder="Код комнаты (4 цифры)" />
            <input type="text" id="input-name" maxlength="14" placeholder="Ваше имя" />
            <button class="btn" id="btn-join-client">Войти в игру</button>
            <div id="menu-error" style="color:#f87171; font-size:0.85rem; min-height:1.2em;"></div>
          </div>
        </div>
      `;

      document.getElementById('btn-start-host').onclick = initHostMode;
      document.getElementById('btn-join-client').onclick = () => {
        const pin = document.getElementById('input-pin').value.trim();
        const name = document.getElementById('input-name').value.trim() || 'Путник';
        if (!/^\d{4}$/.test(pin)) {
          document.getElementById('menu-error').textContent = 'Введите корректный 4-значный PIN-код!';
          return;
        }
        initClientMode(pin, name);
      };
    }

    /*************************************************************************
     * 4. ЛОГИКА ХОСТА (ГЛАВНЫЙ ЭКРАН И ИГРОВОЙ СЕРВЕР)
     *************************************************************************/
    const hostState = {
      pin: '',
      phase: 'LOBBY', // LOBBY | ROLE_SELECT | REVEAL | BUILD | GAME_OVER
      round: 1,
      lastDice: null,
      winner: null,
      players: [], // { id, name, gold, buildings:[], chosenRole, chosenBuild, ready, isBot, conn }
      logs: []
    };

    function addHostLog(msg) {
      hostState.logs.unshift(msg);
      if (hostState.logs.length > 35) hostState.logs.pop();
    }

    function initHostMode() {
      mode = 'HOST';
      hostState.pin = String(Math.floor(1000 + Math.random() * 9000));
      const peerId = ROOM_PREFIX + hostState.pin;

      addHostLog(`Создаётся астральная комната #${hostState.pin}...`);
      renderHostScreen();

      peer = new Peer(peerId);

      peer.on('open', () => {
        addHostLog(`Комната открыта! Введите PIN ${hostState.pin} на смартфонах.`);
        renderHostScreen();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          hostState.pin = String(Math.floor(1000 + Math.random() * 9000));
          initHostMode();
        } else {
          addHostLog(`Сетевое уведомление: ${err.message}`);
          renderHostScreen();
        }
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => handleHostReceiveData(conn, data));
        conn.on('close', () => {
          const p = hostState.players.find(pl => pl.id === conn.peer);
          if (p) addHostLog(`Игрок ${p.name} потерял связь.`);
        });
      });
    }

    function handleHostReceiveData(conn, data) {
      if (data.type === 'JOIN') {
        if (hostState.players.length >= 8 && !hostState.players.find(p => p.name === data.name)) {
          conn.send({ type: 'ERROR', message: 'Комната уже заполнена (макс. 8 игроков).' });
          return;
        }
        let player = hostState.players.find(p => p.id === conn.peer);
        if (!player) {
          player = {
            id: conn.peer,
            name: data.name.slice(0, 14),
            gold: 4,
            buildings: ['moss_garden'], // Стартовое здание у каждого игрока
            chosenRole: null,
            chosenBuild: null,
            ready: false,
            isBot: false,
            conn: conn
          };
          hostState.players.push(player);
          addHostLog(`Игрок «${player.name}» присоединился к Архипелагу!`);
        }
        syncAllClients();
        renderHostScreen();
      }

      if (data.type === 'SELECT_ROLE' && hostState.phase === 'ROLE_SELECT') {
        const player = hostState.players.find(p => p.id === conn.peer);
        if (player && PATRONS[data.role]) {
          player.chosenRole = data.role;
          player.ready = true;
          syncAllClients();
          renderHostScreen();
          checkPhaseCompletion();
        }
      }

      if (data.type === 'SELECT_BUILD' && hostState.phase === 'BUILD') {
        const player = hostState.players.find(p => p.id === conn.peer);
        if (player) {
          player.chosenBuild = data.buildingId; // или 'PASS'
          player.ready = true;
          syncAllClients();
          renderHostScreen();
          checkPhaseCompletion();
        }
      }
    }

    function addBotPlayer() {
      if (hostState.players.length >= 8) return;
      const botNames = ['Хранитель Мха', 'Лорд Ручья', 'Капитан Когтей', 'Тень Папоротника', 'Искатель Росы', 'Барон Янтаря'];
      const used = hostState.players.map(p => p.name);
      const available = botNames.filter(n => !used.includes(n));
      const name = available[0] || `Автоматон-${hostState.players.length + 1}`;

      hostState.players.push({
        id: 'bot-' + Math.random().toString(36).substring(2, 7),
        name,
        gold: 4,
        buildings: ['moss_garden'],
        chosenRole: null,
        chosenBuild: null,
        ready: false,
        isBot: true,
        conn: null
      });
      addHostLog(`Добавлен ИИ-соперник «${name}».`);
      renderHostScreen();
    }

    function runBotsDecisions() {
      const roles = ['sonya', 'natasha', 'stepan'];
      hostState.players.forEach(p => {
        if (!p.isBot) return;
        if (hostState.phase === 'ROLE_SELECT' && !p.ready) {
          p.chosenRole = roles[Math.floor(Math.random() * roles.length)];
          p.ready = true;
        }
        if (hostState.phase === 'BUILD' && !p.ready) {
          const discount = p.chosenRole === 'natasha' ? 1 : 0;
          const affordable = BUILDINGS.filter(b => Math.max(1, b.cost - discount) <= p.gold);
          if (affordable.length > 0) {
            // Приоритет на Монумент, если хватает золота
            const mon = affordable.find(b => b.monument);
            const pick = mon || affordable[Math.floor(Math.random() * affordable.length)];
            p.chosenBuild = pick.id;
          } else {
            p.chosenBuild = 'PASS';
          }
          p.ready = true;
        }
      });
    }

    function startGameFromLobby() {
      if (hostState.players.length < 2) {
        addHostLog('Для начала партии нужно минимум 2 участника (добавьте ИИ-бота или подключитесь с телефона).');
        renderHostScreen();
        return;
      }
      hostState.round = 1;
      startRoleSelectionPhase();
    }

    function startRoleSelectionPhase() {
      hostState.phase = 'ROLE_SELECT';
      hostState.players.forEach(p => {
        p.chosenRole = null;
        p.chosenBuild = null;
        p.ready = false;
      });
      addHostLog(`--- Раунд ${hostState.round}: Фаза Тайного Выбора Покровителя ---`);
      runBotsDecisions();
      syncAllClients();
      renderHostScreen();
      checkPhaseCompletion();
    }

    function checkPhaseCompletion() {
      const allReady = hostState.players.length > 0 && hostState.players.every(p => p.ready);
      if (!allReady) return;

      if (hostState.phase === 'ROLE_SELECT') {
        resolveRolesAndRollDice();
      } else if (hostState.phase === 'BUILD') {
        resolveBuilds();
      }
    }

    function resolveRolesAndRollDice() {
      hostState.phase = 'REVEAL';
      const dice = Math.floor(1 + Math.random() * 6);
      hostState.lastDice = dice;

      const sonyaPlayers = hostState.players.filter(p => p.chosenRole === 'sonya');
      const natashaPlayers = hostState.players.filter(p => p.chosenRole === 'natasha');
      const stepanPlayers = hostState.players.filter(p => p.chosenRole === 'stepan');

      // 1. Эффекты Сони
      if (sonyaPlayers.length === 1) {
        sonyaPlayers[0].gold += 3;
        addHostLog(`🐾 Соня довольна уединением! ${sonyaPlayers[0].name} получает +3 Золота.`);
      } else if (sonyaPlayers.length > 1) {
        sonyaPlayers.forEach(p => p.gold += 1);
        addHostLog(`🐾 Соню потревожили (${sonyaPlayers.length} игр.): каждый получает лишь +1 Золото.`);
      }
      if (dice <= 2 && sonyaPlayers.length > 0) {
        sonyaPlayers.forEach(p => p.gold += 2);
        addHostLog(`🌙 Тихий час (кубик ${dice}): покровители Сони получают ещё по +2 Золота!`);
      }

      // 2. Эффекты Наташи
      natashaPlayers.forEach(p => {
        const waterCount = p.buildings.filter(bId => {
          const b = BUILDINGS.find(x => x.id === bId);
          return b && b.type === 'water';
        }).length;
        const gain = 2 + waterCount;
        p.gold += gain;
        addHostLog(`💧 Наташа приносит потоки для ${p.name}: +${gain} Золота.`);
      });

      // 3. Эффекты Степана
      stepanPlayers.forEach(stepanP => {
        let stolen = 0;
        natashaPlayers.forEach(victim => {
          if (victim.gold > 0) {
            victim.gold -= 1;
            stepanP.gold += 1;
            stolen += 1;
          }
        });
        if (stolen > 0) {
          addHostLog(`🔥 Степан (${stepanP.name}) перехватил ${stolen} Золота у поклонников Наташи!`);
        }
        if (dice >= 4) {
          stepanP.gold += 3;
          addHostLog(`🎲 Авантюра Степана удалась (кубик ${dice}): ${stepanP.name} получает +3 Золота!`);
        }
      });

      // 4. Доход от зданий по броску кубика
      hostState.players.forEach(p => {
        let bGain = 0;
        p.buildings.forEach(bId => {
          const b = BUILDINGS.find(x => x.id === bId);
          if (b && b.dice.includes(dice)) {
            bGain += b.income;
          }
        });
        if (bGain > 0) {
          p.gold += bGain;
          addHostLog(`🏛️ Кварталы ${p.name} принесли +${bGain} Золота на броске [${dice}].`);
        }
      });

      syncAllClients();
      renderHostScreen();
    }

    function startBuildPhase() {
      hostState.phase = 'BUILD';
      hostState.players.forEach(p => {
        p.chosenBuild = null;
        p.ready = false;
      });
      addHostLog(`🔨 Фаза Строительства: выберите квартал или Монумент на смартфонах.`);
      runBotsDecisions();
      syncAllClients();
      renderHostScreen();
      checkPhaseCompletion();
    }

    function resolveBuilds() {
      hostState.players.forEach(p => {
        if (!p.chosenBuild || p.chosenBuild === 'PASS') {
          addHostLog(`${p.name} копит Золото и пропускает строительство.`);
          return;
        }
        const b = BUILDINGS.find(x => x.id === p.chosenBuild);
        if (!b) return;
        const discount = p.chosenRole === 'natasha' ? 1 : 0;
        const finalCost = Math.max(1, b.cost - discount);

        if (p.gold >= finalCost) {
          p.gold -= finalCost;
          p.buildings.push(b.id);
          addHostLog(`🏗️ ${p.name} возводит «${b.name}» за ${finalCost} Золота!`);
        }
      });

      // Проверка условия победы (3 Великих Монумента)
      const winners = hostState.players.filter(p => {
        const monCount = p.buildings.filter(id => id === 'grand_monument').length;
        return monCount >= 3;
      });

      if (winners.length > 0) {
        winners.sort((a, b) => b.gold - a.gold);
        hostState.winner = winners[0];
        hostState.phase = 'GAME_OVER';
        addHostLog(`👑 ПОБЕДА! ${hostState.winner.name} возвёл 3 Великих Монумента!`);
        syncAllClients();
        renderHostScreen();
      } else {
        hostState.round += 1;
        startRoleSelectionPhase();
      }
    }

    function syncAllClients() {
      hostState.players.forEach(p => {
        if (p.conn && p.conn.open) {
          p.conn.send({
            type: 'STATE_UPDATE',
            phase: hostState.phase,
            round: hostState.round,
            lastDice: hostState.lastDice,
            winner: hostState.winner ? hostState.winner.name : null,
            me: {
              name: p.name,
              gold: p.gold,
              buildings: p.buildings,
              chosenRole: p.chosenRole,
              chosenBuild: p.chosenBuild,
              ready: p.ready
            }
          });
        }
      });
    }

    function renderHostScreen() {
      if (mode !== 'HOST') return;

      const playersHtml = hostState.players.map(p => {
        const monumentsCount = p.buildings.filter(id => id === 'grand_monument').length;
        const bTags = p.buildings.map(id => {
          const b = BUILDINGS.find(x => x.id === id);
          return `<span class="b-tag ${b.monument ? 'monument' : ''}">${b.name}</span>`;
        }).join('');

        const roleBadge = (hostState.phase === 'REVEAL' || hostState.phase === 'BUILD') && p.chosenRole
          ? `<span style="color:${PATRONS[p.chosenRole].color}; font-size:0.8rem;">● ${PATRONS[p.chosenRole].name}</span>`
          : (p.ready ? `<span style="color:var(--mint-glow); font-size:0.8rem;">✔ Готов</span>` : `<span style="opacity:0.5; font-size:0.8rem;">Ожидание...</span>`);

        return `
          <div class="player-card ${p.ready ? 'ready' : ''}">
            <div class="player-header">
              <span>${p.name} ${p.isBot ? '🤖' : ''}</span>
              <span class="gold-pill">🪙 ${p.gold}</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              ${roleBadge}
              <span style="font-size:0.78rem; color:var(--gold);">Монументы: ${monumentsCount}/3</span>
            </div>
            <div class="mini-buildings">${bTags}</div>
          </div>
        `;
      }).join('');

      let centerContent = '';
      if (hostState.phase === 'LOBBY') {
        centerContent = `
          <div class="title-glow" style="font-size:1.75rem;">ОЖИДАНИЕ АРХИТЕКТОРОВ</div>
          <p class="subtitle" style="max-width:480px; margin:8px 0 18px;">
            Откройте эту страницу на смартфонах, введите код комнаты <b>${hostState.pin}</b> и выберите имя.
          </p>
          <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
            <button class="btn" id="btn-add-bot">+ Добавить ИИ-Бота</button>
            <button class="btn btn-gold" id="btn-start-game" ${hostState.players.length < 2 ? 'disabled' : ''}>
              Начать Игру (${hostState.players.length}/8)
            </button>
          </div>
        `;
      } else if (hostState.phase === 'ROLE_SELECT') {
        centerContent = `
          <div style="font-size:1.35rem; font-weight:800; color:var(--mint-glow);">РАУНД ${hostState.round}: ВЫБОР ПОКРОВИТЕЛЯ</div>
          <p class="subtitle">Игроки на своих смартфонах тайно призывают Соню, Наташу или Степана...</p>
          <div class="patron-cards-row">
            ${Object.values(PATRONS).map(pt => `
              <div class="patron-card" style="border-top: 3px solid ${pt.color};">
                <div style="font-weight:800; color:${pt.color}; font-size:1.05rem;">${pt.name}</div>
                <div style="font-size:0.75rem; opacity:0.8; margin-bottom:6px;">${pt.title}</div>
                <div style="font-size:0.78rem; line-height:1.35;">${pt.desc}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (hostState.phase === 'REVEAL') {
        centerContent = `
          <div style="font-size:1.25rem; font-weight:800; color:var(--gold);">ОТКРЫТИЕ ПОКРОВИТЕЛЕЙ И АСТРАЛЬНЫЙ БРОСОК</div>
          <div class="dice-box">${hostState.lastDice}</div>
          <p class="subtitle" style="margin-bottom:14px;">
            Выпало число <b>${hostState.lastDice}</b>! Все соответствующие кварталы и способности Покровителей принесли Золото.
          </p>
          <button class="btn btn-gold" id="btn-go-build">Перейти к Фазе Строительства →</button>
        `;
      } else if (hostState.phase === 'BUILD') {
        centerContent = `
          <div style="font-size:1.4rem; font-weight:800; color:var(--mint-glow);">ФАЗА СТРОИТЕЛЬСТВА</div>
          <p class="subtitle" style="max-width:460px; margin-top:8px;">
            Игроки выбирают новые кварталы или Великие Монументы на своих устройствах.
            Поклонники <b>Наташи</b> получают скидку в 1 Золото!
          </p>
        `;
      } else if (hostState.phase === 'GAME_OVER') {
        centerContent = `
          <div class="title-glow" style="font-size:2.2rem;">👑 ПОБЕДИТЕЛЬ: ${hostState.winner.name}!</div>
          <p class="subtitle" style="margin:10px 0 20px;">
            Три Великих Монумента возвышаются над Изумрудным Архипелагом!
          </p>
          <button class="btn btn-gold" id="btn-restart">Сыграть ещё раз</button>
        `;
      }

      const marketHtml = BUILDINGS.map(b => `
        <div class="market-item ${b.monument ? 'monument-card' : ''}">
          <div>
            <div style="font-weight:800; color:${b.monument ? 'var(--gold)' : 'var(--mint-glow)'};">${b.name}</div>
            <div style="font-size:0.74rem; opacity:0.85; margin-top:4px;">${b.desc}</div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px; border-top:1px solid rgba(255,255,255,0.1); padding-top:4px;">
            <span>🎲 [${b.dice.join(', ')}]</span>
            <span style="color:var(--gold); font-weight:800;">🪙 ${b.cost}</span>
          </div>
        </div>
      `).join('');

      const logsHtml = hostState.logs.map(l => `<div class="log-entry">${l}</div>`).join('');

      appEl.innerHTML = `
        <div class="host-layout">
          <div class="glass-panel host-header">
            <div style="display:flex; align-items:center; gap:14px;">
              <span style="font-weight:800; font-size:1.2rem; color:var(--mint-glow);">ИЗУМРУДНЫЙ АРХИПЕЛАГ</span>
              <span style="font-size:0.88rem; opacity:0.8;">Раунд ${hostState.round} | Цель: 3 Монумента</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:0.85rem; opacity:0.85;">КОД КОМНАТЫ:</span>
              <span class="pin-badge">${hostState.pin}</span>
            </div>
          </div>

          <div class="glass-panel host-left">
            <div style="font-weight:800; font-size:0.95rem; border-bottom:1px solid rgba(100,255,200,0.2); padding-bottom:6px;">
              ИГРОКИ (${hostState.players.length}/8)
            </div>
            ${playersHtml || '<div style="opacity:0.6; font-size:0.85rem;">Ожидание подключения игроков...</div>'}
          </div>

          <div class="glass-panel host-center">
            ${centerContent}
          </div>

          <div class="glass-panel host-right">
            <div style="font-weight:800; font-size:0.95rem; border-bottom:1px solid rgba(100,255,200,0.2); padding-bottom:6px;">
              ЛЕТОПИСЬ СОБЫТИЙ
            </div>
            <div class="event-log">${logsHtml}</div>
          </div>

          <div class="glass-panel host-bottom">
            <div style="font-weight:800; font-size:0.85rem; color:var(--text-muted);">
              ДОСТУПНЫЕ ГОРОДСКИЕ КОНТРАКТЫ И МОНУМЕНТЫ
            </div>
            <div class="market-grid">${marketHtml}</div>
          </div>
        </div>
      `;

      const btnBot = document.getElementById('btn-add-bot');
      if (btnBot) btnBot.onclick = addBotPlayer;

      const btnStart = document.getElementById('btn-start-game');
      if (btnStart) btnStart.onclick = startGameFromLobby;

      const btnBuild = document.getElementById('btn-go-build');
      if (btnBuild) btnBuild.onclick = startBuildPhase;

      const btnRestart = document.getElementById('btn-restart');
      if (btnRestart) btnRestart.onclick = () => {
        hostState.players.forEach(p => {
          p.gold = 4;
          p.buildings = ['moss_garden'];
          p.ready = false;
        });
        hostState.winner = null;
        hostState.round = 1;
        startRoleSelectionPhase();
      };
    }

    /*************************************************************************
     * 5. ЛОГИКА МОБИЛЬНОГО КЛИЕНТА (КОНТРОЛЛЕР НА СМАРТФОНЕ)
     *************************************************************************/
    const clientState = {
      pin: '',
      name: '',
      connected: false,
      phase: 'LOBBY',
      round: 1,
      lastDice: null,
      winner: null,
      me: null,
      conn: null
    };

    function initClientMode(pin, name) {
      mode = 'CLIENT';
      clientState.pin = pin;
      clientState.name = name;
      renderClientScreen('Установка P2P-соединения с Архипелагом...');

      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(ROOM_PREFIX + pin, { reliable: true });
        clientState.conn = conn;

        conn.on('open', () => {
          clientState.connected = true;
          conn.send({ type: 'JOIN', name: clientState.name });
          renderClientScreen();
        });

        conn.on('data', (data) => {
          if (data.type === 'STATE_UPDATE') {
            clientState.phase = data.phase;
            clientState.round = data.round;
            clientState.lastDice = data.lastDice;
            clientState.winner = data.winner;
            clientState.me = data.me;
            renderClientScreen();
          }
          if (data.type === 'ERROR') {
            renderClientScreen(data.message);
          }
        });

        conn.on('close', () => {
          clientState.connected = false;
          renderClientScreen('Соединение с Главным экраном прервано.');
        });
      });

      peer.on('error', () => {
        renderClientScreen('Не удалось найти комнату с кодом ' + pin);
      });
    }

    function renderClientScreen(statusMsg = '') {
      if (mode !== 'CLIENT') return;

      if (!clientState.connected || !clientState.me) {
        appEl.innerHTML = `
          <div class="glass-panel center-screen">
            <div class="title-glow" style="font-size:1.5rem;">ПОДКЛЮЧЕНИЕ</div>
            <p class="subtitle">${statusMsg || 'Ожидание ответа от ведущего экрана...'}</p>
            <button class="btn" onclick="location.reload()">Вернуться в меню</button>
          </div>
        `;
        return;
      }

      const me = clientState.me;
      const monCount = me.buildings.filter(id => id === 'grand_monument').length;

      let actionPanelHtml = '';

      if (clientState.phase === 'LOBBY') {
        actionPanelHtml = `
          <div style="text-align:center; padding:20px 10px;">
            <div style="font-size:1.2rem; font-weight:700; color:var(--mint-glow);">Вы в игре!</div>
            <p class="subtitle" style="margin-top:8px;">Посмотрите на Главный экран и дождитесь начала партии.</p>
          </div>
        `;
      } else if (clientState.phase === 'ROLE_SELECT') {
        if (me.ready) {
          actionPanelHtml = `
            <div style="text-align:center; padding:20px;">
              <div style="font-size:1.15rem; font-weight:700; color:var(--mint-glow);">
                Покровитель выбран: ${PATRONS[me.chosenRole].name}
              </div>
              <p class="subtitle" style="margin-top:6px;">Ожидаем выбор остальных участников...</p>
            </div>
          `;
        } else {
          actionPanelHtml = `
            <div style="font-weight:800; margin-bottom:8px; color:var(--mint-glow);">
              ВЫБЕРИТЕ ПОКРОВИТЕЛЯ НА РАУНД ${clientState.round}:
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${Object.values(PATRONS).map(pt => `
                <button class="client-choice-btn" data-role="${pt.id}">
                  <div style="font-weight:800; font-size:1.05rem; color:${pt.color};">${pt.name} —${pt.title}</div>
                  <div style="font-size:0.82rem; opacity:0.88; line-height:1.35;">${pt.desc}</div>
                </button>
              `).join('')}
            </div>
          `;
        }
      } else if (clientState.phase === 'REVEAL') {
        actionPanelHtml = `
          <div style="text-align:center; padding:18px;">
            <div style="font-size:1.1rem; font-weight:700; color:var(--gold);">Астральный кубик: [${clientState.lastDice}]</div>
            <p class="subtitle" style="margin-top:6px;">Посмотрите результаты распределения Золота на Главном экране!</p>
          </div>
        `;
      } else if (clientState.phase === 'BUILD') {
        if (me.ready) {
          actionPanelHtml = `
            <div style="text-align:center; padding:20px;">
              <div style="font-size:1.15rem; font-weight:700; color:var(--mint-glow);">Приказ на строительство отправлен!</div>
              <p class="subtitle" style="margin-top:6px;">Ожидаем остальных игроков...</p>
            </div>
          `;
        } else {
          const discount = me.chosenRole === 'natasha' ? 1 : 0;
          actionPanelHtml = `
            <div style="font-weight:800; margin-bottom:8px; color:var(--mint-glow);">
              СТРОИТЕЛЬСТВО ${discount ? '(Скидка Наташи -1 🪙)' : ''}:
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${BUILDINGS.map(b => {
                const cost = Math.max(1, b.cost - discount);
                const canAfford = me.gold >= cost;
                return `
                  <button class="client-choice-btn" data-build="${b.id}" ${!canAfford ? 'disabled' : ''}>
                    <div style="display:flex; justify-content:space-between; width:100%; font-weight:800;">
                      <span style="color:${b.monument ? 'var(--gold)' : 'var(--mint-glow)'};">${b.name}</span>
                      <span style="color:var(--gold);">🪙 ${cost}</span>
                    </div>
                    <div style="font-size:0.78rem; opacity:0.85;">${b.desc}</div>
                  </button>
                `;
              }).join('')}
              <button class="btn" data-build="PASS" style="margin-top:4px;">Пропустить и сохранить Золото</button>
            </div>
          `;
        }
      } else if (clientState.phase === 'GAME_OVER') {
        actionPanelHtml = `
          <div style="text-align:center; padding:20px;">
            <div class="title-glow" style="font-size:1.5rem;">Партия завершена!</div>
            <p class="subtitle">Победитель: <b>${clientState.winner}</b></p>
          </div>
        `;
      }

      const myBuildingsList = me.buildings.map(id => {
        const b = BUILDINGS.find(x => x.id === id);
        return `<span class="b-tag ${b.monument ? 'monument' : ''}">${b.name}</span>`;
      }).join('');

      appEl.innerHTML = `
        <div class="client-layout">
          <div class="glass-panel" style="padding:14px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:800; font-size:1.1rem;">${me.name}</div>
              <div style="font-size:0.78rem; color:var(--gold);">Монументы: ${monCount}/3 | Комната #${clientState.pin}</div>
            </div>
            <div class="gold-pill" style="font-size:1.15rem; padding:6px 14px;">🪙 ${me.gold}</div>
          </div>

          <div class="glass-panel" style="padding:14px; flex:1; overflow-y:auto;">
            ${actionPanelHtml}
          </div>

          <div class="glass-panel" style="padding:12px;">
            <div style="font-size:0.78rem; font-weight:700; margin-bottom:6px; opacity:0.8;">ВАШ РАЙОН (${me.buildings.length} постр.):</div>
            <div class="mini-buildings">${myBuildingsList}</div>
          </div>
        </div>
      `;

      document.querySelectorAll('[data-role]').forEach(btn => {
        btn.onclick = () => {
          clientState.conn.send({ type: 'SELECT_ROLE', role: btn.getAttribute('data-role') });
        };
      });

      document.querySelectorAll('[data-build]').forEach(btn => {
        btn.onclick = () => {
          clientState.conn.send({ type: 'SELECT_BUILD', buildingId: btn.getAttribute('data-build') });
        };
      });
    }

    // Запуск стартового экрана
    renderMenu();
  </script>
</body>
</html>
